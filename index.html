// =================== CALENDAR ===================
function calendarHTML() {
  const hist = S.dayHistory || {};
  const today = new Date(); today.setHours(0,0,0,0);
  const WEEKS = 10;

  // Monday of current week
  const dow = today.getDay();
  const daysFromMon = dow === 0 ? 6 : dow - 1;
  const monday = new Date(today);
  monday.setDate(today.getDate() - daysFromMon);

  // Build WEEKS columns of Mon–Fri
  const weeks = [];
  for (let w = WEEKS - 1; w >= 0; w--) {
    const week = [];
    for (let d = 0; d < 5; d++) {
      const date = new Date(monday);
      date.setDate(monday.getDate() - w * 7 + d);
      const dateStr = dStr(date);
      week.push({ dateStr, isFuture: date > today, data: hist[dateStr] });
    }
    weeks.push(week);
  }

  function cellBg(day) {
    if (day.isFuture) return 'transparent';
    if (!day.data || !day.data.answered) return '#ffffff0d';
    if (day.data.correct === 3) return '#F59E0B';
    if (day.data.answered === 3) return 'rgba(245,158,11,.55)';
    return 'rgba(245,158,11,.25)';
  }

  const DAY_LABELS = ['M','T','W','T','F'];
  const rows = [0,1,2,3,4].map(d => {
    const cells = weeks.map(week => {
      const day = week[d];
      return `<div title="${day.dateStr}" style="width:14px;height:14px;border-radius:3px;background:${cellBg(day)};flex-shrink:0"></div>`;
    }).join('');
    return `<div style="display:flex;align-items:center;gap:3px">
      <span style="width:10px;font-size:.55rem;color:var(--muted);flex-shrink:0">${DAY_LABELS[d]}</span>
      <div style="display:flex;gap:3px">${cells}</div>
    </div>`;
  }).join('');

  return `<div class="section">
    <div class="section-title">Activity — last 10 weeks</div>
    <div style="display:flex;flex-direction:column;gap:3px;overflow-x:auto">${rows}</div>
    <div style="display:flex;gap:.75rem;margin-top:.6rem;font-size:.62rem;color:var(--muted);flex-wrap:wrap">
      <span><span style="display:inline-block;width:9px;height:9px;border-radius:2px;background:#ffffff0d;vertical-align:middle;margin-right:3px"></span>Missed</span>
      <span><span style="display:inline-block;width:9px;height:9px;border-radius:2px;background:rgba(245,158,11,.25);vertical-align:middle;margin-right:3px"></span>Partial</span>
      <span><span style="display:inline-block;width:9px;height:9px;border-radius:2px;background:rgba(245,158,11,.55);vertical-align:middle;margin-right:3px"></span>Done</span>
      <span><span style="display:inline-block;width:9px;height:9px;border-radius:2px;background:#F59E0B;vertical-align:middle;margin-right:3px"></span>Perfect</span>
    </div>
  </div>`;
}

  for (let i = a.length-1; i > 0; i--) { const j = Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }

}

function startFlashcard() {
  study.cats = ['finance','japanese_n5','japanese_n4','japanese_n3','trivia'];

  rebuildFlashcardDeck();
  renderStudyView();

function rebuildFlashcardDeck() {
  study.questions = shuffle(study.cats.flatMap(c => Q[c].map(q => ({...q,category:c}))));
  study.idx = 0; study.revealed = false;
}
function flashcardToggleCat(cat) {
  if (study.cats.includes(cat)) { if (study.cats.length===1) return; study.cats=study.cats.filter(c=>c!==cat); }
  else study.cats.push(cat);
  rebuildFlashcardDeck(); renderStudyView();
}
function flashcardReveal() { study.revealed=true; renderStudyView(); }
function flashcardNav(dir) {
  study.idx = (study.idx+dir+study.questions.length) % study.questions.length;
  study.revealed = false; renderStudyView();
}

        : `<button class="btn btn-primary" style="width:100%;margin-top:.5rem" onclick="flashcardReveal()">Show Answer</button>`}
    </div>
    <div style="display:flex;gap:.5rem;margin-top:.25rem">
      <button class="btn" style="flex:1" onclick="flashcardNav(-1)">&#8592; Prev</button>
      <button class="btn" style="flex:1" onclick="flashcardNav(1)">Next &#8594;</button>
    </div>`;
}

// --- MOCK TEST ---
function startMockSetup() {
  study.mode='mock-setup'; study.cats=['finance','japanese_n5','japanese_n4','japanese_n3','trivia']; study.count=10;
  renderStudyView();
}
function mockToggleCat(cat) {
  if (study.cats.includes(cat)) { if (study.cats.length===1) return; study.cats=study.cats.filter(c=>c!==cat); }
  else study.cats.push(cat);
  renderStudyView();
}
function mockSetCount(n) { study.count=n; renderStudyView(); }
function startMockPlay() {
  const pool = shuffle(study.cats.flatMap(c => Q[c].map(q => ({...q,category:c}))));
  study.questions = study.count==='all' ? pool : pool.slice(0,study.count);
  study.idx=0; study.chosen=null; study.answers=[]; study.mode='mock-play';
  renderStudyView();
}
function mockSetupHTML() {
  const total = study.cats.reduce((s,c)=>s+Q[c].length,0);
  const japLevels = ['japanese_n5','japanese_n4','japanese_n3'];
  const catBtns = `
    <button class="study-cat-btn ${study.cats.includes('finance')?'active':''}" onclick="mockToggleCat('finance')">📈 Capital Markets</button>
    <span style="color:var(--muted);font-size:.72rem;padding:.2rem .2rem 0">Japanese:</span>
    ${japLevels.map(c=>`<button class="study-cat-btn ${study.cats.includes(c)?'active':''}" onclick="mockToggleCat('${c}')">${CAT_META[c].emoji} ${CAT_META[c].label.replace('Japanese ','')}</button>`).join('')}
    <button class="study-cat-btn ${study.cats.includes('trivia')?'active':''}" onclick="mockToggleCat('trivia')">🧠 General Trivia</button>`;
  const countBtns = [...STUDY_COUNTS,'all'].map(n => {
    const label = n==='all' ? `All (${total})` : n;
    const handler = n==='all' ? `mockSetCount('all')` : `mockSetCount(${n})`;
    const active = study.count===n;
    const disabled = typeof n==='number' && n>total;
    return `<button class="mock-count-btn ${active?'active':''}" ${disabled?'disabled':''} onclick="${handler}">${label}</button>`;
  }).join('');
  return `<div style="display:flex;align-items:center;gap:.5rem;margin-bottom:1rem">
      <button class="btn" onclick="study.mode='home';renderStudyView()">&#8592; Back</button>
      <span style="font-weight:600">Mock Test Setup</span>
    </div>
    <div class="section">
      <div class="section-title">Categories</div>
      <div style="display:flex;flex-wrap:wrap;gap:.4rem">${catBtns}</div>
    </div>
    <div class="section">
      <div class="section-title">Number of Questions</div>
      <div style="display:flex;flex-wrap:wrap;gap:.4rem">${countBtns}</div>
    </div>
    <button class="btn btn-primary" style="width:100%;margin-top:.5rem" onclick="startMockPlay()">Start Test &#8594;</button>`;
}
function mockAnswerQ(chosen) {
  const q = study.questions[study.idx];
  study.answers.push({q,chosen,correct:chosen===q.answer});
  study.chosen=chosen; renderStudyView();
}
function mockNext() {
  study.idx++; study.chosen=null;
  study.mode = study.idx>=study.questions.length ? 'mock-results' : 'mock-play';
  renderStudyView();
}
function mockPlayHTML() {
  const q = study.questions[study.idx];
  const total = study.questions.length;
  const locked = study.chosen!==null;
  const m = CAT_META[q.category];
  const keys = q.type==='tf' ? ['T','F'] : ['A','B','C','D'];
  const pct = Math.round((study.idx/total)*100);
  const optsHTML = q.options.map((opt,i) => {
    let cls='opt', handler='';
    if (locked) { if (i===q.answer) cls+=' correct'; else if (i===study.chosen) cls+=' wrong'; }
    else handler=`onclick="mockAnswerQ(${i})"`;
    return `<button class="${cls}" ${locked?'disabled':''} ${handler}><span class="opt-key">${keys[i]}</span>${opt}</button>`;
  }).join('');
  const correctSoFar = study.answers.filter(a=>a.correct).length;
  return `<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:.4rem">
      <span style="color:var(--muted);font-size:.8rem">Question ${study.idx+1} of ${total}</span>
      <span style="color:var(--muted);font-size:.8rem">&#10003; ${correctSoFar} correct</span>
    </div>
    <div class="prog-track" style="margin-bottom:.75rem"><div class="prog-fill" style="width:${pct}%"></div></div>
    ${locked ? `<div class="result ${study.chosen===q.answer?'correct':'wrong'}">${study.chosen===q.answer?'&#10003; Correct!':'&#10007; Incorrect'}</div>` : ''}
    <div class="card" style="border-color:${m.color}44">
      <span class="cat-badge" style="background:${m.dim};color:${m.color}">${m.emoji} ${m.label}</span>
      <div class="question">${q.q}</div>
      <div class="options">${optsHTML}</div>
      ${locked ? `<div class="explain"><strong>&#128161;</strong> ${q.explanation}</div>` : ''}
    </div>
    ${locked ? `<button class="btn btn-primary" style="width:100%;margin-top:.25rem" onclick="mockNext()">${study.idx+1<total?'Next Question &#8594;':'See Results &#8594;'}</button>` : ''}`;
}
function mockResultsHTML() {
  const total = study.questions.length;
  const correct = study.answers.filter(a=>a.correct).length;
  const pct = Math.round(correct/total*100);
  const emoji = pct===100?'&#127942;':pct>=80?'&#127919;':pct>=60?'&#128077;':'&#128218;';
  const catStats = ALL_CATS.filter(c=>study.cats.includes(c)).map(c => {
    const ca = study.answers.filter(a=>a.q.category===c);
    const cc = ca.filter(a=>a.correct).length;
    const m = CAT_META[c];
    if (!ca.length) return '';
    return `<div class="stat-card" style="border-color:${m.color}44">
      <div class="val">${m.emoji} ${Math.round(cc/ca.length*100)}%</div>
      <div class="lbl">${m.label} (${cc}/${ca.length})</div>
    </div>`;
  }).join('');
  const missed = study.answers.filter(a=>!a.correct);
  const missedHTML = missed.map(({q,chosen}) => {
    const m = CAT_META[q.category];
    const keys = q.type==='tf'?['T','F']:['A','B','C','D'];
    return `<div class="card" style="border-color:${m.color}44;margin-bottom:.75rem">
      <span class="cat-badge" style="background:${m.dim};color:${m.color}">${m.emoji} ${m.label}</span>
      <div class="question" style="font-size:.9rem">${q.q}</div>
      <div class="options" style="margin-top:.5rem">
        ${q.options.map((opt,i)=>`<button class="opt${i===q.answer?' correct':i===chosen?' wrong':''}" disabled><span class="opt-key">${keys[i]}</span>${opt}</button>`).join('')}
      </div>
      <div class="explain"><strong>&#128161;</strong> ${q.explanation}</div>
    </div>`;
  }).join('');
  return `<div class="rest" style="padding:1.5rem 0 1rem">
      <div class="ico">${emoji}</div>
      <h1 style="font-size:2rem;margin-bottom:.25rem">${correct} / ${total}</h1>
      <p style="font-size:1.1rem;color:${pct>=80?'var(--correct)':pct>=60?'var(--gold)':'var(--wrong)'};font-weight:700">${pct}%</p>
      <p style="margin-top:.5rem">Mock test complete</p>
    </div>
    ${catStats ? `<div class="stat-grid section" style="margin-bottom:1rem">${catStats}</div>` : ''}
    <div style="display:flex;gap:.5rem;flex-wrap:wrap;margin-bottom:1.25rem">
      <button class="btn btn-primary" onclick="startMockSetup()" style="flex:1">Try Again</button>
      <button class="btn" onclick="study.mode='home';renderStudyView()" style="flex:1">&#8592; Study Home</button>
    </div>
    ${missed.length ? `<div class="section-title" style="margin-bottom:.75rem">Missed Questions</div>${missedHTML}` : ''}`
}

// =================== INIT ===================
(function init() {
  Q = JSON.parse(document.getElementById('data-q').textContent);
  loadState();
  refreshFreeze(); if (!isWeekend()) checkStreak();
  renderQuestView();
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
})();
</script>
