<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mizuho Daily Quest</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0d1117">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Daily Quest">
<link rel="apple-touch-icon" href="icon.svg">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}

:root{
  --bg:#0d1117;
  --surface:#161b22;
  --surface2:#1f2937;
  --border:#30363d;
  --text:#e6edf3;
  --muted:#8b949e;
  --correct:#22c55e;
  --wrong:#ef4444;
  --gold:#F59E0B;
}

body{
  background:var(--bg);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  min-height:100vh;
  display:flex;
  flex-direction:column;
}

/* NAV */
nav{
  display:flex;
  background:var(--surface);
  border-bottom:1px solid var(--border);
  padding:0 1rem;
  position:sticky;
  top:0;
  z-index:10;
}
nav button{
  background:none;border:none;color:var(--muted);cursor:pointer;
  font-size:.875rem;font-weight:500;padding:.75rem 1rem;
  border-bottom:2px solid transparent;transition:color .15s,border-color .15s;
}
nav button.active{color:var(--text);border-bottom-color:var(--gold)}

/* LAYOUT */
main{flex:1;padding:1.5rem 1rem;max-width:600px;margin:0 auto;width:100%}

/* STATS BAR */
.stats-bar{display:flex;flex-wrap:wrap;gap:.5rem;margin-bottom:1.25rem}
.chip{
  background:var(--surface);border:1px solid var(--border);border-radius:999px;
  padding:.3rem .75rem;font-size:.8rem;color:var(--muted);
  display:flex;align-items:center;gap:.35rem;
}
.chip strong{color:var(--text);font-weight:600}

/* CATEGORY BADGE */
.cat-badge{
  display:inline-flex;align-items:center;gap:.4rem;
  padding:.25rem .75rem;border-radius:999px;
  font-size:.7rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
  margin-bottom:1rem;
}

/* CARD */
.card{
  background:var(--surface);border:1px solid var(--border);
  border-radius:12px;padding:1.5rem;margin-bottom:1rem;
}
.question{font-size:1.05rem;font-weight:500;line-height:1.55;margin-bottom:1.25rem}

/* OPTIONS */
.options{display:flex;flex-direction:column;gap:.6rem}
.opt{
  background:var(--surface2);border:1px solid var(--border);border-radius:8px;
  color:var(--text);cursor:pointer;display:flex;align-items:center;gap:.75rem;
  font-size:.88rem;padding:.75rem 1rem;text-align:left;transition:background .15s,border-color .15s;width:100%;
}
.opt:hover:not(:disabled){background:#2d3748;border-color:#4a5568}
.opt:disabled{cursor:default}
.opt-key{
  background:var(--border);border-radius:4px;color:var(--muted);
  flex-shrink:0;font-size:.7rem;font-weight:700;padding:.15rem .4rem;
}
.opt.correct{background:rgba(34,197,94,.12);border-color:var(--correct);color:var(--correct)}
.opt.correct .opt-key{background:var(--correct);color:#fff}
.opt.wrong{background:rgba(239,68,68,.1);border-color:var(--wrong);color:var(--wrong);opacity:.7}
.opt.wrong .opt-key{background:var(--wrong);color:#fff}

/* RESULT BANNER */
.result{border-radius:8px;font-size:.9rem;font-weight:600;margin-bottom:1rem;padding:.75rem 1rem}
.result.correct{background:rgba(34,197,94,.15);color:var(--correct)}
.result.wrong{background:rgba(239,68,68,.12);color:var(--wrong)}

/* EXPLANATION */
.explain{
  background:var(--surface2);border-left:3px solid var(--muted);border-radius:0 6px 6px 0;
  color:var(--muted);font-size:.84rem;line-height:1.55;margin-top:1rem;padding:.75rem 1rem;
}
.explain strong{color:var(--text)}

/* BUTTONS */
.btn{
  background:var(--surface2);border:1px solid var(--border);border-radius:8px;
  color:var(--text);cursor:pointer;font-size:.875rem;font-weight:500;padding:.6rem 1.25rem;
  transition:background .15s;
}
.btn:hover{background:#2d3748}
.btn-primary{background:var(--gold);border-color:var(--gold);color:#000}
.btn-primary:hover{background:#d97706;border-color:#d97706}

/* STATS VIEW */
.section{margin-bottom:1.5rem}
.section-title{color:var(--muted);font-size:.68rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;margin-bottom:.75rem}
.big-num{font-size:2.25rem;font-weight:700;line-height:1}
.big-sub{color:var(--muted);font-size:.8rem;margin-top:.25rem}
.stat-grid{display:grid;gap:.65rem;grid-template-columns:1fr 1fr}
.stat-card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:.9rem}
.stat-card .val{font-size:1.4rem;font-weight:700}
.stat-card .lbl{color:var(--muted);font-size:.72rem;margin-top:.15rem}

/* PROGRESS */
.prog-row{display:flex;justify-content:space-between;font-size:.78rem;color:var(--muted);margin-bottom:.4rem}
.prog-track{background:var(--surface2);border-radius:999px;height:8px;overflow:hidden}
.prog-fill{background:linear-gradient(90deg,var(--gold),#f97316);border-radius:999px;height:100%;transition:width .6s ease}

/* BADGES */
.badge-grid{display:flex;flex-wrap:wrap;gap:.6rem}
.badge{
  background:var(--surface);border:1px solid var(--border);border-radius:8px;
  padding:.55rem .7rem;text-align:center;min-width:76px;
  transition:opacity .2s;
}
.badge.earned{border-color:var(--gold);background:rgba(245,158,11,.08)}
.badge:not(.earned){opacity:.35;filter:grayscale(1)}
.badge-ico{font-size:1.4rem;display:block}
.badge-lbl{font-size:.62rem;color:var(--muted);margin-top:.2rem}
.badge.earned .badge-lbl{color:var(--text)}

/* REST SCREEN */
.rest{text-align:center;padding:3rem 1rem}
.rest .ico{font-size:3rem;margin-bottom:1rem}
.rest h1{font-size:1.3rem;margin-bottom:.5rem}
.rest p{color:var(--muted);font-size:.875rem;line-height:1.5}

/* DONE-TODAY */
.done-note{
  display:flex;align-items:center;gap:.5rem;font-size:.82rem;color:var(--muted);margin-bottom:1rem;
}

/* MODAL */
.backdrop{
  position:fixed;inset:0;background:rgba(0,0,0,.75);
  display:flex;align-items:center;justify-content:center;padding:1rem;z-index:100;
}
.modal{
  background:var(--surface);border:1px solid var(--border);border-radius:12px;
  max-width:360px;padding:1.5rem;width:100%;
}
.modal h2{font-size:1.05rem;margin-bottom:.5rem}
.modal p{color:var(--muted);font-size:.86rem;line-height:1.5;margin-bottom:1.25rem}
.modal-actions{display:flex;gap:.5rem;justify-content:flex-end}

/* TOAST */
.toast{
  background:var(--surface);border:1px solid var(--gold);border-radius:10px;
  bottom:1.5rem;box-shadow:0 4px 24px rgba(0,0,0,.5);left:50%;
  max-width:320px;padding:.75rem 1rem;position:fixed;
  transform:translateX(-50%);transition:opacity .3s,transform .3s;
  width:calc(100% - 2rem);z-index:200;font-size:.875rem;
}
.toast.hide{opacity:0;transform:translateX(-50%) translateY(.75rem);pointer-events:none}

hr{border:none;border-top:1px solid var(--border);margin:1.25rem 0}

/* STUDY MODE */
.study-mode-card{
  background:var(--surface);border:1px solid var(--border);border-radius:12px;
  padding:1.25rem;cursor:pointer;display:flex;align-items:flex-start;gap:1rem;
  text-align:left;width:100%;transition:background .15s,border-color .15s;color:var(--text);
}
.study-mode-card:hover{background:var(--surface2);border-color:#4a5568}
.study-mode-card .ico{font-size:1.75rem;flex-shrink:0;margin-top:.1rem}
.study-cat-btn{
  background:var(--surface2);border:1px solid var(--border);border-radius:999px;
  color:var(--muted);cursor:pointer;font-size:.78rem;font-weight:600;padding:.35rem .85rem;
  transition:background .15s,border-color .15s,color .15s;
}
.study-cat-btn.active{color:var(--text);border-color:var(--gold);background:rgba(245,158,11,.12)}
.mock-count-btn{
  background:var(--surface2);border:1px solid var(--border);border-radius:8px;
  color:var(--muted);cursor:pointer;font-size:.88rem;font-weight:500;padding:.55rem .75rem;
  transition:background .15s,border-color .15s,color .15s;flex:1;
}
.mock-count-btn.active{color:var(--text);border-color:var(--gold);background:rgba(245,158,11,.12)}
.mock-count-btn:disabled{opacity:.4;cursor:default}

.freeze-note{font-size:.78rem;color:var(--muted);margin-top:.5rem;display:flex;align-items:center;gap:.3rem}
.freeze-note.avail{color:#60a5fa}

@media(max-width:400px){
  .stat-grid{grid-template-columns:1fr}
  .badge{min-width:68px}
}

/* INSTALL BANNER */
.install-bar{
  background:var(--surface);border-bottom:1px solid var(--border);
  padding:.5rem 1rem;display:flex;align-items:center;gap:.5rem;
  font-size:.8rem;color:var(--muted);
}
.install-bar button{
  background:none;border:1px solid var(--gold);border-radius:6px;
  color:var(--gold);cursor:pointer;font-size:.75rem;padding:.2rem .6rem;
}
.install-bar .dismiss{border-color:transparent;color:var(--muted);margin-left:auto}
</style>
</head>
<body>

<nav>
  <button class="active" id="tab-quest" onclick="switchTab('quest')">Today&#8217;s Quest</button>
  <button id="tab-stats" onclick="switchTab('stats')">My Stats</button>
  <button id="tab-study" onclick="switchTab('study')">Study</button>
</nav>
<div class="install-bar" id="install-banner" hidden>
  &#128242; Add to Home Screen for daily reminders
  <button onclick="installApp()">Install</button>
  <button class="dismiss" onclick="document.getElementById('install-banner').hidden=true">&#10005;</button>
</div>

<main>
  <div id="view-quest"></div>
  <div id="view-stats" hidden></div>
  <div id="view-study" hidden></div>
</main>

<!-- Streak SOS modal -->
<div class="backdrop" id="modal-sos" hidden>
  <div class="modal">
    <h2>&#10052;&#65039; Streak SOS!</h2>
    <p id="sos-msg"></p>
    <div class="modal-actions">
      <button class="btn" onclick="declineFreeze()">Let it reset</button>
      <button class="btn btn-primary" onclick="useFreeze()">Use freeze &#10052;&#65039;</button>
    </div>
  </div>
</div>

<!-- Badge toast -->
<div class="toast hide" id="toast"></div>

<!-- ===================== QUESTION BANK =====================
     Add more questions to each array below.
     Each entry: { q, type ("mc"|"tf"), options (array), answer (0-based index), explanation }
     Target: ~122 per category for a full year of unique daily questions.
-->
<script type="application/json" id="data-q">
{
  "finance": [
    {"q":"What does IPO stand for?","type":"mc","options":["Initial Public Offering","International Payment Order","Institutional Portfolio Option","Interim Profit Objective"],"answer":0,"explanation":"An IPO (Initial Public Offering) is when a private company first sells shares to the public on a stock exchange to raise capital. Famous IPOs include Google (2004), Facebook (2012), and Alibaba (2014)."},
    {"q":"A bond is a form of equity ownership in a company.","type":"tf","options":["True","False"],"answer":1,"explanation":"False — a bond is a debt instrument. When you buy a bond, you are lending money to the issuer and receiving interest payments. Stocks (equity) represent ownership. Bondholders are creditors; stockholders are owners."},
    {"q":"What is market capitalization?","type":"mc","options":["A company's annual revenue","Share price × total outstanding shares","A company's total debt","Book value of all assets"],"answer":1,"explanation":"Market cap = share price × total shares outstanding. It represents the total market value of a company. Categories: mega-cap (>$200B), large-cap (>$10B), mid-cap ($2–10B), small-cap (<$2B)."},
    {"q":"What does 'going long' on a stock mean?","type":"mc","options":["Holding a stock for many years","Buying expecting the price to rise","Borrowing shares to sell short","Trading very large volumes"],"answer":1,"explanation":"Going long means buying an asset expecting its price will rise so you can sell at a profit. It's the most basic investment position. The opposite — betting on a price decline — is called 'going short.'"},
    {"q":"A bear market is defined as a market decline of at least 20% from recent highs.","type":"tf","options":["True","False"],"answer":0,"explanation":"True — by convention, a bear market is a sustained decline of 20%+ from a recent peak. A decline of 10–20% is called a correction. A bull market is a sustained upward trend of 20%+ from a trough."},
    {"q":"What is a dividend?","type":"mc","options":["A penalty for early stock sale","A portion of company profits paid to shareholders","Interest earned on a bond","A brokerage fee"],"answer":1,"explanation":"A dividend is a distribution of company earnings to shareholders, typically paid quarterly. Companies with stable cash flows (utilities, consumer staples) commonly pay dividends. Growth-oriented companies often reinvest profits instead."},
    {"q":"What does the P/E ratio measure?","type":"mc","options":["Profit to Expenses","Price per dollar of earnings","Performance vs. Expectations","Portfolio to Equity ratio"],"answer":1,"explanation":"The Price-to-Earnings (P/E) ratio = stock price ÷ earnings per share. It shows how much investors pay per dollar of earnings. A high P/E signals growth expectations; a low P/E may indicate undervaluation or declining prospects."},
    {"q":"What is short selling?","type":"mc","options":["Selling shares you own at a loss","Selling borrowed shares hoping to repurchase cheaper","Selling stocks held less than a year","Selling penny stocks"],"answer":1,"explanation":"Short selling involves borrowing shares, selling them at today's price, and repurchasing them later at a lower price to return to the lender — profiting from the decline. Risk is theoretically unlimited if the price rises."},
    {"q":"What is liquidity in financial markets?","type":"mc","options":["A company's cash reserves only","How quickly an asset can be sold at a fair price","The ratio of current assets to liabilities","Water rights trading"],"answer":1,"explanation":"Liquidity measures how easily an asset converts to cash without significantly impacting its price. Cash is maximally liquid. Exchange-traded stocks are highly liquid. Real estate and private equity are illiquid. The 2008 crisis featured severe liquidity crunches."},
    {"q":"What is an ETF?","type":"mc","options":["Electronic Transfer Fund","Exchange-Traded Fund","Equity Trading Formula","Extended Term Finance"],"answer":1,"explanation":"An ETF (Exchange-Traded Fund) is a basket of securities that trades on an exchange like a single stock. Most ETFs passively track an index (e.g., S&P 500). They offer diversification, low fees, and intraday liquidity — popularized by Vanguard and BlackRock."},
    {"q":"Bonds and interest rates move in opposite directions.","type":"tf","options":["True","False"],"answer":0,"explanation":"True — this inverse relationship is fundamental. When interest rates rise, newly issued bonds offer higher yields, making existing lower-yield bonds less attractive, so their prices fall. Duration measures a bond's sensitivity to interest rate changes."},
    {"q":"What is a derivative?","type":"mc","options":["A savings account","A contract whose value is based on an underlying asset","A government-issued bond","A volatility measure"],"answer":1,"explanation":"A derivative's value is derived from an underlying asset (stock, bond, commodity, currency, index). Types include options, futures, forwards, and swaps. They're used for hedging risk or speculation. The global derivatives market is worth hundreds of trillions."},
    {"q":"What does 'blue chip' stock refer to?","type":"mc","options":["Stocks trading below $1","Technology sector stocks","Shares in large, established, financially stable companies","Foreign-listed stocks"],"answer":2,"explanation":"Blue chips are shares in large, well-established companies with strong track records — think Apple, Microsoft, Toyota. The term originates from poker, where blue chips hold the highest value. They typically pay dividends and weather recessions better."},
    {"q":"What is arbitrage?","type":"mc","options":["Settling investment disputes","Profiting from price differences for the same asset across markets","Negotiating bond terms","Currency hedging"],"answer":1,"explanation":"Arbitrage exploits price discrepancies for the same asset in different markets — buy low in one, sell high in another, pocketing the difference risk-free. In modern markets, algorithmic traders close these gaps within milliseconds."},
    {"q":"What does OTC mean in trading?","type":"mc","options":["Over-The-Counter — direct trades between parties","Official Trading Certificate","Outright Transaction Clearance","Open Trading Contract"],"answer":0,"explanation":"OTC (Over-The-Counter) trades occur directly between counterparties without a centralized exchange. Most bonds, forex, and derivatives trade OTC. OTC markets are less regulated and transparent than exchange-traded markets like NYSE or TSE."},
    {"q":"What is a yield curve?","type":"mc","options":["A stock's historical price chart","Interest rates plotted against bond maturities","A bond's profit margin","A stock volatility measure"],"answer":1,"explanation":"The yield curve plots yields (interest rates) of same-quality bonds vs. maturity length. Normally it slopes upward (longer = higher yield for more risk). An inverted yield curve (short-term rates > long-term) has historically preceded recessions."},
    {"q":"What is a hedge fund?","type":"mc","options":["A government safety net for banks","An agricultural investment fund","A private fund using diverse strategies for accredited investors","A low-fee mutual fund"],"answer":2,"explanation":"Hedge funds are private investment vehicles for wealthy/institutional investors. They employ diverse strategies — long/short equity, macro, arbitrage, distressed debt — and typically charge '2 and 20' (2% management fee, 20% performance fee)."},
    {"q":"What is FX trading?","type":"mc","options":["Fixed-income exchange","Foreign exchange — trading currency pairs","Futures and options exchange","Financial compliance exchange"],"answer":1,"explanation":"FX (Foreign Exchange) trading involves simultaneously buying one currency and selling another. EUR/USD, USD/JPY, and GBP/USD are the most traded pairs. With $7+ trillion in daily volume, forex is the world's largest and most liquid market."},
    {"q":"What is a futures contract?","type":"mc","options":["A promise of future dividends","An agreement to buy/sell an asset at a set price on a future date","A bond maturing in 30+ years","A retirement savings plan"],"answer":1,"explanation":"A futures contract obligates the buyer to purchase (and seller to sell) an asset at a predetermined price on a set future date. Used for hedging by producers (oil companies, farmers) and speculation by traders. Traded on exchanges like CME."},
    {"q":"What is a mutual fund?","type":"mc","options":["A bank account shared by employees","A pooled investment vehicle managed by professionals","A government savings bond","A peer-to-peer lending platform"],"answer":1,"explanation":"A mutual fund pools money from many investors and invests it across stocks, bonds, or other assets, managed by professional portfolio managers. They offer diversification and professional oversight but typically carry higher fees than index ETFs."},
    {"q":"What does 'spread' mean in trading?","type":"mc","options":["Geographic reach of an investment","Difference between bid (buy) and ask (sell) price","Annual portfolio return","Financial advisor commission"],"answer":1,"explanation":"The bid-ask spread is the difference between what a buyer pays (ask) and a seller receives (bid). Tighter spreads indicate liquid markets. Wider spreads mean higher transaction costs. Market makers profit by capturing the spread."},
    {"q":"What was a CDO in the 2008 financial crisis?","type":"mc","options":["Chief Derivatives Officer","Collateralized Debt Obligation","Central Depository Order","Currency Default Option"],"answer":1,"explanation":"A CDO (Collateralized Debt Obligation) bundles loans into tranches sold to investors. Before 2008, CDOs packed in risky subprime mortgages rated AAA by agencies. When housing collapsed, these blew up — triggering a global financial crisis."},
    {"q":"What is the primary mandate of a central bank?","type":"mc","options":["Provide consumer loans","Manage monetary policy and maintain financial stability","Trade stocks for the government","Set corporate tax rates"],"answer":1,"explanation":"Central banks (Federal Reserve, ECB, Bank of Japan) manage monetary policy — controlling money supply and interest rates to balance inflation, employment, and economic growth. They are lenders of last resort and financial system stabilizers."},
    {"q":"What does 'volume' mean in stock trading?","type":"mc","options":["How loudly a stock is discussed","Number of shares traded in a period","A stock's daily price range","Total market capitalization"],"answer":1,"explanation":"Volume is the total shares (or contracts) traded in a given period. High volume confirms price trends — a breakout on heavy volume is more significant than one on thin volume. Volume spikes often signal institutional buying or selling."},
    {"q":"What is a stock exchange?","type":"mc","options":["Where companies swap ownership stakes","An organized marketplace where securities are bought and sold","A government investment regulator","A corporate lending bank"],"answer":1,"explanation":"A stock exchange provides a regulated marketplace for trading securities. Major exchanges: NYSE (US), NASDAQ (US), Tokyo Stock Exchange (Japan), Shanghai Stock Exchange (China), London Stock Exchange (UK). Companies list shares here to raise public capital."},
    {"q":"What does EBITDA stand for?","type":"mc","options":["Earnings Before Income Tax, Depreciation and Amortization","Equity Balance Including Total Dividends and Assets","Estimated Business Income Tax Depreciation Amount","Earnings Benchmark for International Trade and Development Accounting"],"answer":0,"explanation":"EBITDA = Earnings Before Interest, Taxes, Depreciation, and Amortization. It approximates a company's operating cash flow, stripping out financing and accounting decisions. Widely used for comparing profitability across companies and industries, especially in leveraged buyout (LBO) valuations."},
    {"q":"High-yield bonds are also known as 'junk bonds' because they have a higher risk of default.","type":"tf","options":["True","False"],"answer":0,"explanation":"True — high-yield (junk) bonds are rated below investment grade (BB+ or lower by S&P). They offer higher interest to compensate for greater default risk. Issuers are typically companies with weaker finances or startups. Michael Milken popularized junk bonds in the 1980s LBO boom."},
    {"q":"What is a market order in trading?","type":"mc","options":["An order that only executes at a specific price or better","An order to buy or sell immediately at the best available price","An order scheduled for the market open","An order from a government regulator"],"answer":1,"explanation":"A market order executes immediately at the current best price — prioritizing speed over price. Contrast with a limit order, which specifies a price but may not fill. In volatile markets, market orders can execute at unexpected prices (slippage). Used when execution certainty matters most."},
    {"q":"What is a limit order?","type":"mc","options":["An order that fills only a limited number of shares","An order to buy/sell only at a specified price or better","An order restricted to certain hours","An order for large institutional investors only"],"answer":1,"explanation":"A limit order specifies the maximum price you'll pay (buy limit) or minimum you'll accept (sell limit). It guarantees price but not execution — if the market never reaches your price, the order sits unfilled. Limit orders give control and are standard for non-urgent trades."},
    {"q":"What is a stop-loss order?","type":"mc","options":["An order to buy more when price rises","An order to automatically sell if price falls to a set level","A government order to halt trading","An instruction to pause dividend payments"],"answer":1,"explanation":"A stop-loss order triggers a sell when a stock falls to a predetermined price, limiting downside. E.g., buy at $100, set stop-loss at $90 → auto-sell if it drops there. Protects against large losses when you can't monitor positions. A 'trailing stop' adjusts dynamically as price rises."},
    {"q":"What does 'beta' measure in investing?","type":"mc","options":["A stock's expected annual dividend","A stock's volatility relative to the overall market","A bond's yield-to-maturity","A company's earnings growth rate"],"answer":1,"explanation":"Beta measures a stock's sensitivity to market movements. Beta = 1 means it moves with the market. Beta > 1 means more volatile (tech stocks). Beta < 1 means less volatile (utilities). Beta < 0 (e.g., gold) means it tends to move opposite the market — useful for hedging."},
    {"q":"In investing, 'alpha' refers to excess returns generated above a benchmark.","type":"tf","options":["True","False"],"answer":0,"explanation":"True — alpha measures a portfolio manager's value-add above a benchmark (e.g., beating the S&P 500 by 3% = alpha of 3%). Alpha = 0 means matching the market. Negative alpha means underperformance. Most active managers fail to generate consistent positive alpha, supporting the case for passive index investing."},
    {"q":"What does the Sharpe Ratio measure?","type":"mc","options":["A stock's dividend consistency","Risk-adjusted return — return earned per unit of risk","A bond's credit quality","A portfolio's sector concentration"],"answer":1,"explanation":"Sharpe Ratio = (Portfolio Return − Risk-Free Rate) ÷ Standard Deviation of Portfolio. Higher Sharpe = better risk-adjusted returns. A ratio above 1 is generally considered good; above 2 is very good. Developed by Nobel laureate William Sharpe, it's the most common metric for evaluating investment efficiency."},
    {"q":"What is free cash flow (FCF)?","type":"mc","options":["Cash held in overseas accounts","Cash generated after capital expenditures are deducted from operating cash flow","Total revenue minus cost of goods sold","Cash distributed to shareholders"],"answer":1,"explanation":"FCF = Operating Cash Flow − Capital Expenditures. It's the cash a company generates after maintaining/expanding its asset base — the true measure of financial health. Companies with strong FCF can pay dividends, buy back shares, reduce debt, or fund acquisitions. Warren Buffett heavily focuses on FCF."},
    {"q":"What does DCF stand for in valuation?","type":"mc","options":["Debt Coverage Factor","Discounted Cash Flow","Diversified Corporate Fund","Dividend Capitalization Formula"],"answer":1,"explanation":"Discounted Cash Flow (DCF) values a company by projecting future cash flows and discounting them back to present value using a discount rate (often WACC). The core idea: a dollar today is worth more than a dollar tomorrow. DCF is fundamental to investment banking and private equity valuation."},
    {"q":"What is enterprise value (EV)?","type":"mc","options":["A company's stock market capitalization only","Total company value including debt and excluding cash","Market cap plus net debt (total debt minus cash)","Annual revenue times a growth multiple"],"answer":2,"explanation":"Enterprise Value = Market Cap + Total Debt − Cash and Cash Equivalents. EV represents the theoretical acquisition cost — what you'd pay for the whole business. EV/EBITDA is a common valuation multiple. EV is more complete than market cap because it accounts for a company's debt structure."},
    {"q":"What does WACC stand for?","type":"mc","options":["Weighted Average Cost of Capital","Wide Area Corporate Credit","Working Asset Cash Calculation","Weighted Annual Coupon Credit"],"answer":0,"explanation":"WACC = Weighted Average Cost of Capital — the average rate a company must pay to all its capital providers (equity + debt). Used as the discount rate in DCF analysis. A higher WACC = riskier company = lower valuation. WACC depends on capital structure, tax rate, and market risk premium."},
    {"q":"A call option gives the holder the right to buy an asset at a predetermined price.","type":"tf","options":["True","False"],"answer":0,"explanation":"True — a call option grants the right (not obligation) to BUY an underlying asset at the strike price before expiry. A put option grants the right to SELL. Buyers pay a premium; sellers collect it but take on obligation. Options are used for hedging, income generation (covered calls), and speculation."},
    {"q":"What does a put option give its holder the right to do?","type":"mc","options":["Buy an asset at the strike price","Sell an asset at the strike price","Convert debt to equity","Force a dividend payment"],"answer":1,"explanation":"A put option gives the holder the right (not obligation) to SELL the underlying asset at the strike price before expiration. Investors buy puts to hedge against price declines. If you own stock and fear a drop, buying puts insures your position — like insurance on a portfolio."},
    {"q":"In options trading, 'delta' measures what?","type":"mc","options":["Time decay of an option's value","How much an option's price changes per $1 move in the underlying","The volatility priced into an option","The rate of change of an option's gamma"],"answer":1,"explanation":"Delta measures an option's price sensitivity to the underlying asset's price. A call option with delta 0.5 gains ~$0.50 in value when the stock rises $1. Delta ranges from 0 to 1 for calls (0 to -1 for puts). At-the-money options have delta ~0.5. Delta also approximates probability of expiring in-the-money."},
    {"q":"What does implied volatility (IV) represent in options pricing?","type":"mc","options":["Historical price swings","The market's forecast of future price swings embedded in option prices","An option's intrinsic value","The risk-free interest rate"],"answer":1,"explanation":"Implied volatility is the market's expectation of how much a stock will move, derived backward from current option prices using models like Black-Scholes. Higher IV → pricier options (more uncertainty). Earnings announcements, geopolitical events, and macro data releases spike IV. Traders sell options when IV is high."},
    {"q":"What does the VIX index measure?","type":"mc","options":["S&P 500 daily trading volume","Market sentiment — the 'fear gauge' of expected volatility","Emerging market currency fluctuations","The US federal funds rate"],"answer":1,"explanation":"The VIX (CBOE Volatility Index) measures expected 30-day volatility of the S&P 500, derived from options prices. VIX > 30 signals high fear/uncertainty; VIX < 15 suggests complacency. Nicknamed the 'fear gauge,' it spikes during crises (2008, COVID-19 March 2020) and falls during calm markets."},
    {"q":"What is an interest rate swap?","type":"mc","options":["Exchanging currency denominations","A contract to exchange fixed interest payments for floating ones","Converting equity into debt","Swapping bond maturities with a counterparty"],"answer":1,"explanation":"An interest rate swap is a derivative where two parties exchange interest payments — typically one pays a fixed rate while the other pays a floating rate (e.g., SOFR). Used by companies to manage interest rate risk. Notional principal is not exchanged; only interest payment differentials change hands."},
    {"q":"What is a Credit Default Swap (CDS)?","type":"mc","options":["A swap of credit card debt between banks","Insurance-like contract protecting against bond issuer default","A government guarantee on bank deposits","A currency swap between central banks"],"answer":1,"explanation":"A CDS is a derivative that transfers credit risk — the buyer pays periodic premiums; the seller compensates if the reference entity defaults. Used for hedging bond exposure or speculating on creditworthiness. CDS played a major role in the 2008 financial crisis when AIG's massive CDS exposure collapsed."},
    {"q":"What is a Mortgage-Backed Security (MBS)?","type":"mc","options":["A mortgage loan offered by investment banks","A bond backed by a pool of mortgages","A government guarantee on home loans","A derivative used to hedge real estate prices"],"answer":1,"explanation":"An MBS bundles many individual mortgage loans into a bond-like security sold to investors. Homeowners' monthly payments flow through to MBS investors. Fannie Mae and Freddie Mac are major US issuers. Subprime MBS at the center of the 2008 financial crisis when mortgage defaults cascaded."},
    {"q":"What is securitization?","type":"mc","options":["Adding encryption to financial data","Pooling illiquid assets and converting them into tradable securities","Registering securities with regulators","Offering security deposits on financial contracts"],"answer":1,"explanation":"Securitization pools assets (mortgages, auto loans, credit card receivables) and converts them into tradable securities. It transforms illiquid loans into liquid capital market instruments. Benefits: frees bank capital, broadens investor access. Risks: complexity can obscure underlying credit quality, as seen in 2008."},
    {"q":"What is Yield to Maturity (YTM)?","type":"mc","options":["Annual coupon payment divided by face value","Total expected return on a bond if held to its maturity date","The bond's current market price","The interest rate set by the issuer at issuance"],"answer":1,"explanation":"YTM is the annualized total return an investor earns if a bond is purchased at today's price and held to maturity, assuming all coupon payments are reinvested at the same rate. It accounts for both coupon income and capital gain/loss from par value. The key metric for comparing bonds."},
    {"q":"In bond investing, what does 'duration' measure?","type":"mc","options":["Length of time until a bond matures","A bond's sensitivity to interest rate changes","Annual coupon payment","Credit risk of the issuer"],"answer":1,"explanation":"Duration measures a bond's price sensitivity to interest rate changes (in years). A duration of 5 means the bond's price changes ~5% for every 1% change in interest rates. Longer duration = higher rate sensitivity. Portfolio managers adjust duration to match interest rate outlook — key for fixed income risk management."},
    {"q":"A zero-coupon bond pays no periodic interest and is sold at a discount.","type":"tf","options":["True","False"],"answer":0,"explanation":"True — zero-coupon bonds pay no coupons. Instead, they're issued at a deep discount and redeemed at face value, with the difference representing the return. E.g., pay $700 today for a $1,000 bond due in 10 years. US Treasury strips and savings bonds are examples. Interest accrues but is taxable annually."},
    {"q":"What is a convertible bond?","type":"mc","options":["A bond that can be exchanged for a higher-denomination bond","A bond that can be converted into the issuer's equity shares","A bond paying variable interest rates","A bond redeemable in foreign currency"],"answer":1,"explanation":"Convertible bonds are corporate bonds that can be converted into a set number of the issuer's shares at the bondholder's option. They offer bond-like downside protection with equity upside. Companies benefit by issuing at lower coupon rates; investors get equity participation. Popular in high-growth sectors."},
    {"q":"How does preferred stock differ from common stock?","type":"mc","options":["Preferred holders have more voting rights","Preferred stock pays a fixed dividend and has priority over common stock in liquidation","Preferred stock is riskier and pays higher returns","Preferred holders receive dividends before issuing common shares"],"answer":1,"explanation":"Preferred stockholders receive fixed dividends before common shareholders and have priority in liquidation — but typically no voting rights. It's a hybrid between equity and debt. Institutional investors like preferred for steady income. If a company skips preferred dividends, they usually accumulate (cumulative preferred)."},
    {"q":"What is a stock split?","type":"mc","options":["Dividing company ownership between multiple entities","Increasing share count proportionally while reducing price per share","Splitting a company into two separate businesses","Distributing half the company's profits to employees"],"answer":1,"explanation":"A stock split increases shares outstanding by issuing more shares to existing holders proportionally (e.g., 2-for-1 splits each share into two at half the price). Doesn't change market cap. Purpose: improve affordability and liquidity. Apple (2020) did a 4-for-1 split; Tesla did a 5-for-1 split."},
    {"q":"Why do companies conduct share buybacks?","type":"mc","options":["To dilute existing shareholders","To return capital to shareholders and reduce shares outstanding, boosting EPS","To meet regulatory capital requirements","To fund expansion into new markets"],"answer":1,"explanation":"Share buybacks (repurchases) reduce shares outstanding, boosting earnings per share (EPS) and stock price. Signal management confidence. Return capital tax-efficiently (vs. dividends). US companies repurchased over $1 trillion in shares annually in recent years. Critics argue buybacks prioritize short-term price over long-term investment."},
    {"q":"What is a SPAC?","type":"mc","options":["Special Private Acquisition Corporation","Special Purpose Acquisition Company — a blank-check company that raises funds to merge with a private firm","Stock Portfolio Allocation Committee","Structured Product and Asset Clearance"],"answer":1,"explanation":"A SPAC ('blank-check company') raises money via IPO with no operations — just cash and a mandate to find a merger target within ~2 years. The target goes public by merging with the SPAC, bypassing traditional IPO. SPACs surged in 2020–2021 (EV companies, fintech) but faced scrutiny over returns."},
    {"q":"What is private equity (PE)?","type":"mc","options":["Shares listed on private exchanges","Investment in companies not publicly traded, typically via buyouts or growth capital","Government-owned company equity","Equity reserved for company founders only"],"answer":1,"explanation":"Private equity firms invest in non-public companies — via leveraged buyouts (LBOs), growth equity, or venture capital. They aim to improve operations and exit (IPO or sale) within 5–7 years. PE firms use significant debt (leverage) to amplify returns. Major firms: Blackstone, KKR, Carlyle, Apollo."},
    {"q":"Venture capital (VC) typically invests in which stage of companies?","type":"mc","options":["Established Fortune 500 companies seeking restructuring","Early-stage, high-growth startups in exchange for equity","Bankrupt companies undergoing restructuring","Government infrastructure projects"],"answer":1,"explanation":"VC funds invest in early-stage startups with high growth potential — seed, Series A, B, C rounds. They take equity stakes and help companies scale. Returns are power-law distributed: a few home runs (Google, Airbnb, Stripe) cover many losses. Silicon Valley, NYC, and Tokyo are major VC hubs."},
    {"q":"What is a Leveraged Buyout (LBO)?","type":"mc","options":["Buying a stock on margin using borrowed funds","Acquiring a company using a mix of equity and significant debt, using the target's assets as collateral","Issuing new bonds to fund a merger","Borrowing from a central bank to fund expansion"],"answer":1,"explanation":"An LBO is a private equity acquisition using ~60–90% debt to fund the purchase, with the target company's cash flows and assets serving as collateral. PE firms minimize equity to maximize returns. Post-acquisition, they improve operations and reduce debt before exiting. Famous LBOs: RJR Nabisco (1989), TXU Energy (2007)."},
    {"q":"What is dollar-cost averaging (DCA)?","type":"mc","options":["Investing only when prices reach a 52-week low","Investing a fixed dollar amount at regular intervals regardless of price","Converting investments to US dollars periodically","Averaging down by buying more when prices drop"],"answer":1,"explanation":"DCA = investing a fixed amount regularly (e.g., $500/month) regardless of market conditions. When prices are low, you buy more shares; when high, fewer — averaging out your cost basis. Removes emotion from investing and avoids trying to time the market. Widely recommended for long-term retirement investing."},
    {"q":"What does GDP stand for and what does it measure?","type":"mc","options":["Gross Domestic Product — total economic output of a country","Global Debt Position — total national debt","Gross Dividend Payment — total dividends distributed","General Depreciation Period — asset write-down timeline"],"answer":0,"explanation":"GDP (Gross Domestic Product) measures the total monetary value of all goods and services produced within a country in a period. It's the primary measure of economic size and health. Growth of 2–3% is considered healthy for developed economies. Calculated as: C + I + G + (X − M)."},
    {"q":"What is inflation?","type":"mc","options":["An increase in money supply only","A sustained rise in the general price level of goods and services","A government policy to expand debt","A decrease in the value of imports"],"answer":1,"explanation":"Inflation is the general rise in prices over time, eroding purchasing power. Measured by CPI and PCE indices. Central banks target ~2% inflation as healthy. Causes: demand-pull (strong consumer spending), cost-push (rising input costs), or money supply expansion. Hyperinflation destroys economies (Zimbabwe 2008, Venezuela)."},
    {"q":"Deflation means the general price level is rising.","type":"tf","options":["True","False"],"answer":1,"explanation":"False — deflation is a sustained decrease in the general price level. While seemingly positive, deflation is dangerous: consumers delay purchases (why buy today if it's cheaper tomorrow?), corporate revenues fall, debt burdens rise in real terms, and unemployment climbs. Japan's 'Lost Decade' featured chronic deflation."},
    {"q":"What is quantitative easing (QE)?","type":"mc","options":["A government policy to reduce its budget deficit","A central bank buying assets (bonds) to inject money into the economy","Restricting bank lending to control inflation","Reducing government spending to lower debt"],"answer":1,"explanation":"QE is an unconventional monetary policy where central banks buy large quantities of bonds (and sometimes other assets) to inject money into the economy when interest rates are near zero. The Fed used QE extensively after 2008 and during COVID-19 to support markets and stimulate growth."},
    {"q":"How is a recession technically defined?","type":"mc","options":["One quarter of negative GDP growth","Two consecutive quarters of negative GDP growth","Unemployment above 10%","Stock market declining 20% or more"],"answer":1,"explanation":"A recession is typically defined as two consecutive quarters of negative GDP growth. The US National Bureau of Economic Research (NBER) uses a broader definition considering employment, income, and sales. Recessions average ~11 months in modern history; depressions are more severe and prolonged."},
    {"q":"What is the difference between fiscal policy and monetary policy?","type":"mc","options":["Fiscal is central bank rate control; monetary is government spending","Fiscal policy is government spending/taxation; monetary policy is central bank control of money supply/rates","They are two names for the same policy","Fiscal covers domestic policy; monetary covers international"],"answer":1,"explanation":"Fiscal policy = government decisions on spending and taxation (Parliament/Congress). Monetary policy = central bank control of money supply and interest rates (Fed, BOJ, ECB). They work together: fiscal stimulus during recessions, monetary tightening to combat inflation. Coordination matters for economic stability."},
    {"q":"What is the carry trade in forex?","type":"mc","options":["Physically transporting currency between countries","Borrowing in a low-interest-rate currency and investing in a higher-yielding one","Exchanging currencies at airport kiosks","A strategy to hedge currency risk"],"answer":1,"explanation":"The carry trade involves borrowing in a low-interest currency (historically the Japanese yen at near-zero rates) and investing proceeds in high-yield currencies/assets. Profit = interest rate differential. Risk: if the borrowed currency strengthens suddenly, the trade unwinds violently. A popular strategy among hedge funds and FX traders."},
    {"q":"What is Purchasing Power Parity (PPP)?","type":"mc","options":["A government subsidy system for essential goods","A theory that exchange rates adjust so identical goods cost the same across countries","A measure of a country's foreign reserves","A standard for comparing central bank interest rates"],"answer":1,"explanation":"PPP holds that identical goods should cost the same in different countries after adjusting for exchange rates. The Economist's Big Mac Index is a famous PPP illustration. PPP-adjusted GDP comparisons show China's economy rivaling the US in real output despite a lower nominal exchange rate."},
    {"q":"What are emerging markets (EM)?","type":"mc","options":["New stock exchanges opened in developed countries","Developing economies with faster growth but higher risk than developed markets","Markets specializing in new product launches","Startup companies in technology sectors"],"answer":1,"explanation":"Emerging markets are developing economies transitioning from low to middle/high income — BRICS (Brazil, Russia, India, China, South Africa) plus Mexico, Indonesia, Turkey, and others. They offer higher growth potential but face risks: currency volatility, political instability, lower liquidity. MSCI EM Index tracks them."},
    {"q":"What companies does the S&P 500 index track?","type":"mc","options":["The 500 largest US companies listed on NYSE only","500 large-cap US companies selected by a committee across major sectors","All US companies with market cap above $500 million","The 500 best-performing US stocks from the previous year"],"answer":1,"explanation":"The S&P 500 tracks ~500 large-cap US companies across 11 sectors, selected by a committee based on market cap, liquidity, and financial viability. It's the most widely followed US equity benchmark. Index funds tracking the S&P 500 hold trillions in assets. Past 10-year annual return: ~13%."},
    {"q":"What is the Nikkei 225?","type":"mc","options":["A Japanese currency index","Japan's primary stock market index tracking 225 large Tokyo Stock Exchange companies","A bond index for Japanese government securities","An economic indicator measuring Japanese exports"],"answer":1,"explanation":"The Nikkei 225 is Japan's most prominent stock index, tracking 225 large companies on the Tokyo Stock Exchange. Price-weighted (like the Dow Jones). Peaked at ~39,000 in December 1989, crashed, and took until 2024 to surpass that all-time high. Key companies: Toyota, Sony, SoftBank, Nintendo."},
    {"q":"What does the MSCI World Index represent?","type":"mc","options":["A single country's stock market","A global equity index covering large and mid-cap stocks in 23 developed markets","An index of only emerging market companies","A bond market index from multinational issuers"],"answer":1,"explanation":"The MSCI World Index covers ~1,500 stocks across 23 developed market countries. The US represents ~70% of the index. Used as a benchmark for global equity portfolios. The broader MSCI ACWI (All Country World Index) adds ~24 emerging markets. MSCI is the gold standard for international equity benchmarks."},
    {"q":"What is a clearing house in financial markets?","type":"mc","options":["A bank branch for international payments","An intermediary that settles trades, manages counterparty risk between buyers and sellers","A government office that audits broker accounts","A fund that clears bad debts from bank balance sheets"],"answer":1,"explanation":"A clearing house (e.g., DTCC, LCH, JSCC) sits between buyer and seller, guaranteeing trade settlement even if one party defaults. It reduces counterparty risk by acting as the central counterparty. After 2008, regulators mandated central clearing for most derivatives. Critical infrastructure for market stability."},
    {"q":"What does T+2 settlement mean in securities trading?","type":"mc","options":["A bond maturing in 2 years","Trades settle — ownership and payment transfer — 2 business days after execution","A 2% tax on each transaction","Two daily price limits on volatile securities"],"answer":1,"explanation":"T+2 means a trade settles 2 business days after the transaction date. So if you buy on Monday, you receive shares and pay on Wednesday. The US moved to T+1 settlement in 2024 to reduce risk. Institutional investors and brokers manage liquidity to fund settlements."},
    {"q":"What is margin trading?","type":"mc","options":["Trading in securities with the lowest possible price margins","Borrowing money from a broker to buy more securities than you could with your own cash","Calculating profit margins for stock analysis","A legal limit on transaction fees charged by brokers"],"answer":1,"explanation":"Margin trading lets investors borrow from their broker to amplify purchasing power. E.g., with $10,000 and 50% margin, you can buy $20,000 in securities. Amplifies gains AND losses. Requires a margin account. Regulation T (US) sets minimum margins. High risk — can lose more than initial capital."},
    {"q":"What triggers a margin call?","type":"mc","options":["A broker calling to recommend new investments","When account equity falls below the broker's maintenance margin requirement, forcing deposit of funds or asset sale","When a stock hits a 52-week low","When an investor requests to withdraw all margin funds"],"answer":1,"explanation":"A margin call occurs when an investor's account equity falls below the maintenance margin threshold. The broker demands additional funds or forced liquidation of positions to restore the required ratio. Margin calls can cascade — forced selling drives prices lower, triggering more calls (as in 1929 and 2008)."},
    {"q":"What is leverage in a financial context?","type":"mc","options":["A company's brand recognition","Using borrowed capital to amplify potential returns (and losses)","The ratio of assets to revenue","A government's ability to tax corporations"],"answer":1,"explanation":"Leverage = using debt to amplify investment exposure. 2:1 leverage means every 10% gain doubles to 20% — but losses also double. Measured by debt-to-equity ratio. Financial institutions operate with high leverage (banks at 10:1 or more). Excessive leverage amplifies systemic risk during downturns."},
    {"q":"What is a repurchase agreement (repo)?","type":"mc","options":["A contractual obligation to buy back issued shares","A short-term borrowing arrangement where securities are sold and agreed to be repurchased at a set price","An agreement to repurchase foreign currency at a guaranteed rate","A regulatory requirement to buy back failed bonds"],"answer":1,"explanation":"In a repo, party A sells securities to party B and agrees to repurchase them at a slightly higher price — effectively borrowing cash against collateral. The interest rate is the repo rate. Central banks use repos for short-term liquidity management. Repo markets froze in September 2008, accelerating the financial crisis."},
    {"q":"What is counterparty risk?","type":"mc","options":["The risk that a trading algorithm malfunctions","The risk that the other party in a financial contract fails to fulfill their obligations","The risk of investing in a foreign market","The risk of a portfolio being too concentrated"],"answer":1,"explanation":"Counterparty risk is the risk that the other side of a financial contract defaults before it's settled. Critical in OTC derivatives, bonds, and repo markets. Mitigated by central clearing, collateral agreements (ISDA), netting, and credit limits. The collapse of Lehman Brothers in 2008 crystallized global counterparty risk fears."},
    {"q":"What is systemic risk?","type":"mc","options":["Risk affecting only one specific company","The risk that the failure of one institution triggers a broader financial system collapse","Risk from natural disasters affecting markets","The risk that inflation rises above target"],"answer":1,"explanation":"Systemic risk is the risk that the failure of one entity triggers a cascade of failures across the financial system — 'too big to fail.' The 2008 collapse of Lehman Brothers showed how interconnected institutions can transmit shocks globally. Regulators address systemic risk through stress tests, capital buffers, and resolution plans."},
    {"q":"What does Value at Risk (VaR) measure?","type":"mc","options":["The maximum possible profit in a portfolio","The potential maximum loss over a given time period at a specific confidence level","Total portfolio value relative to the market","Average daily trading volume of a security"],"answer":1,"explanation":"VaR estimates the maximum loss a portfolio could face over a given period (e.g., 1 day) at a specified confidence level (e.g., 95%). A 1-day 95% VaR of $1M means there's a 5% chance of losing more than $1M in a day. Widely used for risk reporting but criticized for underestimating tail risks (black swans)."},
    {"q":"What is Basel III?","type":"mc","options":["A Swiss city known for banking regulation","International bank capital adequacy standards requiring banks to hold sufficient capital buffers","A European data privacy regulation for banks","A 2003 US banking reform law"],"answer":1,"explanation":"Basel III is a global framework developed by the Bank for International Settlements (BIS) after 2008, requiring banks to hold more high-quality capital against their risk-weighted assets. Key ratios: CET1 (common equity tier 1), liquidity coverage ratio (LCR), and leverage ratio. Implemented to prevent the next banking crisis."},
    {"q":"What is the role of the SEC in the United States?","type":"mc","options":["Setting interest rates and managing money supply","Regulating securities markets — enforcing disclosure, market integrity, and investor protection","Managing the US government's budget","Providing deposit insurance to bank customers"],"answer":1,"explanation":"The Securities and Exchange Commission (SEC) regulates the US securities industry — requiring public companies to disclose material information, policing insider trading and fraud, overseeing exchanges, and registering investment advisers. Created after the 1929 crash. The SEC's motto: 'protect investors, maintain fair markets, facilitate capital formation.'"},
    {"q":"Insider trading involves trading securities based on material non-public information.","type":"tf","options":["True","False"],"answer":0,"explanation":"True — insider trading is buying or selling securities using material, non-public information in breach of a fiduciary duty. It's illegal because it's unfair to other market participants. Famous cases: Ivan Boesky (1986), Martha Stewart (2004), SAC Capital. The SEC actively pursues insider trading through market surveillance and informant tips."},
    {"q":"What is book value per share?","type":"mc","options":["A stock's price on its IPO date","Net assets (total assets minus total liabilities) divided by shares outstanding","Expected future earnings discounted to present value","Annual revenue per share outstanding"],"answer":1,"explanation":"Book value = Total Assets − Total Liabilities (shareholders' equity). Book value per share = equity ÷ shares outstanding. It represents the accounting value of a company. Value investors compare book value to market price. A P/B < 1 may signal undervaluation. For banks and financials, P/B is a key valuation metric."},
    {"q":"What does the Price-to-Book (P/B) ratio compare?","type":"mc","options":["Stock price to annual revenue","Stock price to book value per share","Stock price to earnings per share","Stock price to dividend per share"],"answer":1,"explanation":"P/B ratio = Market Price per Share ÷ Book Value per Share. Indicates how much investors pay relative to accounting net asset value. P/B < 1 may suggest undervaluation; P/B > 5 suggests premium growth expectations. Financial stocks, banks, and insurance companies are typically analyzed using P/B ratios."},
    {"q":"What does ROE (Return on Equity) measure?","type":"mc","options":["Revenue relative to total equity raised","Net profit generated per dollar of shareholders' equity","The return on a bond relative to its equity equivalent","Employee compensation relative to company size"],"answer":1,"explanation":"ROE = Net Income ÷ Shareholders' Equity. It measures how efficiently a company generates profit from shareholders' investments. ROE > 15% is generally strong. Warren Buffett favors companies with consistently high ROE. The DuPont formula breaks ROE into profit margin × asset turnover × leverage — revealing what drives returns."},
    {"q":"What does ROA (Return on Assets) measure?","type":"mc","options":["Revenue generated per physical asset owned","Net income relative to total assets — how efficiently assets generate profit","Return on all assets held by shareholders","Revenue divided by operating assets only"],"answer":1,"explanation":"ROA = Net Income ÷ Total Assets. Measures how efficiently a company uses all its assets to generate profit. Banks target ROA of ~1%+; tech companies often achieve much higher. ROA is useful for comparing capital-intensive industries (airlines, manufacturing) where asset efficiency matters most."},
    {"q":"What is a company's net profit margin?","type":"mc","options":["Revenue minus cost of goods sold","Net income divided by total revenue — the percentage of revenue that becomes profit","Operating profit before interest and taxes","Cash from operations divided by revenue"],"answer":1,"explanation":"Net Profit Margin = Net Income ÷ Revenue × 100%. Shows what percentage of sales becomes actual profit after all expenses, taxes, and interest. Apple's margin ~25%+ is exceptional. Grocery chains operate at 1–3%. Comparing margins within an industry reveals cost efficiency and pricing power."},
    {"q":"What is gross margin?","type":"mc","options":["Total revenue minus all expenses","Revenue minus cost of goods sold, divided by revenue","Operating profit after tax","Net income before dividends"],"answer":1,"explanation":"Gross Margin = (Revenue − COGS) ÷ Revenue. It measures production efficiency before operating expenses. Software companies often have 70–80%+ gross margins (low COGS). Manufacturers may have 20–40%. High gross margins give companies flexibility to absorb operating expenses and still be profitable."},
    {"q":"What is accounts payable on a balance sheet?","type":"mc","options":["Money owed to the company by customers","Money the company owes to its suppliers and vendors","Prepaid expenses not yet recognized","Employee salaries owed but not yet paid"],"answer":1,"explanation":"Accounts payable (AP) is the money a company owes to its suppliers for goods and services received but not yet paid. It's a current liability. High AP relative to peers can signal slow payment (cash conservation) or poor supplier relationships. AP days = days a company takes to pay suppliers."},
    {"q":"What does debt-to-equity (D/E) ratio indicate?","type":"mc","options":["How much of a company's debt is traded on exchanges","The proportion of financing that comes from debt vs. equity","Dividend payments relative to earnings","Equity value as a multiple of book debt"],"answer":1,"explanation":"D/E = Total Debt ÷ Total Shareholders' Equity. A D/E of 2 means $2 in debt per $1 of equity. High D/E signals leverage risk but can boost returns (debt is cheaper than equity). Capital-intensive industries (utilities, real estate) tolerate higher D/E. Tech companies often carry little debt. Context is key."},
    {"q":"What does the interest coverage ratio measure?","type":"mc","options":["How many months of interest a company has reserved in cash","A company's ability to pay interest expenses from operating earnings","The ratio of bond interest to total dividends paid","Central bank interest rate relative to corporate bond yields"],"answer":1,"explanation":"Interest Coverage = EBIT ÷ Interest Expense. Measures how many times a company can pay its interest from operating earnings. Ratio < 1.5 is dangerous; > 3 is comfortable. Banks and credit analysts monitor this to assess a company's ability to service its debt. A declining ratio signals financial stress."},
    {"q":"What is earnings per share (EPS)?","type":"mc","options":["Total earnings distributed as dividends","Net income divided by total shares outstanding","Revenue per share sold to the public","Operating cash flow per share"],"answer":1,"explanation":"EPS = Net Income ÷ Shares Outstanding. It's the fundamental per-share profitability measure. Diluted EPS accounts for options, warrants, and convertibles. Growing EPS drives stock prices. Companies focus on beating quarterly EPS 'consensus' estimates. Artificial EPS inflation via buybacks (reducing shares) is a common criticism."},
    {"q":"What is dividend yield?","type":"mc","options":["Total dividends a company pays in absolute dollar terms","Annual dividend per share divided by the stock price — expressed as a percentage","Percentage of net income paid out as dividends","Growth rate of dividend payments year-over-year"],"answer":1,"explanation":"Dividend Yield = Annual Dividend per Share ÷ Stock Price × 100%. E.g., a $2 annual dividend on a $40 stock = 5% yield. High yield can mean attractive income OR a falling stock price (yield trap). Utilities, REITs, and telecoms typically offer 3–7% yields. Growth stocks often pay no dividend."},
    {"q":"What is an ex-dividend date?","type":"mc","options":["The date a dividend payment is announced","The cutoff date — investors must own shares before this date to receive the upcoming dividend","The date when dividends are actually paid to shareholders","The date a company removes its dividend program"],"answer":1,"explanation":"On the ex-dividend date, the stock trades 'ex' (without) the upcoming dividend. To receive it, you must own shares before this date. On ex-div day, the stock price typically drops by approximately the dividend amount. Important for income investors timing their purchases to capture dividend payments."},
    {"q":"What is a rights issue?","type":"mc","options":["A legal dispute over stock ownership","An offering that allows existing shareholders to buy new shares at a discount before the public","A bond issuance specifically for rights holders","A government-mandated stock buyback"],"answer":1,"explanation":"A rights issue lets existing shareholders buy new shares at a discounted price, proportional to their current holdings, before any public offering. It raises capital while giving current investors the right to maintain their ownership percentage (avoid dilution). Shareholders can also sell their rights in the market."},
    {"q":"What is share dilution?","type":"mc","options":["A stock price declining below its book value","The reduction in existing shareholders' ownership percentage when new shares are issued","Repurchasing shares to increase their value","Dividing one share into multiple shares"],"answer":1,"explanation":"Dilution occurs when a company issues new shares, reducing existing shareholders' proportional ownership. E.g., you own 10% of 1M shares; issuing 1M more shares dilutes you to 5%. Dilutive events: stock options exercised, convertible bonds converted, rights issues, secondary offerings. Investors monitor dilution carefully."},
    {"q":"What is a dark pool?","type":"mc","options":["A black market for illegal securities trading","A private exchange where large orders are executed anonymously, away from public markets","An offshore account for hiding trading losses","A regulatory sandbox for experimental trading systems"],"answer":1,"explanation":"Dark pools are private trading venues where large institutional orders execute away from public exchanges, hiding order size and price until after execution. Reduce market impact from large trades. Account for ~30–40% of US equity volume. Criticized for reducing market transparency; regulated by SEC and FINRA."},
    {"q":"What is High-Frequency Trading (HFT)?","type":"mc","options":["Trading strategies that hold positions for years","Algorithmic trading executing thousands of trades per second to capture tiny price inefficiencies","A strategy focusing on high-dividend stocks","Trading based on fundamental analysis of quarterly earnings"],"answer":1,"explanation":"HFT uses powerful computers and ultra-low latency (co-located at exchanges) to execute thousands of trades per second, profiting from microsecond price differences. Accounts for 50%+ of US equity volume. Benefits: tighter spreads, more liquidity. Criticisms: front-running, flash crashes (May 6, 2010). Flash Boys by Michael Lewis brought HFT public attention."},
    {"q":"What is a short squeeze?","type":"mc","options":["When a company reduces its float by buying back shares","When heavily-shorted stock rises sharply, forcing short sellers to buy to cover losses — pushing price higher","A margin call triggered by excessive short exposure","A regulatory restriction on short selling during market declines"],"answer":1,"explanation":"A short squeeze occurs when a heavily-shorted stock rises sharply, forcing short sellers to buy shares to cover losses — which pushes the price even higher in a feedback loop. The GameStop (GME) short squeeze of January 2021, coordinated on Reddit's WallStreetBets, is the most famous modern example."},
    {"q":"What is goodwill on a balance sheet?","type":"mc","options":["A company's reputation score from customer surveys","The excess paid over fair market value when acquiring a company","Accumulated dividend payments to shareholders","Brand value registered as intellectual property"],"answer":1,"explanation":"Goodwill = Purchase Price − Fair Value of Net Assets Acquired. It captures intangibles like brand, customer relationships, and synergies. Under GAAP and IFRS, goodwill is tested annually for impairment (not amortized). A major goodwill write-down signals an overpriced acquisition — a red flag for investors."},
    {"q":"What is depreciation in accounting?","type":"mc","options":["Currency value declining against the dollar","Allocating the cost of a tangible asset over its useful life","Writing off bad debt from customers","Reducing bond value as it approaches maturity"],"answer":1,"explanation":"Depreciation allocates a tangible asset's cost over its useful life — matching expenses to the revenue those assets generate. Methods: straight-line (equal annual amounts), declining balance (front-loaded), units of production. Depreciation is a non-cash expense that reduces taxable income and appears on both income statements and cash flow statements."},
    {"q":"What is the key difference between GAAP and IFRS accounting standards?","type":"mc","options":["GAAP is global; IFRS is used only in the US","GAAP is the US accounting standard; IFRS is the international standard used by 140+ countries","GAAP applies to public companies; IFRS applies to private ones","GAAP covers stocks; IFRS covers bonds and derivatives only"],"answer":1,"explanation":"GAAP (Generally Accepted Accounting Principles) is the US standard set by FASB. IFRS (International Financial Reporting Standards) is used by 140+ countries, set by IASB. Key differences: revenue recognition, inventory (LIFO allowed under GAAP, not IFRS), treatment of intangibles. Convergence has been ongoing for decades."},
    {"q":"What does a balance sheet show?","type":"mc","options":["Revenue and expenses over a period","Assets, liabilities, and shareholders' equity at a specific point in time","Cash inflows and outflows over a period","Earnings per share and dividend history"],"answer":1,"explanation":"The balance sheet (statement of financial position) shows: Assets = Liabilities + Shareholders' Equity. It's a snapshot of what a company owns and owes at a specific date. Assets: cash, inventory, PP&E, goodwill. Liabilities: debt, AP, accruals. Equity: paid-in capital, retained earnings."},
    {"q":"What does an income statement primarily show?","type":"mc","options":["Assets and liabilities at a point in time","Revenue, expenses, and profit or loss over a reporting period","Cash flows from all company activities","Changes in shareholders' equity"],"answer":1,"explanation":"The income statement (P&L) shows financial performance over a period: Revenue − COGS = Gross Profit; minus Operating Expenses = EBIT; minus Interest and Taxes = Net Income. Key metrics: gross margin, operating margin, net margin, EBITDA. It's the most read financial statement for profitability analysis."},
    {"q":"What is the cash flow statement's primary purpose?","type":"mc","options":["Show total equity changes","Report cash generated and used in operating, investing, and financing activities","Forecast future revenue","Summarize all balance sheet changes"],"answer":1,"explanation":"The cash flow statement shows how cash moves through three activities: Operating (core business cash), Investing (capex, acquisitions), Financing (debt issuance, dividends, buybacks). Critical because profitable companies can still go bankrupt if cash flow is negative. 'Cash is king' — the income statement can be managed; cash is harder to fake."},
    {"q":"What does bond convexity measure?","type":"mc","options":["A bond's sensitivity to credit rating changes","The curvature of the price-yield relationship — how duration changes as rates change","A bond's annual price appreciation","The rate at which a bond's credit risk increases"],"answer":1,"explanation":"Convexity measures the rate of change of duration — how a bond's price sensitivity (duration) changes as interest rates change. Positive convexity means bonds gain more in price when rates fall than they lose when rates rise (asymmetric). Higher convexity is desirable. Used alongside duration for precise interest rate risk management."},
    {"q":"What is the coupon rate on a bond?","type":"mc","options":["The discount at which a bond is issued below par","The annual interest payment expressed as a percentage of the bond's face value","The yield earned if held to maturity","The credit spread over risk-free rates"],"answer":1,"explanation":"The coupon rate is the fixed annual interest rate set at issuance, expressed as a % of face (par) value. A 5% coupon on a $1,000 bond pays $50/year. Unlike yield (which changes with price), the coupon rate is fixed. 'Zero-coupon' bonds pay no periodic interest — all return comes at maturity."},
    {"q":"What are green bonds?","type":"mc","options":["Bonds issued by environmental nonprofits","Bonds whose proceeds are earmarked for climate and environmental projects","Bonds issued by sustainable agriculture companies","Government bonds with interest linked to carbon prices"],"answer":1,"explanation":"Green bonds raise capital exclusively for environmentally beneficial projects — renewable energy, clean transport, sustainable infrastructure. Issuers include governments, municipalities, and corporations. The green bond market surpassed $1 trillion issuance in 2023. Require independent verification to prevent 'greenwashing.' Part of the broader sustainable finance ecosystem."},
    {"q":"What does ESG stand for in investing?","type":"mc","options":["Earnings, Sales, and Growth","Environmental, Social, and Governance — criteria used to evaluate company sustainability and ethics","European Securities Guidelines","Equity, Securities, and Growth framework"],"answer":1,"explanation":"ESG = Environmental (carbon emissions, water use), Social (labor practices, diversity), Governance (board structure, executive pay, transparency). ESG investing integrates these factors into financial analysis. Global ESG assets exceed $35 trillion. Critics argue ESG definitions are inconsistent; proponents say ESG-aligned companies face fewer regulatory and reputational risks."},
    {"q":"What is a REIT?","type":"mc","options":["A government savings bond for retirement","A company that owns income-producing real estate and must distribute 90%+ of taxable income as dividends","A fund that invests only in real estate development loans","A mortgage insurance program for first-time buyers"],"answer":1,"explanation":"A Real Estate Investment Trust (REIT) owns and operates income-producing real estate — offices, malls, apartments, data centers, hospitals. By law, REITs must distribute 90%+ of taxable income as dividends. Trade on exchanges like stocks. Allow retail investors access to real estate returns without direct ownership. Popular for income portfolios."},
    {"q":"What is a commodity in financial markets?","type":"mc","options":["A luxury consumer product","A raw material or primary agricultural product traded in standardized contracts","Any physical item sold in retail markets","A derivative based on industrial output"],"answer":1,"explanation":"Commodities are standardized raw materials: energy (oil, gas), metals (gold, silver, copper), agricultural (wheat, corn, soybeans, coffee). They trade on futures exchanges (CME, ICE). Commodity prices affect global inflation, corporate costs, and emerging market economies. The dollar's strength inversely correlates with many commodity prices."},
    {"q":"What is the 'spot price' of a commodity?","type":"mc","options":["The average price over the last 30 days","The current market price for immediate delivery","The price locked in by a futures contract","The price at which a commodity trades on expiry"],"answer":1,"explanation":"The spot price is the current market price for immediate (or near-immediate) delivery of a commodity. Contrast with futures prices, which reflect expected future delivery at a specified date. The basis (futures price − spot price) can indicate supply/demand dynamics. Spot gold, crude oil, and FX rates are the most watched spot markets."},
    {"q":"What is backwardation in commodity markets?","type":"mc","options":["A market where futures prices are higher than spot prices","A market where futures prices are lower than the current spot price","A reversal of a commodity's price trend","The process of rolling expiring futures contracts forward"],"answer":1,"explanation":"Backwardation occurs when futures prices are below the current spot price — suggesting current supply is tight. Common in oil markets during supply disruptions. The opposite — futures above spot — is called contango (normal for commodities with storage costs). The shape of the futures curve gives insight into market conditions."},
    {"q":"What is contango in commodity markets?","type":"mc","options":["A commodity price rally driven by speculation","When futures prices are higher than the current spot price — the normal curve when storage costs exist","A downward trend in commodity prices","The daily price limit imposed on futures contracts"],"answer":1,"explanation":"Contango is the normal state for commodity futures curves: futures prices > spot prices, reflecting cost of carry (storage, insurance, financing). Investors in futures-based ETFs suffer 'roll yield' losses when rolling expiring contracts to higher-priced future months. WTI crude contango in April 2020 turned historic as oil prices briefly went negative."},
    {"q":"What does a current account deficit indicate?","type":"mc","options":["A government's annual budget shortfall","A country importing more goods, services, and income than it exports","Negative real interest rates in an economy","A central bank's declining foreign currency reserves"],"answer":1,"explanation":"A current account deficit means a country's payments to the rest of the world exceed what it receives — imports exceed exports plus net income and transfers. The US has run a persistent current account deficit, financed by capital inflows (foreigners buying US assets). Large deficits can signal a weak currency or debt dependency."},
    {"q":"What is an IPO lock-up period?","type":"mc","options":["The time before a company can apply for an IPO","A restriction preventing insiders from selling shares for a set period after an IPO","The time an IPO prospectus must be publicly available","The period during which an IPO price is fixed"],"answer":1,"explanation":"After an IPO, insiders (founders, employees, early investors) are prohibited from selling their shares for a lock-up period — typically 90–180 days. This prevents insiders from immediately dumping shares and crashing the price. When lock-ups expire, the market watches carefully for insider selling as a signal of confidence (or lack thereof) in the company."},
    {"q":"What is underwriting in investment banking?","type":"mc","options":["Auditing a company's financial statements","An investment bank guaranteeing a price for a securities issuance and buying any unsold shares","Providing credit analysis for bond issuers","Researching a company's competitive position"],"answer":1,"explanation":"Underwriting is when an investment bank (or syndicate of banks) guarantees to buy a company's newly issued securities at a set price and sell them to investors. If demand is weak, the underwriter absorbs unsold shares. Banks earn an underwriting spread (difference between buying and selling price). Core function of Goldman Sachs, Morgan Stanley, JPMorgan."},
    {"q":"What is treasury stock?","type":"mc","options":["Government bonds held by a company","Shares a company has repurchased and holds itself, reducing shares outstanding","Gold reserves held by a company's treasury","A special class of non-voting shares issued to executives"],"answer":1,"explanation":"Treasury stock (treasury shares) are shares a company has bought back from the open market and holds. They're no longer outstanding — they receive no dividends and carry no voting rights. Companies may reissue them for employee stock options, acquisitions, or cancel them. Treasury stock reduces total equity on the balance sheet."},
    {"q":"What is accrual accounting?","type":"mc","options":["Recording transactions only when cash is received or paid","Recording revenues when earned and expenses when incurred, regardless of cash flow timing","Accounting for inflation adjustments in financial statements","Tracking only capital expenditures, not operating expenses"],"answer":1,"explanation":"Accrual accounting records revenue when earned and expenses when incurred — not when cash changes hands. Required by GAAP and IFRS for most companies. Contrast with cash-basis accounting (only when cash moves). Accrual gives a more accurate picture of financial performance but creates non-cash items like accounts receivable and accrued expenses."},
    {"q":"What is working capital?","type":"mc","options":["Total assets of a company","Current assets minus current liabilities — measures short-term liquidity","Net income minus capital expenditures","Cash and cash equivalents only"],"answer":1,"explanation":"Working Capital = Current Assets − Current Liabilities. It measures a company's short-term liquidity — its ability to meet near-term obligations. Positive working capital means more short-term assets than liabilities (healthy). Negative can signal trouble. Key components: cash, accounts receivable, inventory (assets) vs. accounts payable, short-term debt (liabilities)."},
