    {"q":"What is 'tatemae' (建前) vs 'honne' (本音)?","type":"mc","options":["Public persona vs private feelings — what you say vs what you truly think","Work ethic vs personal ambition","Formal language vs casual dialect","Official policy vs unofficial practice"],"answer":0,"explanation":"Tatemae (建前) = public stance, the 'official' face shown to maintain social harmony; honne (本音) = one's true feelings, desires, or opinions. Japanese social interaction often maintains tatemae to avoid conflict. Understanding the gap between what someone says (tatemae) and what they mean (honne) is crucial for navigating Japanese business and social relationships."},
    {"q":"What is 'keigo' (敬語) in Japanese?","type":"mc","options":["Casual slang used by young people","The Japanese honorific language system — formal speech showing respect through vocabulary and grammar","Regional dialect variations across Japan","A specialized writing system for formal documents"],"answer":1,"explanation":"Keigo (敬語) is Japanese honorific language with three levels: sonkeigo (尊敬語, exalting the listener's actions), kenjougo (謙譲語, humbling your own actions), and teineigo (丁寧語, general polite speech). Used with superiors, customers, and strangers. Mastery of keigo is expected in Japanese business — saying 'irasshaimasu' instead of 'imasu' when referring to a customer's presence shows sonkeigo."},
    {"q":"What does 'shu-ha-ri' (守破離) represent?","type":"mc","options":["A three-step Japanese cooking method","Stages of mastery — follow rules, break rules, transcend rules","Japan's three main cultural regions","A business negotiation framework"],"answer":1,"explanation":"Shu-ha-ri describes mastery progression: Shu (守) = protect/follow — strictly learn and follow the master's form; Ha (破) = break — once fluent, explore and innovate; Ri (離) = leave/transcend — go beyond form to develop your own way. Rooted in Japanese martial arts and tea ceremony, it's applied to software development (Agile), business coaching, and artistic disciplines."},
    {"q":"What does the Japanese word 'Shouganai' (しょうがない) express?","type":"mc","options":["Excitement and anticipation","Extreme anger","'It can't be helped' — accepting situations beyond one's control","Strong disagreement"],"answer":2,"explanation":"'Shouganai' (仕方がない / しょうがない) means 'it can't be helped' or 'nothing can be done about it.' It expresses stoic acceptance of circumstances outside one's control — a deeply embedded cultural attitude in Japan. Similar expressions: 'shikata ga nai.' This philosophy contributed to Japan's resilience following natural disasters and hardships."},
    {"q":"What is a 'Ryokan' (旅館) in Japan?","type":"mc","options":["A type of Japanese fast food restaurant","A traditional Japanese inn with tatami rooms, futon beds, and often onsen","A Japanese commuter train line","A public bathhouse open to all"],"answer":1,"explanation":"A ryokan is a traditional Japanese inn featuring tatami-floored rooms, futon bedding, yukata robes, multi-course kaiseki meals, and often a natural hot spring (onsen). They embody Japanese hospitality (omotenashi). Staying in a ryokan is considered a quintessential Japanese cultural experience — popular in Kyoto, Hakone, and hot spring resort towns."},
    {"q":"What does the Japanese word 'Otaku' (オタク) originally mean?","type":"mc","options":["A disrespectful term for a foreigner","An obsessive enthusiast — originally of anime and manga, now applied to any intense hobby","A type of Japanese street food","A government worker"],"answer":1,"explanation":"'Otaku' (おたく/オタク) originally means 'your household' but evolved into slang for people with obsessive interests — initially anime, manga, and video games. In Japan it still carries a slightly negative connotation of social awkwardness. Globally it's been embraced positively. The massive Akihabara district in Tokyo is the spiritual home of otaku culture."},
    {"q":"What does the Japanese word 'Honne' (本音) mean?","type":"mc","options":["An honorific title for company presidents","One's true feelings or desires — contrasted with public behavior","A traditional Japanese musical instrument","A form of polite refusal"],"answer":1,"explanation":"'Honne' (本音, 'true sound') refers to a person's genuine feelings, desires, and opinions. It's contrasted with 'tatemae' (建前) — the public face one maintains to preserve harmony and meet social expectations. This duality is fundamental to understanding Japanese communication. Business deals, negotiations, and friendships must navigate the gap between honne and tatemae carefully."},
    {"q":"What is 'Juku' (塾) in Japanese education?","type":"mc","options":["A university scholarship program","A private cram school where students study intensively after regular school hours","A school sports club","A government-run adult education center"],"answer":1,"explanation":"Juku (塾) are private cram schools — a fixture of Japanese education. Students attend after regular school hours to prepare for entrance exams to elite middle schools, high schools, and universities. Japan's intense academic competition ('examination hell' — juken sensou) has made juku a massive industry. Major chains like Kumon are now global. Reflects Japan's deep cultural emphasis on education."}
  ],
  "trivia": [
    {"q":"What is the capital city of Japan?","type":"mc","options":["Osaka","Kyoto","Hiroshima","Tokyo"],"answer":3,"explanation":"Tokyo (東京, 'Eastern Capital') became Japan's capital in 1869 when Emperor Meiji moved from Kyoto. Greater Tokyo is the world's largest metropolitan area with ~37 million people. 'Tokyo' was formerly called Edo."},
    {"q":"How many continents are there on Earth?","type":"mc","options":["5","6","7","8"],"answer":2,"explanation":"Seven continents: Africa, Antarctica, Asia, Australia/Oceania, Europe, North America, and South America. Some models combine Europe and Asia as 'Eurasia' (6 continents). Asia is the largest by area and population; Australia is the smallest."},
    {"q":"What is the largest ocean on Earth?","type":"mc","options":["Atlantic","Indian","Arctic","Pacific"],"answer":3,"explanation":"The Pacific Ocean covers ~165 million km² — larger than all land on Earth combined. It holds the deepest point on Earth, the Mariana Trench (~11 km deep). The Pacific connects Asia, the Americas, and Oceania and is central to global trade routes."},
    {"q":"What is the chemical symbol for gold?","type":"mc","options":["Go","Gd","Au","Ag"],"answer":2,"explanation":"Gold's symbol Au comes from 'aurum,' Latin for gold. Silver is Ag (argentum), copper Cu (cuprum), iron Fe (ferrum), mercury Hg (hydrargyrum). Many element symbols reflect their Latin or Greek origins, not English names."},
    {"q":"Who painted the Mona Lisa?","type":"mc","options":["Michelangelo","Raphael","Vincent van Gogh","Leonardo da Vinci"],"answer":3,"explanation":"Leonardo da Vinci painted the Mona Lisa (~1503–1519). It hangs in the Louvre, Paris, behind bulletproof glass. It's the world's most visited, written-about, and parodied painting. Experts believe the subject is Lisa Gherardini, wife of a Florentine merchant."},
    {"q":"In which year did World War II end?","type":"mc","options":["1943","1944","1945","1946"],"answer":2,"explanation":"WWII ended in 1945: V-E Day (Germany's surrender) was May 8; V-J Day (Japan's) was August 15. The formal surrender ceremony was September 2, 1945, aboard USS Missouri in Tokyo Bay. The war lasted ~6 years and caused an estimated 70–85 million deaths."},
    {"q":"Approximately how fast does light travel in a vacuum?","type":"mc","options":["300,000 km/s","150,000 km/s","1,000,000 km/s","30,000 km/s"],"answer":0,"explanation":"Light travels at ~299,792 km/s (186,000 miles/s) in a vacuum — the ultimate speed limit of the universe per Einstein's relativity. Light from the Sun reaches Earth in ~8.3 minutes; from the nearest star, Alpha Centauri, it takes ~4.2 years."},
    {"q":"How many sides does a hexagon have?","type":"mc","options":["5","6","7","8"],"answer":1,"explanation":"A hexagon has 6 sides. Hexagons are remarkably efficient — they tile a flat surface with no gaps (honeycomb) and minimize material per enclosed area. Snowflakes have 6-fold symmetry. 'Hex' comes from Greek for six."},
    {"q":"What is the world's tallest mountain?","type":"mc","options":["K2","Kangchenjunga","Mont Blanc","Mount Everest"],"answer":3,"explanation":"Mount Everest stands at 8,848.86 m (29,031.7 ft) above sea level — the world's highest point. On the Nepal–Tibet border, it was first summited by Edmund Hillary and Tenzing Norgay on May 29, 1953. About 300 people have died attempting it."},
    {"q":"What is the most spoken language by number of native speakers?","type":"mc","options":["English","Spanish","Hindi","Mandarin Chinese"],"answer":3,"explanation":"Mandarin Chinese has ~920 million native speakers. English leads in total speakers (native + second language) at ~1.5 billion, making it the most globally used language for communication. Spanish is the second-most-common native language."},
    {"q":"In what year was the first iPhone released?","type":"mc","options":["2005","2006","2007","2008"],"answer":2,"explanation":"Steve Jobs unveiled the first iPhone on January 9, 2007 ('an iPod, a phone, and an internet communicator'). It went on sale June 29, 2007. It had no App Store (added in 2008) and no 3G. It nonetheless redefined the smartphone industry permanently."},
    {"q":"What does CEO stand for?","type":"mc","options":["Chief Executive Officer","Corporate Earnings Output","Central Executive Organization","Chief Equity Officer"],"answer":0,"explanation":"CEO = Chief Executive Officer, the highest-ranking executive responsible for overall operations and strategy. Other C-suite titles: CFO (Finance), COO (Operations), CTO (Technology), CMO (Marketing), CHRO (Human Resources). The CEO reports to the Board of Directors."},
    {"q":"Which planet in our solar system is closest to the Sun?","type":"mc","options":["Venus","Earth","Mars","Mercury"],"answer":3,"explanation":"Mercury orbits closest to the Sun at ~58 million km average distance. Despite proximity, Mercury isn't the hottest planet — Venus is, due to its dense CO₂ atmosphere trapping heat (greenhouse effect). Mercury's surface swings from -180°C to 430°C."},
    {"q":"What does PDF stand for?","type":"mc","options":["Printed Document File","Portable Document Format","Public Data File","Personal Desktop Format"],"answer":1,"explanation":"PDF = Portable Document Format, created by Adobe in 1993. PDFs render identically on any device or OS, making them ideal for official documents, contracts, and reports. In 2008, PDF became an open standard (ISO 32000). Adobe Acrobat remains the primary creator/viewer."},
    {"q":"How many bones are in the adult human body?","type":"mc","options":["186","196","206","216"],"answer":2,"explanation":"Adults have 206 bones. Babies start with ~270–300 bones that fuse during growth. The smallest bone is the stapes (stirrup) in the inner ear at ~3mm. The largest is the femur (thigh bone). Bones are living tissue — they grow, repair, and remodel throughout life."},
    {"q":"What is the largest country in the world by area?","type":"mc","options":["China","United States","Canada","Russia"],"answer":3,"explanation":"Russia spans ~17.1 million km² — nearly twice Canada (2nd) and about 11% of Earth's total land. It crosses 11 time zones. Despite its size, Russia's population (~144 million) is smaller than Pakistan's. China and India lead in population."},
    {"q":"What currency does Japan use?","type":"mc","options":["Yuan","Won","Yen","Baht"],"answer":2,"explanation":"Japan uses the Yen (円, ¥). The yen is the 3rd most traded currency in forex after the US dollar and euro. '¥' is also used for China's yuan, though officially the yuan uses the same symbol. Yen = 'en' in Japanese, meaning 'circle/round.'"},
    {"q":"What does 'www' stand for in web addresses?","type":"mc","options":["World Wide Web","Wireless Web Worldwide","Web Without Wires","World Wide Wire"],"answer":0,"explanation":"WWW = World Wide Web, invented by Tim Berners-Lee at CERN in 1989. The Web is a system of interlinked documents accessed via the Internet — but the Web and Internet are not the same. The Internet is the global network infrastructure; the Web is a service running on it."},
    {"q":"How many days are in a leap year?","type":"mc","options":["364","365","366","367"],"answer":2,"explanation":"A leap year has 366 days — February gets a 29th day. Leap years occur every 4 years, except century years not divisible by 400. So 2000 was a leap year; 1900 was not. This corrects for Earth's ~365.2425-day orbital period."},
    {"q":"What sport uses a shuttlecock?","type":"mc","options":["Tennis","Squash","Badminton","Racquetball"],"answer":2,"explanation":"Badminton uses a shuttlecock ('birdie') — a cork base with 16 feathers (or synthetic equivalent). It's one of the fastest racket sports; shuttlecocks can reach over 300 km/h in professional smashes. Badminton is wildly popular across Asia, especially in China, Indonesia, and Japan."},
    {"q":"What is the currency of the United Kingdom?","type":"mc","options":["Euro","Pound Sterling","Shilling","Crown"],"answer":1,"explanation":"The UK uses the Pound Sterling (£, GBP) — one of the oldest currencies still in use, dating to the 8th century. Britain did not join the eurozone when the euro launched in 1999. After Brexit (2020), the pound remains the UK's sole currency."},
    {"q":"What does 'HTML' stand for?","type":"mc","options":["HyperText Markup Language","High-Tech Machine Learning","Hyperlink and Text Management Layer","Home Tool Markup Language"],"answer":0,"explanation":"HTML = HyperText Markup Language — the backbone of web pages. Created by Tim Berners-Lee in 1991. HTML uses tags (<h1>, <p>, <a>, etc.) to structure content. Combined with CSS (styling) and JavaScript (behavior), it forms the foundation of everything on the web."},
    {"q":"At what temperature does water boil at sea level?","type":"mc","options":["90°C","95°C","100°C","105°C"],"answer":2,"explanation":"Water boils at 100°C (212°F) at standard atmospheric pressure (1 atm). At high altitude, lower air pressure means water boils below 100°C — affecting cooking times. In a pressure cooker, higher pressure raises the boiling point above 100°C, cooking food faster."},
    {"q":"What is the smallest prime number?","type":"mc","options":["0","1","2","3"],"answer":2,"explanation":"2 is the smallest prime and the only even prime. By definition, a prime is a natural number greater than 1 divisible only by 1 and itself. 0 and 1 are neither prime nor composite. Every even number >2 is divisible by 2, so no other even number can be prime."},
    {"q":"What is the main official language spoken in Brazil?","type":"mc","options":["Spanish","Portuguese","French","Brazilian"],"answer":1,"explanation":"Brazil's official language is Portuguese — not Spanish, despite being surrounded by Spanish-speaking countries. Brazil was colonized by Portugal (Treaty of Tordesillas, 1494). With ~215 million people, Brazil is the world's largest Portuguese-speaking nation by far."},
    {"q":"The mitochondria is often called the powerhouse of the cell.","type":"tf","options":["True","False"],"answer":0,"explanation":"True — mitochondria produce ATP (adenosine triphosphate) via cellular respiration, powering virtually all cellular activities. They have their own DNA, evidence of ancient endosymbiosis (a bacterium absorbed by an early cell). Cells with high energy needs (muscle, heart, liver) are packed with mitochondria."},
    {"q":"What is the chemical formula for water?","type":"mc","options":["HO","H3O","H2O","OH2"],"answer":2,"explanation":"Water is H₂O — two hydrogen atoms bonded to one oxygen atom. The molecule is bent at ~104.5°, making it polar (slightly negative near oxygen, slightly positive near hydrogens). This polarity gives water its remarkable properties: high surface tension, solvent ability, and high boiling point relative to its size."},
    {"q":"Which planet is known as the Red Planet?","type":"mc","options":["Venus","Jupiter","Saturn","Mars"],"answer":3,"explanation":"Mars appears red due to iron oxide (rust) on its surface. It has two small moons (Phobos and Deimos), the solar system's largest volcano (Olympus Mons, ~22km tall), and the longest canyon (Valles Marineris). Mars rovers — Curiosity and Perseverance — actively study its surface. A leading candidate for future human missions."},
    {"q":"Which is the tallest animal in the world?","type":"mc","options":["Elephant","Giraffe","Camel","Ostrich"],"answer":1,"explanation":"Giraffes (up to 5.5–6m tall) are the world's tallest living terrestrial animals. Their long necks allow them to reach leaves high in acacia trees — a competitive advantage. Remarkably, giraffes have the same number of neck vertebrae as humans: seven. They only need to sleep about 30 minutes a day."},
    {"q":"Which is the fastest land animal?","type":"mc","options":["Lion","Leopard","Cheetah","Greyhound"],"answer":2,"explanation":"The cheetah (Acinonyx jubatus) is the fastest land animal, reaching ~112 km/h (70 mph) in short bursts. Unlike other big cats, cheetahs can't roar — they chirp and purr. Built for speed: flexible spine, semi-retractable claws for grip, and a large nasal cavity for rapid oxygen intake. Found in sub-Saharan Africa and Iran."},
    {"q":"Which is the world's deepest freshwater lake?","type":"mc","options":["Lake Victoria","Lake Superior","Lake Titicaca","Lake Baikal"],"answer":3,"explanation":"Lake Baikal (Siberia, Russia) is the world's deepest lake at 1,642m and holds ~20% of Earth's unfrozen surface fresh water. Over 25 million years old — the world's oldest freshwater lake. Home to the Baikal seal (nerpa), the only freshwater seal species. A UNESCO World Heritage Site."},
    {"q":"What is the most abundant gas in Earth's atmosphere?","type":"mc","options":["Oxygen","Carbon dioxide","Argon","Nitrogen"],"answer":3,"explanation":"Earth's atmosphere is ~78% nitrogen (N₂), ~21% oxygen, ~0.93% argon, and ~0.04% CO₂ (plus water vapor and trace gases). Nitrogen is chemically inert and essential for life — the nitrogen cycle converts it into forms usable by plants. Despite popular belief, we breathe mostly nitrogen — oxygen is about 1/5 of each breath."},
    {"q":"What is photosynthesis?","type":"mc","options":["Organisms breaking down sugar to release energy","The process plants use to convert sunlight, CO₂ and water into glucose and oxygen","Animals using sunlight to produce vitamin D","The way cameras capture light on digital sensors"],"answer":1,"explanation":"Photosynthesis: CO₂ + H₂O + light energy → glucose + O₂. Chlorophyll in plant cells captures sunlight. It's the foundation of nearly all food chains — plants produce the oxygen we breathe and the sugars that power ecosystems. Rain forests are called Earth's lungs for their massive photosynthetic output."},
    {"q":"What are the three primary colors of light?","type":"mc","options":["Red, yellow, blue","Red, green, blue","Cyan, magenta, yellow","Red, orange, yellow"],"answer":1,"explanation":"The primary colors of light (additive color model) are Red, Green, and Blue (RGB) — mixing all three produces white light. Used in screens (monitors, TVs, phones). This differs from pigment/paint (subtractive model) where primaries are red, yellow, and blue (or cyan, magenta, yellow in printing). Your phone screen makes every color from RGB pixels."},
    {"q":"Who invented the telephone?","type":"mc","options":["Thomas Edison","Nikola Tesla","Guglielmo Marconi","Alexander Graham Bell"],"answer":3,"explanation":"Alexander Graham Bell received the first telephone patent in 1876, with the famous first call: 'Mr. Watson, come here.' However, Elisha Gray filed a patent application the same day. Italian inventor Antonio Meucci had earlier devices (patent caveat filed in 1871). Bell's patent prevailed legally, making him the credited inventor."},
    {"q":"Who made the first powered airplane flight at Kitty Hawk in 1903?","type":"mc","options":["Charles Lindbergh","Amelia Earhart","The Wright Brothers","Alberto Santos-Dumont"],"answer":2,"explanation":"Orville and Wilbur Wright achieved the first successful powered, heavier-than-air flight on December 17, 1903, at Kitty Hawk, North Carolina. The first flight lasted 12 seconds and covered 37 meters. Four flights were made that day. The Wright Flyer is now at the Smithsonian National Air and Space Museum."},
    {"q":"Who invented the light bulb?","type":"mc","options":["Nikola Tesla","Benjamin Franklin","James Watt","Thomas Edison"],"answer":3,"explanation":"Thomas Edison developed a practical, long-lasting incandescent light bulb in 1879. While others (Joseph Swan, Warren de la Rue) experimented before him, Edison's lasting carbonized bamboo filament design was the commercial breakthrough. He also built the first electrical power distribution system in New York City (1882)."},
    {"q":"In what year did the Berlin Wall fall?","type":"mc","options":["1987","1988","1989","1990"],"answer":2,"explanation":"The Berlin Wall fell on November 9, 1989 — when East Germany opened its borders following weeks of protests. Germans dismantled the wall with hammers and pickaxes. The Wall had divided Berlin since August 13, 1961. Its fall symbolized the end of the Cold War and led to German reunification on October 3, 1990."},
    {"q":"In what year did the Titanic sink?","type":"mc","options":["1910","1912","1914","1915"],"answer":1,"explanation":"RMS Titanic sank on April 15, 1912, after striking an iceberg during her maiden voyage. Of ~2,224 passengers and crew, ~1,500 died — making it one of history's deadliest peacetime maritime disasters. The Titanic was discovered by Robert Ballard in 1985, resting ~3,800m below the North Atlantic surface."},
    {"q":"Where were the first modern Olympic Games held?","type":"mc","options":["London","Paris","Rome","Athens"],"answer":3,"explanation":"The first modern Olympic Games were held in Athens, Greece, in April 1896. Organized by Pierre de Coubertin, 14 nations participated in 43 events. Greece won the most medals (47). The ancient Olympics originated in Olympia, Greece, around 776 BC. Athens also hosted the 2004 Summer Olympics."},
    {"q":"Which is the world's longest river?","type":"mc","options":["Amazon","Mississippi","Congo","Nile"],"answer":3,"explanation":"The Nile (6,650 km) is traditionally considered the world's longest river, flowing north through northeastern Africa to the Mediterranean. However, recent measurements suggest the Amazon may be longer. The Amazon carries far more water — 20% of all river water entering the ocean. This geographic debate continues among scientists."},
    {"q":"Which is the world's largest desert?","type":"mc","options":["Sahara Desert","Gobi Desert","Arabian Desert","Antarctic Desert"],"answer":3,"explanation":"Antarctica is the world's largest desert at ~14.2 million km² — a polar desert with almost no precipitation. The Sahara (9.2 million km²) is the largest hot desert. A desert is defined by precipitation (< 250mm/year), not temperature. Antarctica averages ~2 inches of precipitation annually in its interior."},
    {"q":"What is the smallest country in the world?","type":"mc","options":["Monaco","San Marino","Liechtenstein","Vatican City"],"answer":3,"explanation":"Vatican City (0.44 km²) is the world's smallest country — an independent city-state within Rome, Italy. The Holy See (the Pope's governing body) controls it. Population: ~800 people. Home to St. Peter's Basilica, the Sistine Chapel, and the Vatican Museums. Established by the Lateran Treaty (1929)."},
    {"q":"Which country has the world's largest population?","type":"mc","options":["China","United States","Indonesia","India"],"answer":3,"explanation":"India surpassed China as the world's most populous country in 2023, with ~1.43 billion people. China's population is declining due to its one-child policy legacy. India's younger demographic (median age ~28 vs China's ~39) positions it as a major future economic force. India's population is projected to peak around 1.7 billion by 2064."},
    {"q":"What is the Bermuda Triangle known for?","type":"mc","options":["A famous Caribbean surf destination","A region in the western North Atlantic associated with mysterious disappearances of ships and aircraft","A protected marine biodiversity zone near Bermuda","A major international shipping hub"],"answer":1,"explanation":"The Bermuda Triangle (between Miami, Bermuda, and Puerto Rico) gained fame for alleged mysterious disappearances of ships and planes. However, Lloyd's of London does not charge higher insurance rates for the area — disappearance rates are no higher than other heavily trafficked ocean regions. Most incidents have mundane explanations. It remains a cultural myth."},
    {"q":"How many strings does a standard guitar have?","type":"mc","options":["4","5","6","7"],"answer":2,"explanation":"A standard guitar has 6 strings, tuned E-A-D-G-B-E (low to high). Bass guitars have 4 strings. 7-string and 8-string guitars exist for extended range. The guitar is one of the world's most popular instruments. Classical, acoustic, and electric variants dominate different musical genres from flamenco to heavy metal."},
    {"q":"What is the hardest natural substance on Earth?","type":"mc","options":["Steel","Quartz","Sapphire","Diamond"],"answer":3,"explanation":"Diamond is the hardest natural substance, rating 10 on the Mohs scale. Made of carbon atoms arranged in a crystal lattice, diamond's structure resists scratching better than any other natural material. Used in cutting tools, drill bits, and grinding wheels (industrial diamonds) as much as in jewelry. Graphite and diamond are both pure carbon — different crystal structures, vastly different properties."},
    {"q":"What is the atomic number of hydrogen?","type":"mc","options":["0","1","2","3"],"answer":1,"explanation":"Hydrogen has atomic number 1 — one proton in its nucleus. It's the simplest, lightest, and most abundant element in the universe, making up ~75% of normal matter. Stars (including the sun) are primarily hydrogen — the sun fuses hydrogen into helium to produce energy. Hydrogen is the first element on the periodic table."},
    {"q":"Which blood type is known as the universal donor?","type":"mc","options":["A positive","AB positive","B negative","O negative"],"answer":3,"explanation":"O negative (O-) is the universal donor for red blood cells — it lacks A, B, and Rh antigens, so it won't trigger immune reactions in any recipient. AB positive is the universal plasma donor. In emergencies when blood type is unknown, O- is given. Only ~7% of people have O- blood, making it in constant demand for blood banks."},
    {"q":"How many chambers does the human heart have?","type":"mc","options":["2","3","4","5"],"answer":2,"explanation":"The human heart has 4 chambers: right atrium and right ventricle (receiving deoxygenated blood from the body and pumping to lungs), and left atrium and left ventricle (receiving oxygenated blood from lungs and pumping to the body). The left ventricle has the thickest walls — it pumps blood to the entire body."},
    {"q":"Which is the longest bone in the human body?","type":"mc","options":["Humerus (upper arm)","Tibia (shin)","Femur (thigh)","Fibula (outer lower leg)"],"answer":2,"explanation":"The femur (thigh bone) is the longest and strongest bone in the body, making up about 1/4 of a person's height. It connects the hip to the knee. Its ball-and-socket hip joint allows the widest range of motion of any joint. The femur can withstand compressive forces of up to 1,700 kg."},
    {"q":"Which organ produces insulin in the human body?","type":"mc","options":["Liver","Kidney","Spleen","Pancreas"],"answer":3,"explanation":"The pancreas produces insulin (from beta cells in the islets of Langerhans), which regulates blood sugar by facilitating glucose uptake. It also produces glucagon (raises blood sugar) and digestive enzymes. Type 1 diabetes results from immune destruction of insulin-producing cells; Type 2 from insulin resistance. The pancreas is both endocrine and exocrine."},
    {"q":"What does seismology study?","type":"mc","options":["The behavior of gases","Earthquakes and seismic waves","The composition of rocks","Ocean floor mapping"],"answer":1,"explanation":"Seismology is the scientific study of earthquakes and seismic wave propagation. Seismographs measure ground motion; the Richter scale (and more modern moment magnitude scale) quantifies energy released. Seismic waves have revealed Earth's internal structure — the liquid outer core was discovered because S-waves (shear waves) can't travel through liquids."},
    {"q":"What causes a solar eclipse?","type":"mc","options":["Earth passing between the Sun and Moon","The Moon passing between Earth and the Sun, blocking sunlight","A storm on the Sun's surface","Earth's shadow falling on the Moon"],"answer":1,"explanation":"A solar eclipse occurs when the Moon passes between Earth and the Sun, blocking sunlight. A total solar eclipse is remarkable: the Moon is 400x smaller than the Sun but also 400x closer, making them appear the same size. This allows the Sun's corona to be visible. Total solar eclipses are rare at any given location — about once every 375 years."},
    {"q":"What is the nearest star to Earth after the Sun?","type":"mc","options":["Sirius","Barnard's Star","Alpha Centauri A","Proxima Centauri"],"answer":3,"explanation":"Proxima Centauri is Earth's nearest stellar neighbor at ~4.24 light-years away. Part of the Alpha Centauri triple star system, it's a red dwarf star too dim to see with the naked eye. Proxima Centauri b, a potentially habitable exoplanet, was discovered orbiting it in 2016. Light from Proxima Centauri takes ~4.24 years to reach us."},
    {"q":"How many moons does Mars have?","type":"mc","options":["0","1","2","4"],"answer":2,"explanation":"Mars has two small, irregularly shaped moons: Phobos ('fear') and Deimos ('dread'), named after the sons of Ares (the Greek equivalent of Mars). Both are thought to be captured asteroids. Phobos orbits closer than any other planetary moon and is gradually spiraling inward — it will either collide with Mars or break up in ~50 million years."},
    {"q":"Which is the largest planet in our solar system?","type":"mc","options":["Saturn","Uranus","Neptune","Jupiter"],"answer":3,"explanation":"Jupiter is the solar system's largest planet — 1,300 Earths could fit inside it. A gas giant composed mainly of hydrogen and helium, its iconic Great Red Spot is a storm that has raged for at least 350 years (it's shrinking). Jupiter has at least 95 known moons, including Ganymede — larger than Mercury and the largest moon in the solar system."},
    {"q":"Where is the Great Barrier Reef located?","type":"mc","options":["Indonesia","Philippines","New Zealand","Australia"],"answer":3,"explanation":"The Great Barrier Reef off Queensland, Australia is the world's largest coral reef system (~2,300 km long) — the largest living structure on Earth, visible from space. Home to 1,500+ fish species, 4,000+ mollusk species, and 30+ whale/dolphin species. Under severe threat from ocean warming and bleaching — over 50% damaged by 2024."},
    {"q":"How many UNESCO World Heritage Sites are there (approximately)?","type":"mc","options":["500","800","1,200","2,000"],"answer":2,"explanation":"UNESCO recognizes about 1,200 World Heritage Sites (as of 2024) across 168 countries — 900+ cultural sites, 200+ natural sites, and ~40 mixed. Italy has the most sites (~58), followed by China and Germany. Sites include the Great Wall, Machu Picchu, the Pyramids of Giza, Angkor Wat, and Japan's Fujisan."},
    {"q":"What is the official language of Egypt?","type":"mc","options":["Egyptian","Coptic","English","Arabic"],"answer":3,"explanation":"Arabic is Egypt's official language — specifically Egyptian Arabic, a dialect distinct from Modern Standard Arabic. Coptic (the descendant of ancient Egyptian) is used only in Coptic Christian liturgy. English and French are widely spoken in business and tourism. Egypt has ~100 million speakers of its Arabic dialect, the most widely understood across the Arab world."},
    {"q":"What is the currency of India?","type":"mc","options":["Rupiah","Rupee","Riyal","Taka"],"answer":1,"explanation":"India's currency is the Indian Rupee (₹, INR). Introduced in the 16th century by Sher Shah Suri, it was adopted as independent India's currency in 1947. The ₹ symbol was adopted in 2010. Other 'rupee' currencies: Pakistani Rupee, Sri Lankan Rupee, Nepali Rupee, Indonesian Rupiah (related etymology). India's RBI manages monetary policy."},
    {"q":"What is the tallest building in the world?","type":"mc","options":["Shanghai Tower","Makkah Royal Clock Tower","One World Trade Center","Burj Khalifa"],"answer":3,"explanation":"The Burj Khalifa in Dubai (UAE) stands at 828 meters (163 floors), the world's tallest building since 2010. Designed by Skidmore, Owings & Merrill and completed in 2010, it holds multiple records: highest occupied floor, highest outdoor observation deck, longest elevator travel distance. Named after UAE president Sheikh Khalifa bin Zayed Al Nahyan."},
    {"q":"Who wrote the play 'Romeo and Juliet'?","type":"mc","options":["Charles Dickens","Geoffrey Chaucer","Oscar Wilde","William Shakespeare"],"answer":3,"explanation":"William Shakespeare wrote Romeo and Juliet around 1595–96. The tragedy of star-crossed lovers from feuding Verona families has been adapted into countless films, musicals, ballets, and operas. Shakespeare's works are the most performed dramatic texts globally. His birthplace, Stratford-upon-Avon, and the Globe Theatre in London draw millions of visitors."},
    {"q":"Who wrote the Harry Potter series?","type":"mc","options":["Suzanne Collins","Philip Pullman","Stephenie Meyer","J.K. Rowling"],"answer":3,"explanation":"J.K. (Joanne) Rowling wrote the seven Harry Potter books (1997–2007). The series has sold over 600 million copies in 85 languages — among the best-selling series in history. Rowling conceived the idea on a delayed train in 1990. The first book was rejected by 12 publishers before Bloomsbury accepted it. The franchise (books, films, theme parks, merchandise) is worth ~$25 billion."},
    {"q":"What is the best-selling book of all time?","type":"mc","options":["Don Quixote","The Lord of the Rings","Harry Potter","The Bible"],"answer":3,"explanation":"The Bible is the best-selling book of all time, with estimated total sales of 5–7 billion copies. It's been translated into over 3,300 languages. Second is the Quran. Among secular books, Don Quixote (~500 million), A Tale of Two Cities (~200 million), and The Little Prince (~200 million) rank high. Harry Potter series has sold ~600 million."},
    {"q":"Which social media platform was founded first?","type":"mc","options":["Twitter","Facebook","YouTube","LinkedIn"],"answer":3,"explanation":"LinkedIn launched in May 2003, making it the oldest of these four platforms. Facebook launched in February 2004, YouTube in February 2005, and Twitter in March 2006. LinkedIn now has 1 billion+ members in 200+ countries. It's the dominant professional networking platform globally, acquired by Microsoft in 2016 for $26.2 billion."},
    {"q":"How much data is a petabyte?","type":"mc","options":["1,000 gigabytes","1,000 terabytes","1,000 kilobytes","1,000 megabytes"],"answer":1,"explanation":"A petabyte = 1,000 terabytes (or 10^15 bytes). Data hierarchy: bit → byte → kilobyte (KB) → megabyte (MB) → gigabyte (GB) → terabyte (TB) → petabyte (PB) → exabyte (EB) → zettabyte (ZB). The global internet generates an estimated 2.5 quintillion bytes (2.5 exabytes) of data every day."},
    {"q":"What does RAM stand for in computing?","type":"mc","options":["Remote Access Module","Read and Modify","Random Access Memory","Rapid Application Management"],"answer":2,"explanation":"RAM (Random Access Memory) is a computer's short-term, volatile memory — where the OS, active apps, and current data live while the computer is on. More RAM allows more programs to run simultaneously. RAM is 'random access' because any memory location is accessible in the same time, unlike sequential-access storage."},
    {"q":"What does CPU stand for?","type":"mc","options":["Central Processing Unit","Computer Program Utility","Core Processor Unit","Central Program Update"],"answer":0,"explanation":"CPU = Central Processing Unit — the 'brain' of a computer that executes instructions from programs. Measured in GHz (clock speed) and cores (parallel processing). Modern CPUs have 8–32+ cores. Major manufacturers: Intel (x86 architecture), AMD (x86), Apple (ARM-based M-series), Qualcomm (ARM). The CPU works with RAM and storage to run applications."},
    {"q":"Who co-founded Microsoft?","type":"mc","options":["Steve Jobs and Steve Wozniak","Elon Musk and Peter Thiel","Larry Page and Sergey Brin","Bill Gates and Paul Allen"],"answer":3,"explanation":"Bill Gates and Paul Allen founded Microsoft in April 1975 in Albuquerque, New Mexico. They started by developing a BASIC interpreter for the Altair 8800. Their breakthrough: licensing MS-DOS to IBM in 1981. Windows followed in 1985. Gates stepped down as CEO in 2000, and from the board in 2020. Microsoft's market cap has exceeded $3 trillion."},
    {"q":"Who co-founded Apple?","type":"mc","options":["Bill Gates and Paul Allen","Mark Zuckerberg and Eduardo Saverin","Steve Jobs, Steve Wozniak, and Ronald Wayne","Larry Ellison and Steve Jobs"],"answer":2,"explanation":"Apple was co-founded by Steve Jobs, Steve Wozniak, and Ronald Wayne on April 1, 1976. Wayne sold his 10% stake for $800 — which would be worth hundreds of billions today. Wozniak designed the first Apple computers; Jobs drove the vision and marketing. Apple became the first US company to reach a $1 trillion market cap (2018) and $3 trillion (2023)."},
    {"q":"Who founded Amazon?","type":"mc","options":["Elon Musk","Larry Ellison","Jack Ma","Jeff Bezos"],"answer":3,"explanation":"Jeff Bezos founded Amazon in July 1994 in his garage in Bellevue, Washington — initially as an online bookstore. Amazon has since expanded into cloud computing (AWS, the most profitable segment), streaming (Prime Video), groceries (Whole Foods), and more. AWS alone powers a significant portion of the internet. Bezos stepped down as CEO in 2021."},
    {"q":"What was the first company to reach a $1 trillion market capitalization?","type":"mc","options":["Microsoft","Amazon","Google","Apple"],"answer":3,"explanation":"Apple became the first US publicly listed company to reach a $1 trillion market cap on August 2, 2018. Apple later hit $2 trillion (2020) and $3 trillion (January 2022). Amazon, Microsoft, and Alphabet followed into the trillion-dollar club. Saudi Aramco (oil company) briefly crossed $2 trillion in 2019."},
    {"q":"AI stands for Artificial Intelligence.","type":"tf","options":["True","False"],"answer":0,"explanation":"True — Artificial Intelligence (AI) refers to machines performing tasks that typically require human intelligence: reasoning, learning, problem-solving, perception, language understanding. The term was coined by John McCarthy in 1956. Modern AI includes machine learning (ML), deep learning, natural language processing (NLP), and generative AI (like large language models)."},
    {"q":"What does GPS stand for?","type":"mc","options":["General Positioning System","Global Positioning Satellite","Global Positioning System","Geographical Precision System"],"answer":2,"explanation":"GPS = Global Positioning System — a US military-developed satellite navigation system (31 active satellites) providing location and time information anywhere on Earth. Opened to civilian use in 1983 after Korean Air Lines Flight 007 was shot down due to navigation error. Now foundational to smartphones, aviation, shipping, and precision agriculture."},
    {"q":"Bluetooth technology was named after a 10th-century Viking king.","type":"tf","options":["True","False"],"answer":0,"explanation":"True — Bluetooth was named after Harald 'Bluetooth' Gormsson, the 10th-century Danish king who united Scandinavian tribes — just as the technology was meant to unite communication protocols. The Bluetooth logo combines his initials in runic script (ᚼ + ᛒ). Developed by Ericsson in 1994, it's now used in billions of devices worldwide."},
    {"q":"Which programming language is named after a type of snake?","type":"mc","options":["Cobra","Java","Swift","Python"],"answer":3,"explanation":"Python was created by Guido van Rossum (released 1991) and named after Monty Python's Flying Circus — not the snake. However, its logo features two intertwined pythons. Python is now the world's most popular programming language (TIOBE index), widely used in data science, AI/ML, web development, and automation."},
    {"q":"How many colored rings are on the Olympic flag?","type":"mc","options":["4","5","6","7"],"answer":1,"explanation":"The Olympic flag features 5 interlocking rings — blue, yellow, black, green, and red — on a white background. Designed by Pierre de Coubertin in 1913, the colors were chosen because at least one appears in the flag of every nation. The rings represent the union of the five continents. First flown at the 1920 Antwerp Olympics."},
    {"q":"What surface is Wimbledon tennis tournament traditionally played on?","type":"mc","options":["Clay","Hardcourt","Grass","Carpet"],"answer":2,"explanation":"Wimbledon (The Championships) is the world's oldest and most prestigious tennis Grand Slam, played on grass courts at the All England Lawn Tennis and Croquet Club in London. Founded in 1877. Other Grand Slams: Australian Open (hard), French Open/Roland Garros (clay), US Open (hard). Grass favors serve-and-volley play and fast balls."},
    {"q":"Which country invented the sport of soccer (association football)?","type":"mc","options":["Brazil","Spain","Germany","England"],"answer":3,"explanation":"Modern association football (soccer) was codified in England when the Football Association was founded in 1863 in London, establishing standardized rules. Earlier forms of kicking games existed in ancient China, Greece, and Rome. England's first clubs and the FA Cup (1872) established football as an organized sport that spread globally via the British Empire."},
    {"q":"How many players are on a standard soccer team on the field?","type":"mc","options":["9","10","11","12"],"answer":2,"explanation":"11 players per team play on the field in association football (soccer): 10 outfield players and 1 goalkeeper. Plus substitutes on the bench (up to 9 in most leagues, with 3–5 permitted substitutions). The standard field is 100–110m long by 64–75m wide. FIFA estimates over 270 million people play football globally."},
    {"q":"In which year did a man first walk on the Moon?","type":"mc","options":["1967","1968","1969","1970"],"answer":2,"explanation":"Neil Armstrong and Buzz Aldrin landed on the Moon on July 20, 1969 (Apollo 11). Armstrong's words: 'That's one small step for [a] man, one giant leap for mankind.' Michael Collins orbited in the command module. 12 humans have walked on the Moon (all Apollo missions, 1969–1972). No humans have returned since."},
    {"q":"Approximately how fast does sound travel through air at sea level?","type":"mc","options":["343 km/h","343 m/s","1,225 m/s","1,225 km/h"],"answer":1,"explanation":"Sound travels at ~343 m/s (1,235 km/h) through air at 20°C — about Mach 1. Aircraft exceeding this break the sound barrier, creating a sonic boom. Sound travels faster through denser media: ~1,480 m/s in water, ~5,100 m/s in steel. Thunder sounds after lightning because light reaches you nearly instantaneously; sound takes ~3 seconds per km."},
    {"q":"What scale measures earthquake magnitude?","type":"mc","options":["Beaufort Scale","Fahrenheit Scale","Richter Scale","Decibel Scale"],"answer":2,"explanation":"The Richter Scale (developed by Charles Richter in 1935) measures earthquake magnitude logarithmically — each whole number increase represents 10x more ground motion and ~31x more energy. Earthquakes below 2.0 are imperceptible; 7.0+ are major. The modern moment magnitude scale (Mw) is more accurate for large quakes but the Richter name persists culturally."},
    {"q":"What is a black hole?","type":"mc","options":["A region in space with no stars","A collapsed star so dense that nothing — not even light — can escape its gravity","An area of the universe with no dark matter","A large cloud of dark gas blocking starlight"],"answer":1,"explanation":"A black hole forms when massive stars collapse under gravity — creating a singularity of extreme density. Its event horizon is the point of no return: nothing, not even light, escapes. Supermassive black holes (millions to billions of solar masses) exist at the center of most galaxies. The first black hole image was captured in 2019 (M87*)."},
    {"q":"What causes thunder during a thunderstorm?","type":"mc","options":["Clouds colliding with each other","Lightning heating air to expand rapidly, creating a shockwave heard as thunder","Heavy raindrops hitting the ground","Wind turbulence between cold and warm air masses"],"answer":1,"explanation":"Thunder is the sound produced by the rapid expansion of air superheated by lightning — lightning heats surrounding air to ~27,000°C in milliseconds, causing explosive expansion (shockwave). You see lightning first because light travels nearly instantaneously (~300,000 km/s); sound travels at ~343 m/s. Every 3 seconds between flash and thunder ≈ 1 km away."},
    {"q":"How many time zones does Earth have?","type":"mc","options":["12","20","24","36"],"answer":2,"explanation":"Earth is theoretically divided into 24 time zones (one per hour of the day), each roughly 15° of longitude wide. In practice, countries adjust for convenience — India is UTC+5:30, Nepal UTC+5:45, and China uses a single time zone (UTC+8) despite spanning 5 natural zones. UTC (Coordinated Universal Time) is the global time standard."},
    {"q":"What is the deepest point in the world's oceans?","type":"mc","options":["Puerto Rico Trench","Java Trench","Tonga Trench","Mariana Trench (Challenger Deep)"],"answer":3,"explanation":"Challenger Deep in the Mariana Trench (western Pacific Ocean) is the deepest known point on Earth at ~10,935 meters below sea level. Only three people have descended to the bottom: Don Walsh and Jacques Piccard (1960) and James Cameron (2012). The pressure is ~1,086 times atmospheric pressure at sea level."},
    {"q":"The Amazon rainforest produces approximately what percentage of Earth's oxygen?","type":"mc","options":["5%","10%","20%","50%"],"answer":2,"explanation":"The Amazon rainforest produces ~20% of Earth's oxygen — earning the nickname 'the lungs of the Earth.' However, it also consumes roughly the same amount through respiration, so its net oxygen contribution to the atmosphere is near zero. Its importance lies in carbon storage (billions of tons of CO₂), biodiversity (~10% of all species), and climate regulation."},
    {"q":"What is the capital city of Australia?","type":"mc","options":["Sydney","Melbourne","Brisbane","Canberra"],"answer":3,"explanation":"Canberra is Australia's capital, not Sydney (the largest city) or Melbourne (the second largest). Canberra was purpose-built as a compromise between Sydney and Melbourne rivals competing to be the capital. Founded in 1913, designed by American architects Walter Burley Griffin and Marion Mahony Griffin following an international design competition."},
    {"q":"What is Japan's national bird?","type":"mc","options":["Crane","Pheasant","Eagle","Kingfisher"],"answer":1,"explanation":"The Green Pheasant (Kiji, Phasianus versicolor) is Japan's national bird, officially designated in 1947. It's endemic to Japan and appears on postal symbols. The Japanese crane (tanchōzuru) is a national symbol too — associated with longevity, luck, and fidelity — but the pheasant holds official national bird status."},
    {"q":"What is the height of the Eiffel Tower?","type":"mc","options":["224 meters","300 meters","330 meters","425 meters"],"answer":2,"explanation":"The Eiffel Tower stands 330 meters tall including its broadcast antenna (originally 300m when completed in 1889). Built by Gustave Eiffel for the 1889 World's Fair in Paris. It was the world's tallest structure until the Chrysler Building (1930). Now receives ~7 million visitors annually — the world's most visited paid monument."},
    {"q":"How many arches does the Colosseum in Rome have?","type":"mc","options":["40","60","80","120"],"answer":2,"explanation":"The Colosseum has 80 arches on each of its three external tiers (240 total), with 80 entrances. Completed in 80 CE, it held 50,000–80,000 spectators for gladiatorial combat, animal hunts (venationes), and public spectacles. Built from travertine stone, tuff, brick, and concrete — a marvel of Roman engineering that influenced stadium design to this day."},
    {"q":"How long is the Great Wall of China?","type":"mc","options":["2,300 km","4,500 km","13,000 km","21,000 km"],"answer":2,"explanation":"The Great Wall of China stretches approximately 21,196 km (13,171 miles) if all sections — including parallel walls, branches, and associated fortifications — are counted. The main wall with natural barriers is ~8,850 km. Built across multiple dynasties (7th century BC – 17th century AD), its primary purpose was northern defense. UNESCO Heritage Site since 1987."},
    {"q":"Stonehenge is located in which English county?","type":"mc","options":["Cornwall","Devon","Oxfordshire","Wiltshire"],"answer":3,"explanation":"Stonehenge stands on Salisbury Plain in Wiltshire, England. The prehistoric monument was constructed in phases from ~3000 BC to ~1500 BC — long before the Roman conquest of Britain. Its precise purpose is debated: astronomical calendar, burial ground, or ceremonial site. The largest stones (sarsens) weigh up to 25 tonnes and were transported ~25 km."},
    {"q":"How many 'New Seven Wonders of the World' are there?","type":"mc","options":["5","7","8","10"],"answer":1,"explanation":"There are 7 New Wonders of the World, selected by global vote in 2007: Great Wall of China, Chichén Itzá (Mexico), Christ the Redeemer (Brazil), Machu Picchu (Peru), Colosseum (Italy), Taj Mahal (India), and Petra (Jordan). The original Seven Wonders of the Ancient World date to ~200 BC; only the Great Pyramid of Giza survives."},
    {"q":"Where is the Louvre Museum located?","type":"mc","options":["Rome, Italy","London, England","Berlin, Germany","Paris, France"],"answer":3,"explanation":"The Louvre in Paris is the world's largest and most visited art museum (~9 million visitors/year). Home to ~35,000 displayed artworks including the Mona Lisa, Venus de Milo, and Winged Victory of Samothrace. Originally a 12th-century royal palace. Its iconic glass pyramid entrance was designed by I.M. Pei and opened in 1989."},
    {"q":"How many colors are in a rainbow?","type":"mc","options":["5","6","7","8"],"answer":2,"explanation":"A rainbow displays 7 colors: Red, Orange, Yellow, Green, Blue, Indigo, Violet — remembered as ROYGBIV (Roy G. Biv). Rainbows form when sunlight refracts and reflects inside water droplets, separating white light into its wavelength components. Technically a rainbow is a full circle — we see a semicircle because the horizon blocks the rest."},
    {"q":"Who painted the Sistine Chapel ceiling?","type":"mc","options":["Leonardo da Vinci","Raphael","Caravaggio","Michelangelo"],"answer":3,"explanation":"Michelangelo painted the Sistine Chapel ceiling (Vatican City) between 1508–1512, commissioned by Pope Julius II. The ~500 m² ceiling depicts Genesis scenes including the famous 'Creation of Adam.' Michelangelo preferred sculpture and considered himself no painter — yet produced one of history's greatest artworks. He later painted 'The Last Judgment' on the altar wall (1536–1541)."},
    {"q":"Who composed the symphony 'Ode to Joy'?","type":"mc","options":["Wolfgang Amadeus Mozart","Franz Schubert","Johann Sebastian Bach","Ludwig van Beethoven"],"answer":3,"explanation":"Beethoven composed Symphony No. 9 in D minor (featuring 'Ode to Joy' in the 4th movement) in 1824. Remarkably, he was completely deaf when he wrote it — he never heard it performed. Ode to Joy (with Friedrich Schiller's poem) has become a global symbol of unity. It's the anthem of the European Union."},
    {"q":"Who composed 'The Four Seasons'?","type":"mc","options":["George Frideric Handel","Antonio Vivaldi","Johann Sebastian Bach","Claudio Monteverdi"],"answer":1,"explanation":"Antonio Vivaldi composed 'The Four Seasons' (Le quattro stagioni) around 1716–1717. It's a set of four violin concertos — Spring, Summer, Autumn, Winter — each depicting the season through music. Published in 1725, it remains one of the most performed and recognizable pieces in classical music. Vivaldi was a Venetian Baroque composer and virtuoso violinist."},
    {"q":"Jazz music originated in which US city?","type":"mc","options":["Chicago","Memphis","Nashville","New Orleans"],"answer":3,"explanation":"Jazz originated in New Orleans, Louisiana, in the late 19th to early 20th centuries — blending African American musical traditions (blues, ragtime, spirituals) with European harmony and instrumentation. New Orleans' unique multicultural environment (French, African, Caribbean, American) created the conditions for jazz to emerge. Louis Armstrong, born in New Orleans, became its global ambassador."},
    {"q":"Which historical period marked the cultural rebirth of arts and learning in Europe?","type":"mc","options":["The Dark Ages","The Middle Ages","The Enlightenment","The Renaissance"],"answer":3,"explanation":"The Renaissance ('rebirth' in French) was a cultural movement in Europe from the 14th–17th centuries — beginning in Italy (Florence). It marked renewed interest in classical Greek and Roman arts, literature, science, and humanism. Key figures: Leonardo da Vinci, Michelangelo, Raphael, Galileo, and Gutenberg (printing press, 1440). It bridged the Middle Ages and modernity."},
    {"q":"What was the Magna Carta?","type":"mc","options":["A peace treaty ending the Hundred Years' War","A 1215 English charter limiting royal power — a foundation of constitutional law","A declaration of independence by English nobles","A document establishing the Church of England"],"answer":1,"explanation":"The Magna Carta ('Great Charter') was signed by King John of England in June 1215 under pressure from rebellious barons. It established that the king was subject to the law — not above it. Key principles: no imprisonment without trial, right to a fair hearing. It became a foundational document for constitutional governance, habeas corpus, and human rights law."},
    {"q":"Who was Napoleon Bonaparte?","type":"mc","options":["A French revolutionary leader who became Emperor of France and conquered much of Europe","The first president of the French Republic","A Prussian general who defeated the French in the Seven Years' War","The last king of France before the Revolution"],"answer":0,"explanation":"Napoleon Bonaparte (1769–1821) rose during the French Revolution, became First Consul (1799) and then Emperor of France (1804). He conquered most of continental Europe, reformed law (Napoleonic Code), education, and administration. Defeated at Waterloo (1815), exiled to Saint Helena. His legal code still influences French, Spanish, and Louisiana law."},
    {"q":"Who was Cleopatra?","type":"mc","options":["The first Roman empress","The last active ruler of the Ptolemaic Kingdom of Egypt","A Greek goddess associated with the Nile","The queen who built the Great Pyramid of Giza"],"answer":1,"explanation":"Cleopatra VII (69–30 BC) was the last active pharaoh of ancient Egypt (Ptolemaic dynasty — Greek origin). She famously allied with Julius Caesar and later Mark Antony. Fluent in nine languages. After Antony and her deaths, Egypt became a Roman province. She's one of history's most written-about rulers, symbolizing political skill, intelligence, and tragic romance."},
    {"q":"The Roman Empire split into Eastern and Western halves in 285 CE.","type":"tf","options":["True","False"],"answer":0,"explanation":"True — Emperor Diocletian divided the Roman Empire administratively in 285 CE for more effective governance. The Western Empire fell in 476 CE (traditionally marking the end of ancient Rome and start of the Middle Ages). The Eastern Empire — the Byzantine Empire — survived until 1453 CE when Constantinople fell to the Ottoman Turks."},
    {"q":"Where was democracy as a governance system first developed?","type":"mc","options":["Rome, Italy","Sparta, Greece","Persia (modern Iran)","Athens, Greece"],"answer":3,"explanation":"Athens, Greece is credited with developing the world's first democracy (~508–507 BC), introduced by Cleisthenes. Citizens (adult male non-slave Athenians) voted directly on laws and policy — direct democracy. However, women, slaves, and foreigners were excluded. The word comes from Greek: demos (people) + kratos (power/rule)."},
    {"q":"In what year was the United Nations founded?","type":"mc","options":["1943","1944","1945","1946"],"answer":2,"explanation":"The United Nations was founded on October 24, 1945, following WWII — replacing the League of Nations (which failed to prevent WWII). The UN Charter was signed in San Francisco. Original members: 51 nations. Today: 193 member states. Six principal organs: General Assembly, Security Council, Secretariat, ICJ, ECOSOC, and Trusteeship Council."},
    {"q":"How many member states does the United Nations have?","type":"mc","options":["168","181","193","212"],"answer":2,"explanation":"The UN has 193 member states as of 2024 — virtually every recognized sovereign country on Earth. Non-member observer states: Vatican City (Holy See) and Palestine. The newest member is South Sudan (2011). The UN headquarters is in New York City, with major offices in Geneva, Vienna, and Nairobi."},
    {"q":"The Internet and the World Wide Web are the same thing.","type":"tf","options":["True","False"],"answer":1,"explanation":"False — they are distinct but related. The Internet is the global physical/digital network infrastructure (cables, routers, protocols). The World Wide Web (WWW) is a service built on top of the Internet — consisting of websites accessed via browsers using HTTP/HTTPS. Tim Berners-Lee invented the Web in 1989–1991; the Internet's origins trace to ARPANET (1969)."},
    {"q":"Mount Fuji last erupted in which century?","type":"mc","options":["16th century (1500s)","17th century (1600s)","18th century (1700s)","19th century (1800s)"],"answer":2,"explanation":"Mount Fuji last erupted in December 1707–January 1708 — the 18th century — in what is known as the Hōei eruption. It deposited ash over Tokyo (then Edo) and is classified as an explosive eruption. Fuji is considered an active volcano; Japanese geologists monitor it continuously. A major eruption today would be catastrophic for the greater Tokyo region."},
    {"q":"Which is the largest animal on Earth?","type":"mc","options":["African elephant","Sperm whale","Saltwater crocodile","Blue whale"],"answer":3,"explanation":"The blue whale (Balaenoptera musculus) is the largest animal known to have ever existed on Earth — reaching up to 30 meters in length and 173 tonnes in weight. Its heart alone weighs ~180 kg. Despite its size, it feeds almost exclusively on tiny krill (~4 tonnes/day). Blue whales were hunted to near extinction; they're now a protected endangered species."},
    {"q":"What is the chemical name for table salt?","type":"mc","options":["Sodium nitrate","Magnesium chloride","Potassium chloride","Sodium chloride"],"answer":3,"explanation":"Table salt is sodium chloride (NaCl) — one sodium ion bonded to one chloride ion in a crystal lattice. Salt was historically so valuable it was used as currency (Latin 'salarium' → English 'salary'). Essential for human nutrition (electrolyte balance, nerve function). The average person needs ~2g/day; most modern diets contain far more."},
    {"q":"Which country has won the FIFA World Cup the most times?","type":"mc","options":["Germany","Argentina","Italy","Brazil"],"answer":3,"explanation":"Brazil has won the FIFA World Cup 5 times (1958, 1962, 1970, 1994, 2002) — more than any other nation. Germany and Italy have 4 titles each; Argentina and France have 3 each. Brazil is the only country to have played in every World Cup. The 2022 World Cup in Qatar saw Argentina win their third title under Lionel Messi."},
    {"q":"The Tour de France is primarily a cycling race through which country?","type":"mc","options":["Italy","Spain","Belgium","France"],"answer":3,"explanation":"The Tour de France is an annual men's cycling race held primarily in France, although stages sometimes pass through neighboring countries. Three weeks long (~3,400 km), it's the world's most prestigious cycling race. The overall leader wears the yellow jersey (maillot jaune). First held in 1903. The Champs-Élysées in Paris is the traditional final stage finish."},
    {"q":"What do the 5 Olympic rings represent?","type":"mc","options":["The 5 original Olympic sports","The 5 ancient Greek city-states","The union of the 5 inhabited continents","The 5 founding nations of the Olympics"],"answer":2,"explanation":"The five interlocking Olympic rings represent the union of the five inhabited continents: Africa, the Americas, Asia, Europe, and Oceania. Designed by Pierre de Coubertin in 1913. The colors (blue, yellow, black, green, red) were chosen because at least one appears in the flag of every competing nation. First used at the 1920 Antwerp Olympics."},
    {"q":"How many squares are on a standard chess board?","type":"mc","options":["48","60","64","81"],"answer":2,"explanation":"A standard chess board has 8×8 = 64 squares, alternating light and dark. However, the total number of squares of ALL sizes (1×1, 2×2, 3×3... 8×8) is 204. Chess originated in India (~6th century AD) as 'chaturanga,' spread to Persia ('shatranj'), and reached Europe via the Islamic world. The modern rules were standardized in Europe in the 15th century."},
    {"q":"How many keys does a standard piano have?","type":"mc","options":["72","76","82","88"],"answer":3,"explanation":"A standard piano has 88 keys: 52 white and 36 black, spanning 7 octaves plus a minor third (from A0 to C8). The piano (originally 'pianoforte') was invented by Bartolomeo Cristofori in Italy around 1700. Unlike the harpsichord, the piano's keys are velocity-sensitive — playing harder produces louder sound, enabling expressive dynamics."},
    {"q":"On which continent is Mount Kilimanjaro located?","type":"mc","options":["Asia","South America","Australia","Africa"],"answer":3,"explanation":"Mount Kilimanjaro (5,895m) is located in Tanzania, Africa — the continent's highest peak and one of the world's Seven Summits. It's a dormant stratovolcano with three distinct volcanic cones: Kibo, Mawenzi, and Shira. Despite being near the equator, its summit is permanently glaciated — though the ice cap has shrunk ~85% since 1912 due to climate change."},
    {"q":"Pluto was reclassified from a planet to a dwarf planet in which year?","type":"mc","options":["2000","2003","2006","2010"],"answer":2,"explanation":"In 2006, the International Astronomical Union (IAU) redefined 'planet,' and Pluto — discovered in 1930 — was reclassified as a 'dwarf planet.' To be a planet, a body must orbit the Sun, have sufficient mass for spherical shape, and clear its orbital neighborhood. Pluto fails the third criterion. The decision was controversial; 'to be Plutoed' briefly became slang for being demoted."},
    {"q":"What is the approximate circumference of the Earth?","type":"mc","options":["20,000 km","30,000 km","40,075 km","50,000 km"],"answer":2,"explanation":"Earth's circumference at the equator is approximately 40,075 km (24,901 miles). Eratosthenes calculated this with remarkable accuracy around 240 BC using shadow angles at different locations. Earth is not a perfect sphere — it bulges slightly at the equator (oblate spheroid), so the polar circumference is slightly smaller at ~40,008 km."},
    {"q":"What is the hardest natural substance on Earth?","type":"mc","options":["Quartz","Topaz","Diamond","Corundum"],"answer":2,"explanation":"Diamond is the hardest natural substance, scoring 10 on the Mohs hardness scale. Made of pure carbon atoms arranged in a crystal lattice, diamond's structure gives it extraordinary hardness. Industrial diamonds are used in cutting, drilling, and grinding tools. The largest gem-quality diamond ever found was the Cullinan (3,106 carats), discovered in South Africa in 1905."},
    {"q":"Which country is home to the most UNESCO World Heritage Sites?","type":"mc","options":["China","Italy","France","Spain"],"answer":1,"explanation":"Italy leads all countries with 58 UNESCO World Heritage Sites (as of 2024), including the Colosseum, Venice, the historic centres of Rome and Florence, Pompeii, and the Amalfi Coast. China is second with 57. Italy's extraordinary density of cultural history — spanning ancient Rome, the Renaissance, and more — makes it the world's richest heritage destination."},
    {"q":"What is the speed of light in a vacuum?","type":"mc","options":["300,000 km/s","150,000 km/s","450,000 km/s","30,000 km/s"],"answer":0,"explanation":"Light travels at approximately 299,792 km/s (commonly rounded to 300,000 km/s) in a vacuum — the universal speed limit, denoted 'c.' Light takes ~8 minutes to travel from the Sun to Earth. Einstein's special relativity is built on the constant speed of light. Nothing with mass can reach this speed; only massless particles (photons, gravitons) travel at c."},
    {"q":"How many bones are in the adult human body?","type":"mc","options":["156","206","256","306"],"answer":1,"explanation":"An adult human body has 206 bones. Babies are born with ~270–300 bones; many fuse as we grow. The femur (thigh bone) is the longest and strongest. The smallest are the ossicles in the ear — malleus, incus, and stapes. The skeleton provides structure, protects organs, produces blood cells (in marrow), and stores minerals like calcium."},
    {"q":"What is the most abundant gas in Earth's atmosphere?","type":"mc","options":["Oxygen","Carbon dioxide","Argon","Nitrogen"],"answer":3,"explanation":"Nitrogen (N₂) makes up ~78% of Earth's atmosphere. Oxygen accounts for ~21%, argon ~0.93%, and CO₂ only ~0.04%. Despite nitrogen's dominance, most living organisms can't use atmospheric nitrogen directly — they rely on nitrogen-fixing bacteria to convert it into usable compounds. This nitrogen cycle is essential for all life on Earth."},
    {"q":"Who wrote 'Romeo and Juliet'?","type":"mc","options":["Christopher Marlowe","John Milton","Geoffrey Chaucer","William Shakespeare"],"answer":3,"explanation":"William Shakespeare wrote Romeo and Juliet around 1594–1596. It's among the most performed plays in history. Shakespeare wrote 37 plays and 154 sonnets. Born in Stratford-upon-Avon (1564), he worked in London's Globe Theatre. His works have been translated into every major language. 'To be or not to be' (Hamlet), 'All the world's a stage' (As You Like It) are his most famous lines."},
    {"q":"What is the chemical symbol for gold?","type":"mc","options":["Go","Gd","Au","Ag"],"answer":2,"explanation":"Gold's symbol is Au, from the Latin 'aurum.' Gold has been valued since ancient times for its rarity, luster, and non-reactivity. It's used in jewelry, electronics (excellent conductor), dentistry, and as a financial reserve. The global above-ground gold stock is ~205,000 tonnes. Fort Knox holds ~4,580 tonnes for the US. The gold standard formally ended in 1971 (Nixon Shock)."},
    {"q":"Which planet is known as the Red Planet?","type":"mc","options":["Jupiter","Venus","Saturn","Mars"],"answer":3,"explanation":"Mars appears red due to iron oxide (rust) on its surface. It's the fourth planet from the Sun and the most Earth-like — similar day length (~24.6 hours), seasons, and polar ice caps. Mars has the solar system's tallest volcano (Olympus Mons, ~22 km) and longest canyon (Valles Marineris). NASA's Perseverance rover has been exploring Mars since 2021."},
    {"q":"What language has the most native speakers in the world?","type":"mc","options":["English","Spanish","Hindi","Mandarin Chinese"],"answer":3,"explanation":"Mandarin Chinese has the most native speakers — approximately 920 million. Spanish is second (~480M), English third (~380M native, but ~1.5B total including second-language speakers). English is the most widely used language globally for business, science, and diplomacy. There are ~7,000 languages worldwide; half are endangered and could disappear this century."},
    {"q":"Who was the first person to walk in space?","type":"mc","options":["Yuri Gagarin","John Glenn","Neil Armstrong","Alexei Leonov"],"answer":3,"explanation":"Soviet cosmonaut Alexei Leonov performed the first spacewalk (EVA — extravehicular activity) on March 18, 1965, during the Voskhod 2 mission. He spent 12 minutes outside, nearly dying when his spacesuit inflated so much he couldn't re-enter the airlock. Yuri Gagarin was the first human in space (1961). The first American spacewalk was by Ed White (1965)."},
    {"q":"What is the longest river in the world?","type":"mc","options":["Amazon","Yangtze","Mississippi","Nile"],"answer":3,"explanation":"The Nile is traditionally considered the world's longest river at ~6,650 km, flowing through 11 countries from Central Africa north to the Mediterranean. However, some measurements give the Amazon a slight edge. The Amazon discharges far more water than the Nile — ~20% of all fresh water flowing into oceans. The Congo is the world's deepest river."},
    {"q":"What does DNA stand for?","type":"mc","options":["Deoxyribonucleic acid","Dinitrogen anhydrous acid","Dynamic neural architecture","Dual-nucleus array"],"answer":0,"explanation":"DNA = Deoxyribonucleic Acid — the molecule carrying genetic instructions in all living organisms. Its double-helix structure was discovered by Watson and Crick in 1953 (building on Rosalind Franklin's X-ray crystallography). DNA contains four bases (A, T, G, C) that pair to encode genes. The human genome has ~3 billion base pairs encoding ~20,000–25,000 genes."},
    {"q":"Which element has the atomic number 1?","type":"mc","options":["Helium","Oxygen","Carbon","Hydrogen"],"answer":3,"explanation":"Hydrogen (H) is element 1 — the lightest and most abundant element in the universe, making up ~75% of all normal matter by mass. Stars like the Sun fuse hydrogen into helium to produce energy. On Earth, hydrogen is mostly found in water (H₂O). Hydrogen fuel cells are a promising clean energy technology. The universe itself is mostly hydrogen and helium."},
    {"q":"What are the primary colors in traditional painting (pigment mixing)?","type":"mc","options":["Red, green, blue","Red, yellow, blue","Cyan, magenta, yellow","Orange, green, purple"],"answer":1,"explanation":"In traditional subtractive color mixing (paints, pigments), the primary colors are red, yellow, and blue — they can't be made by mixing other colors. Mixing them creates secondary colors: red+yellow=orange, yellow+blue=green, blue+red=purple. In light (additive mixing), primaries are red, green, and blue (RGB). Printing uses cyan, magenta, yellow, black (CMYK)."},
    {"q":"Which country invented paper?","type":"mc","options":["Japan","India","Egypt","China"],"answer":3,"explanation":"Paper was invented in China around 105 CE by Cai Lun (a Han dynasty court official), though earlier plant-fiber papers date to the 2nd century BC. The secret spread along the Silk Road — reaching the Middle East by the 8th century and Europe by the 13th century. Before paper, people wrote on bamboo, silk, papyrus, and clay tablets."},
    {"q":"What is the tallest mountain in the world?","type":"mc","options":["K2","Kangchenjunga","Lhotse","Mount Everest"],"answer":3,"explanation":"Mount Everest (8,848.86m) in the Himalayas on the Nepal-Tibet border is Earth's highest peak above sea level. First summited by Edmund Hillary and Tenzing Norgay on May 29, 1953. If measured from Earth's center, Chimborazo (Ecuador) wins due to Earth's equatorial bulge. ~800 people summit Everest annually; over 300 have died attempting it."},
    {"q":"Which animal is the fastest on land?","type":"mc","options":["Lion","Springbok","Pronghorn","Cheetah"],"answer":3,"explanation":"The cheetah (Acinonyx jubatus) is the fastest land animal, reaching speeds of ~112–120 km/h in short bursts. Unlike other big cats, cheetahs can't roar — they chirp and purr. They're built for speed: lightweight frame, large nasal passages, semi-retractable claws for traction. Found mainly in sub-Saharan Africa, cheetahs are classified as vulnerable with ~7,000 left in the wild."},
    {"q":"How many sides does a hexagon have?","type":"mc","options":["5","6","7","8"],"answer":1,"explanation":"A hexagon has 6 sides and 6 angles. Regular hexagons (all sides/angles equal) tile a plane perfectly — that's why honeycombs, snowflakes, and basalt columns are hexagonal. The interior angles of a regular hexagon each measure 120°, and the sum of interior angles is 720°. Other polygons: pentagon (5), heptagon (7), octagon (8), nonagon (9), decagon (10)."},
    {"q":"What year did World War II end?","type":"mc","options":["1943","1944","1945","1946"],"answer":2,"explanation":"World War II ended in 1945 — V-E Day (Victory in Europe) on May 8, 1945, when Germany surrendered; V-J Day (Victory over Japan) on September 2, 1945, after Japan formally surrendered aboard the USS Missouri in Tokyo Bay. The war (1939–1945) was the deadliest in history, killing an estimated 70–85 million people — roughly 3% of the 1940 world population."}
  ]

function loadState() {

// =================== DATE UTILS ===================
function dStr(d = new Date()) {
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function isoWeek(d = new Date()) {
  const dt = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
  dt.setUTCDate(dt.getUTCDate() + 4 - (dt.getUTCDay() || 7));
  const y0 = new Date(Date.UTC(dt.getUTCFullYear(), 0, 1));
  return `${dt.getUTCFullYear()}-W${String(Math.ceil(((dt - y0) / 864e5 + 1) / 7)).padStart(2,'0')}`;
}
function prevWeekday(s) {
  // given 'YYYY-MM-DD', return previous weekday
  const d = new Date(s + 'T12:00:00');
  do { d.setDate(d.getDate() - 1); } while (d.getDay() === 0 || d.getDay() === 6);
  return dStr(d);
}
function isWeekend() { const d = new Date().getDay(); return d === 0 || d === 6; }
function daysSinceEpoch() {
  const t = new Date(); const today = new Date(t.getFullYear(), t.getMonth(), t.getDate());
  const e = new Date(EPOCH.getFullYear(), EPOCH.getMonth(), EPOCH.getDate());
  return Math.floor((today - e) / 864e5);
}

// =================== QUESTION SELECTION ===================
function seededShuffle(arr, seed) {
  const a = [...arr];
  let s = seed | 0;
  for (let i = a.length - 1; i > 0; i--) {
    s = (Math.imul(s, 1664525) + 1013904223) | 0;
    const j = Math.abs(s) % (i + 1);
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
function todayQuestion(cat) {

  S.totalAnswered++;
  if (cat === 'finance')  S.financeAnswered++;
  if (cat === 'japanese_n5') S.japanese_n5Answered++;
  if (cat === 'japanese_n4') S.japanese_n4Answered++;
  if (cat === 'japanese_n3') S.japanese_n3Answered++;
  if (cat === 'trivia')   S.triviaAnswered++;
  if (correct) {
    S.totalPoints += 10; S.correctCount++;
    if (cat === 'finance')  S.financeCorrect++;
    if (cat === 'japanese_n5') S.japanese_n5Correct++;
    if (cat === 'japanese_n4') S.japanese_n4Correct++;
    if (cat === 'japanese_n3') S.japanese_n3Correct++;
    if (cat === 'trivia')   S.triviaCorrect++;
  }

  // Track today's category results
  if (!S.todayAnswered.includes(cat)) S.todayAnswered.push(cat);
  if (correct && !S.todayCorrect.includes(cat)) S.todayCorrect.push(cat);

  // Streak increments only on the FIRST answer of the day
  if (S.lastAnswerDate !== today) {
    if (!pendingSOS) S.streak++;
    S.lastAnswerDate = today;
  }

  // Perfect-day bonus fires exactly when all 3 become correct
  const justPerfect = !S.todayPerfect &&
    S.todayCorrect.includes('finance') && S.todayCorrect.includes('trivia') &&
    ['japanese_n5','japanese_n4','japanese_n3'].some(c => S.todayCorrect.includes(c));
  if (justPerfect) { S.totalPoints += PERFECT_BONUS; S.perfectDays++; S.todayPerfect = true; }

  // Update activity calendar
  if (!S.dayHistory) S.dayHistory = {};
  S.dayHistory[today] = { answered: S.todayAnswered.length, correct: S.todayCorrect.length };

  const newBadges = checkBadges();
  saveState();
  renderResult(q, chosen, correct, justPerfect);
  newBadges.forEach((b, i) => setTimeout(() => showToast(`${b.emoji} New badge unlocked: ${b.name}!`), i * 3400 + 350));
  if (justPerfect) setTimeout(() => showToast('🏆 Perfect Day! +10 bonus pts!'), 400);
}

function dailyProgress() {
  const pending = pendingCats();
  return `<div style="display:flex;gap:.5rem;margin-bottom:1rem">

      const m = CAT_META[c];
      const done    = S.todayAnswered.includes(c);
      const correct = S.todayCorrect.includes(c);
      const isPending = !done && pending.includes(c);
      const bg     = done ? (correct ? '#16a34a22' : '#6b728022') : (isPending ? m.dim : '#1f293744');
      const border = done ? (correct ? '#16a34a88' : '#6b728088') : (isPending ? m.color : '#37415188');
      const ico    = done ? (correct ? '&#10003;' : '&#10007;') : m.emoji;
      const col    = done ? (correct ? '#4ade80' : '#9ca3af') : (isPending ? m.color : '#6b7280');

function statsBar(q) {

  return `<div class="stats-bar">

    <div class="chip">⭐ <strong>${S.totalPoints}</strong> pts</div>

}

function optionsHTML(q, locked, chosenIdx) {
  const keys = q.type === 'tf' ? ['T','F'] : ['A','B','C','D'];
  return q.options.map((opt, i) => {
    let cls = 'opt';
    let handler = '';
    if (locked) {
      if (i === q.answer) cls += ' correct';
      else if (i === chosenIdx) cls += ' wrong';
    } else {
      handler = `onclick="submitAnswer(currentQ,${i})"`;
    }
    return `<button class="${cls}" ${locked ? 'disabled' : ''} ${handler}>
      <span class="opt-key">${keys[i]}</span>${opt}
    </button>`;
  }).join('');
}

function catCard(q, locked, chosenIdx, extra) {
  const m = CAT_META[q.category];
  return `<div class="card" style="border-color:${m.color}44">
    <span class="cat-badge" style="background:${m.dim};color:${m.color}">${m.emoji} ${m.label}</span>
    <div class="question">${q.q}</div>
    <div class="options">${optionsHTML(q, locked, chosenIdx)}</div>

}
