    {"q":"What does 'renraku suru' (連絡する) mean?","type":"mc","options":["To prepare a document","To contact / get in touch","To report to a supervisor","To apologize formally"],"answer":1,"explanation":"'Renraku suru' (連絡する) = to contact or communicate. 連絡 (renraku) = contact/communication. A pillar of Japanese workplace culture: the famous Ho-Ren-So (ホウレンソウ) framework covers 報告 (houkoku, reporting), 連絡 (renraku, sharing updates), and 相談 (soudan, consulting). 'Renraku shimasu' = I'll be in touch. Failing to renraku in a Japanese office is a serious breach of etiquette."},
    {"q":"What does 'yasashii' (優しい) mean?","type":"mc","options":["Strong","Difficult","Kind / Gentle (also: easy)","Busy"],"answer":2,"explanation":"'Yasashii' (優しい) = kind, gentle, tender. A different kanji gives 'yasashii' (易しい) = easy — same pronunciation, different meaning and character. Context determines which is meant. 'Yasashii hito' = a kind person. The ease/kindness homophone is a classic Japanese language puzzle: Japanese is rich in homophones disambiguated by kanji."},
    {"q":"What does 'ii' / 'yoi' (良い / いい) mean?","type":"mc","options":["Bad","Old","New","Good"],"answer":3,"explanation":"'Ii' (いい) or 'yoi' (良い) = good. 'Ii' is the spoken/casual form; 'yoi' the written/formal root. Negatives: 'yoku nai' (not good). Comparative: 'motto ii' (better). 'Ii ne!' (いいね) = That's good! / I like that! — the same phrase Facebook used for the 'Like' button (いいね! in Japanese interface). One of the most frequent Japanese words."},
    {"q":"What does 'warui' (悪い) mean?","type":"mc","options":["Good","Fast","Small","Bad"],"answer":3,"explanation":"'Warui' (悪い) = bad, wrong, or sorry (when taking responsibility). 'Warui ne' can casually mean 'sorry about that.' The kanji 悪 (aku/waru) = evil/bad — appears in 悪人 (akunin, villain), 悪口 (waruguchi, bad-mouthing), and 最悪 (saiaku, the worst). Antonym: 'ii/yoi' (good)."},
    {"q":"What does 'hayai' (速い / 早い) mean?","type":"mc","options":["Slow","Old","Fast / Early","New"],"answer":2,"explanation":"'Hayai' has two kanji: 速い (fast/quick) and 早い (early/soon). Context distinguishes them: 'kuruma ga hayai' = the car is fast (速い); 'hayai asa' = early morning (早い). Antonym of 速い (fast): 'osoi' (slow); antonym of 早い (early): 'osoi' (late). This is another classic Japanese homophone pair that learners must navigate by context."},
    {"q":"What does 'kachō' (課長) mean in a Japanese company?","type":"mc","options":["Department head","Company president","General staff member","Section chief / manager"],"answer":3,"explanation":"Kachō (課長) = section chief or manager — the layer below buchō (department head) and above team leaders. Japanese corporate hierarchy: shachō (CEO/president) → buchō (dept. head) → kachō (section chief) → kakaricho (team leader) → hiraain (general staff). Addressing someone by their title (e.g., 'Yamada-kachō') is standard and respectful in Japanese workplaces."},
    {"q":"What does the Japanese particle 'ni' (に) indicate?","type":"mc","options":["The topic of the sentence","The direct object of a verb","Location/existence, direction of movement, point in time, or indirect object","Contrast between two items"],"answer":2,"explanation":"'Ni' (に) is a multi-purpose particle: location of existence ('Tokyo ni imasu' = I'm in Tokyo), direction ('Osaka ni ikimasu' = going to Osaka), point in time ('goji ni' = at 5 o'clock), and indirect object ('tomodachi ni ageru' = give to a friend). Its versatility makes it one of the most important — and most complex — particles in Japanese grammar."},
    {"q":"What does 'suru' (する) mean?","type":"mc","options":["To eat","To go","To do / to make happen","To return home"],"answer":2,"explanation":"'Suru' (する) = to do — one of Japan's two irregular verbs (the other is 'kuru,' to come). It's the engine of countless compound verbs: benkyou suru (勉強する, to study), shigoto suru (仕事する, to work), denwa suru (電話する, to phone). Polite form: 'shimasu.' Because suru combines with nouns to make verbs, mastering it dramatically expands vocabulary."},
    {"q":"What is the word for 'every day' in Japanese?","type":"mc","options":["Mainichi","毎月 (maitsuki)","Maiasa","Maiban"],"answer":0,"explanation":"'Mainichi' (毎日) = every day. 毎 (mai) = every/each + 日 (nichi/hi) = day. Related: maiasa (毎朝, every morning), maiban (毎晩, every evening), maishuu (毎週, every week), maitsuki (毎月, every month), maitoshi/mainendo (毎年, every year). 'Mainichi nihongo o benkyou shimasu' = I study Japanese every day. Frequently used in scheduling and habits."},
    {"q":"What is the polite way to say 'please' when making a request in Japanese?","type":"mc","options":["Dozo","Onegaishimasu","Kudasai","Both Onegaishimasu and Kudasai are correct depending on context"],"answer":3,"explanation":"Both are correct: 'Kudasai' (ください) follows a verb in te-form ('tabete kudasai' = please eat) or a noun ('mizu o kudasai' = please give me water). 'Onegaishimasu' (おねがいします) makes a broader request or is used more formally ('Yoroshiku onegaishimasu'). 'Dozo' (どうぞ) means 'please, go ahead' — when offering something. Context determines which fits."},
    {"q":"What does 'Ikura desu ka?' (いくらですか？) mean?","type":"mc","options":["Where is it?","How do I get there?","How much does it cost?","What time is it?"],"answer":2,"explanation":"'Ikura desu ka?' literally means 'How much is it?' — one of the most useful shopping phrases. 'Ikura' (いくら) = how much (price). Related: 'Ikutsu desu ka?' (how many?), 'Ikura arimasu ka?' (how much do you have?). In shops, pointing and saying 'Kore wa ikura desu ka?' (How much is this?) always works."},
    {"q":"What does 'Hai, wakarimashita' (はい、わかりました) mean?","type":"mc","options":["Yes, I disagree","Yes, I understand / I understood","Yes, I will try","Yes, please continue"],"answer":1,"explanation":"'Wakarimashita' (わかりました) = 'I understood' (past tense of wakaru, to understand). The full phrase means 'Yes, I understood.' Used to confirm comprehension of instructions. In business, this is critical — saying 'wakarimashita' without understanding can cause problems. If unsure, use 'Mou ichido itte kudasai' (もう一度言ってください — please say it again)."},
    {"q":"What does 'Gochisousama deshita' (ごちそうさまでした) express?","type":"mc","options":["Please bring the check","This food is too spicy","Thank you for the meal — said after eating","I would like to order more food"],"answer":2,"explanation":"'Gochisousama deshita' (ごちそうさまでした) is said after finishing a meal — thanking the host, cook, and everyone involved in providing the food. It pairs with 'Itadakimasu' said before eating. 'Gochisou' literally means 'a feast' — implying the effort involved in preparing food. This ritual acknowledgment of meals reflects deep Japanese gratitude for food and those who prepare it."},
    {"q":"What does 病気 (byouki) mean?","type":"mc","options":["Tired","Sick / illness","Medicine","Hospital"],"answer":1,"explanation":"病気 (byouki) means illness or being sick. 病 means disease and 気 here refers to condition or spirit. Example: 彼は病気です (kare wa byouki desu) — He is sick. Related: 病院 (byouin) = hospital, 薬 (kusuri) = medicine."},
    {"q":"Which word means 'medicine' in Japanese?","type":"mc","options":["熱 (netsu)","病院 (byouin)","薬 (kusuri)","切符 (kippu)"],"answer":2,"explanation":"薬 (kusuri) means medicine or drug. Example: 薬を飲む (kusuri wo nomu) — to take medicine. Related words: 病気 (byouki) = illness, 病院 (byouin) = hospital. In Japanese pharmacies (薬局, yakkyoku), you can purchase over-the-counter medications."},
    {"q":"What does 病院 (byouin) mean?","type":"mc","options":["Pharmacy","Clinic waiting room","Hospital","Doctor"],"answer":2,"explanation":"病院 (byouin) means hospital. 病 (byou) means disease and 院 (in) means institution or hall. Example: 病院に行く (byouin ni iku) — to go to the hospital. Note: 医者 (isha) = doctor, 看護師 (kangoshi) = nurse."},
    {"q":"熱 (netsu) has two common meanings. Which pair is correct?","type":"mc","options":["Cold / ice","Fever / heat","Pain / ache","Tired / exhausted"],"answer":1,"explanation":"熱 (netsu) means fever or heat. Example: 熱がある (netsu ga aru) — to have a fever. 熱い (atsui) = hot (to the touch). This differs from 暑い (atsui) = hot weather and 辛い (karai) = spicy hot. Checking for fever with a thermometer is 体温計 (taionkei)."},
    {"q":"「頭が痛い」(atama ga itai) means:","type":"mc","options":["My stomach hurts","I have a headache","I feel dizzy","I'm tired"],"answer":1,"explanation":"頭が痛い (atama ga itai) literally means 'my head hurts' — a headache. 頭 (atama) = head, 痛い (itai) = painful. Other body pain expressions: お腹が痛い (onaka ga itai) = stomachache, 歯が痛い (ha ga itai) = toothache, 背中が痛い (senaka ga itai) = backache."},
    {"q":"疲れた (tsukareta) expresses:","type":"mc","options":["I am hungry","I am sleepy","I am tired","I am bored"],"answer":2,"explanation":"疲れた (tsukareta) is the past tense of 疲れる (tsukareru) meaning to get tired. As a statement, 疲れた means 'I'm tired.' Example: 今日は疲れた (kyou wa tsukareta) — I'm tired today. The polite workplace expression お疲れ様でした (otsukaresama deshita) comes from this same root."},
    {"q":"Which adjective means 'happy' or 'glad'?","type":"mc","options":["悲しい (kanashii)","寂しい (samishii)","うれしい (ureshii)","怖い (kowai)"],"answer":2,"explanation":"うれしい (ureshii) means happy, glad, or delighted. It describes a feeling of joy in response to something. Example: プレゼントをもらってうれしい (purezento wo moratte ureshii) — I'm happy to receive a gift. Note: 楽しい (tanoshii) = fun/enjoyable (more about an activity), while うれしい focuses on the emotion."},
    {"q":"悲しい (kanashii) means:","type":"mc","options":["Scary","Lonely","Happy","Sad"],"answer":3,"explanation":"悲しい (kanashii) means sad or sorrowful. Example: 悲しいニュース (kanashii nyuusu) — sad news. 悲 is the kanji for grief/sorrow. Related emotional adjectives: うれしい (ureshii) = happy, 寂しい (samishii) = lonely, 怖い (kowai) = scary."},
    {"q":"What does 怖い (kowai) mean?","type":"mc","options":["Difficult","Scary / frightened","Painful","Embarrassing"],"answer":1,"explanation":"怖い (kowai) means scary or frightening, and also describes the feeling of being afraid. Example: 怖い映画 (kowai eiga) — a scary movie. 幽霊が怖い (yuurei ga kowai) — I'm scared of ghosts. Related: 恐ろしい (osoroshii) = terrifying (stronger nuance), 心配 (shinpai) = worried."},
    {"q":"寂しい (samishii) / 寂しい (sabishii) means:","type":"mc","options":["Busy","Lonely","Boring","Jealous"],"answer":1,"explanation":"寂しい (samishii or sabishii — both pronunciations are correct) means lonely or lonesome. Example: 一人で寂しい (hitori de samishii) — lonely by myself. This is a common feeling described in Japanese songs and literature. Related: 孤独 (kodoku) = solitude/isolation (more formal)."},
    {"q":"暇 (hima) refers to:","type":"mc","options":["Homework","Free time / not being busy","Emergency","Vacation abroad"],"answer":1,"explanation":"暇 (hima) means free time or not being busy. 暇がある (hima ga aru) = to have free time. Example: 今日は暇です (kyou wa hima desu) — I'm free today. Note that calling someone 暇人 (himajin) = 'person with free time' can sound like an insult (implying they have nothing important to do)."},
    {"q":"大切 (taisetsu) means:","type":"mc","options":["Convenient","Important / precious","Difficult","Dangerous"],"answer":1,"explanation":"大切 (taisetsu) means important or precious. It carries an emotional weight of cherishing something or someone. Example: 家族は大切です (kazoku wa taisetsu desu) — Family is precious. Similar: 重要 (juuyou) = important (more formal/objective), 大事 (daiji) = important (casual synonym for 大切)."},
    {"q":"Which word means 'convenient'?","type":"mc","options":["不便 (fuben)","大切 (taisetsu)","便利 (benri)","暇 (hima)"],"answer":2,"explanation":"便利 (benri) means convenient or handy. 便 means convenience and 利 means profit/benefit. Example: このアプリは便利です (kono apuri wa benri desu) — This app is convenient. The opposite is 不便 (fuben) = inconvenient. Japan is famous for 便利な (benri na) konbini (convenience stores)."},
    {"q":"不便 (fuben) means the opposite of convenient. What is it?","type":"mc","options":["Very convenient","Somewhat convenient","Inconvenient","Unnecessary"],"answer":2,"explanation":"不便 (fuben) means inconvenient. 不 (fu) is a negative prefix meaning 'not' or 'un-'. Example: この場所は不便です (kono basho wa fuben desu) — This place is inconvenient. Other 不 words: 不安 (fuan) = uneasy, 不満 (fuman) = dissatisfied, 不可能 (fukanou) = impossible."},
    {"q":"急ぐ (isogu) means:","type":"mc","options":["To rest","To hurry","To decide","To continue"],"answer":1,"explanation":"急ぐ (isogu) means to hurry or to rush. Example: 急いで！(isoide!) — Hurry up! This is a Group 1 (godan) verb. 急 also appears in 急行 (kyuukou) = express train, 緊急 (kinkyuu) = emergency, 急に (kyuu ni) = suddenly."},
    {"q":"決める (kimeru) means:","type":"mc","options":["To find","To compare","To decide","To collect"],"answer":2,"explanation":"決める (kimeru) means to decide or to determine. It is a Group 2 (ichidan) verb. Example: 何を食べるか決める (nani wo taberu ka kimeru) — to decide what to eat. The intransitive form is 決まる (kimaru) = to be decided. Related: 決定 (kettei) = decision (noun)."},
    {"q":"伝える (tsutaeru) means:","type":"mc","options":["To receive","To convey / tell","To investigate","To continue"],"answer":1,"explanation":"伝える (tsutaeru) means to convey, tell, or communicate a message to someone. Example: 彼に伝えてください (kare ni tsutaete kudasai) — Please tell him. Related: 伝言 (dengon) = message, 言い伝え (iitsutae) = legend/oral tradition. Often used in business: 「よろしくお伝えください」= Please give them my regards."},
    {"q":"続ける (tsuzukeru) means:","type":"mc","options":["To start","To stop","To continue","To hurry"],"answer":2,"explanation":"続ける (tsuzukeru) means to continue or keep doing something. Example: 勉強を続ける (benkyou wo tsuzukeru) — to continue studying. The intransitive form is 続く (tsuzuku) = to continue (on its own). 続 appears in: 連続 (renzoku) = consecutive, 持続 (jizoku) = sustaining."},
    {"q":"集める (atsumeru) means:","type":"mc","options":["To send","To find","To help","To collect / gather"],"answer":3,"explanation":"集める (atsumeru) means to collect, gather, or assemble things. Example: 切手を集める (kitte wo atsumeru) — to collect stamps. The intransitive form is 集まる (atsumaru) = to gather (people gather). 集合 (shuugou) = assembly/meeting point."},
    {"q":"手伝う (tetsudau) means:","type":"mc","options":["To investigate","To help / assist","To meet","To compare"],"answer":1,"explanation":"手伝う (tetsudau) means to help or assist someone. Example: 引っ越しを手伝う (hikkoshi wo tetsudau) — to help with moving. 手伝い (tetsudai) as a noun means help or assistant. Note: 手 (te) = hand, 伝 (tsutau) = to transmit — originally 'to lend a hand.'"},
    {"q":"調べる (shiraberu) means:","type":"mc","options":["To compare","To decide","To investigate / look up","To continue"],"answer":2,"explanation":"調べる (shiraberu) means to investigate, check, or look something up. Example: 辞書で調べる (jisho de shiraberu) — to look it up in a dictionary. インターネットで調べる (intaanetto de shiraberu) — to look it up online. Related: 調査 (chousa) = investigation/survey."},
    {"q":"見つける (mitsukeru) means:","type":"mc","options":["To look at","To find","To see","To watch"],"answer":1,"explanation":"見つける (mitsukeru) means to find or discover something. Example: 鍵を見つけた (kagi wo mitsuketa) — I found the key. The intransitive form is 見つかる (mitsukaru) = to be found. 見 (mi) relates to seeing/finding, and 付ける (tsukeru) means to attach — so 'to attach one's gaze on.'"},
    {"q":"比べる (kuraberu) means:","type":"mc","options":["To receive","To compare","To send","To meet"],"answer":1,"explanation":"比べる (kuraberu) means to compare. Example: 値段を比べる (nedan wo kuraberu) — to compare prices. 比べて (kurabete) = compared to. Example: 去年と比べて (kyonen to kurabete) — compared to last year. Related: 比較 (hikaku) = comparison (more formal/written form)."},
    {"q":"会う (au) in the context of people means:","type":"mc","options":["To call someone","To meet someone","To know someone","To miss someone"],"answer":1,"explanation":"会う (au) means to meet or see someone. Example: 友達に会う (tomodachi ni au) — to meet a friend. Note the particle に (ni) is used with 会う. 会う is a Group 1 verb. Related: 会議 (kaigi) = meeting, 再会 (saikai) = reunion. Different from 合う (au) = to match/fit."},
    {"q":"送る (okuru) has two related meanings. Which pair is correct?","type":"mc","options":["To receive / to take","To send / to see someone off","To find / to meet","To collect / to compare"],"answer":1,"explanation":"送る (okuru) means both to send (a letter, package, email) and to see someone off or escort them. Example: メールを送る (meeru wo okuru) — to send an email. 駅まで送る (eki made okuru) — to see (someone) off to the station. Related: 送別会 (soubetsukai) = farewell party."},
    {"q":"受ける (ukeru) in the context of exams means:","type":"mc","options":["To pass an exam","To fail an exam","To take / sit for an exam","To study for an exam"],"answer":2,"explanation":"受ける (ukeru) means to receive or to take/sit for something. In the exam context: 試験を受ける (shiken wo ukeru) — to take an exam. Also: 注文を受ける (chuumon wo ukeru) = to receive an order. Related: 受付 (uketsuke) = reception desk, 受験 (juken) = taking an entrance exam."},
    {"q":"新幹線 (Shinkansen) is best described as:","type":"mc","options":["A local commuter train","The bullet train / high-speed rail","A subway line","An international express train"],"answer":1,"explanation":"新幹線 (Shinkansen) literally means 'new trunk line' — it is Japan's famous bullet train network. 新 (shin) = new, 幹線 (kansen) = trunk/main line. Launched in 1964 for the Tokyo Olympics, it connects major cities at speeds over 300 km/h. Types include のぞみ (Nozomi), ひかり (Hikari), and こだま (Kodama)."},
    {"q":"地下鉄 (chikatetsu) means:","type":"mc","options":["Bullet train","Elevated railway","Subway / underground train","Monorail"],"answer":2,"explanation":"地下鉄 (chikatetsu) means subway or underground train. 地下 (chika) = underground, 鉄 (tetsu) = iron/railway. Tokyo's subway system is one of the world's most extensive. Compare: 電車 (densha) = train (general), 新幹線 (Shinkansen) = bullet train, 路面電車 (romen densha) = tram."},
    {"q":"飛行機 (hikouki) means:","type":"mc","options":["Helicopter","Airplane","Spaceship","Bullet train"],"answer":1,"explanation":"飛行機 (hikouki) means airplane. 飛行 (hikou) = flight (飛 = fly, 行 = go) and 機 (ki) = machine. Example: 飛行機で旅行する (hikouki de ryokou suru) — to travel by airplane. Related: 空港 (kuukou) = airport, 搭乗 (toujou) = boarding, パイロット (pairotto) = pilot."},
    {"q":"切符 (kippu) means:","type":"mc","options":["Timetable","Platform","Ticket","Station"],"answer":2,"explanation":"切符 (kippu) means ticket, particularly for trains and other transport. Example: 切符を買う (kippu wo kau) — to buy a ticket. 片道切符 (katamichi kippu) = one-way ticket, 往復切符 (oufuku kippu) = round-trip ticket. In modern Japan, IC cards like Suica have largely replaced paper 切符 for daily commuting."},
    {"q":"予定 (yotei) means:","type":"mc","options":["Reservation","Schedule / plan","Meeting","Preparation"],"answer":1,"explanation":"予定 (yotei) means schedule, plan, or something that is planned/scheduled. Example: 今週の予定 (konshuu no yotei) — this week's schedule. 予定がある (yotei ga aru) = to have plans. Related: 予約 (yoyaku) = reservation, 計画 (keikaku) = plan/project, 予想 (yosou) = prediction."},
    {"q":"Which word means 'last week'?","type":"mc","options":["来週 (raishuu)","今週 (konshuu)","先週 (senshuu)","再来週 (saraishuu)"],"answer":2,"explanation":"先週 (senshuu) means last week. 先 (sen) means previous/before. The pattern: 先週 (senshuu) = last week, 今週 (konshuu) = this week, 来週 (raishuu) = next week, 再来週 (saraishuu) = the week after next. The same pattern applies to months: 先月, 今月, 来月."},
    {"q":"来週 (raishuu) means:","type":"mc","options":["Last week","This week","Next week","Every week"],"answer":2,"explanation":"来週 (raishuu) means next week. 来 (rai) means coming/next. Example: 来週の月曜日 (raishuu no getsuyoubi) — next Monday. Time word pattern: 先週 = last week, 今週 = this week, 来週 = next week. The same 来 prefix works for: 来月 (raigetsu) = next month, 来年 (rainen) = next year."},
    {"q":"今年 (kotoshi) means:","type":"mc","options":["Last year","Next year","Every year","This year"],"answer":3,"explanation":"今年 (kotoshi) means this year. 今 (ima/ko) = now/current, 年 (toshi/nen) = year. Note the irregular reading — it's 'kotoshi' not 'imatoshi.' Example: 今年の目標 (kotoshi no mokuhyou) — this year's goal. Year pattern: 去年 (kyonen) = last year, 今年 (kotoshi) = this year, 来年 (rainen) = next year."},
    {"q":"去年 (kyonen) means:","type":"mc","options":["This year","Next year","Last year","Two years ago"],"answer":2,"explanation":"去年 (kyonen) means last year. 去 (kyo) = to go/past. Example: 去年の夏 (kyonen no natsu) — last summer. Note: an alternative form 昨年 (sakunen) is more formal. Year timeline: 一昨年 (ototoshi) = year before last, 去年 (kyonen) = last year, 今年 (kotoshi) = this year, 来年 (rainen) = next year."},
    {"q":"会議 (kaigi) in a Japanese office context means:","type":"mc","options":["Business trip","Overtime","Meeting","Day off"],"answer":2,"explanation":"会議 (kaigi) means a meeting or conference. 会 (kai) = gathering, 議 (gi) = discussion. Example: 午後に会議があります (gogo ni kaigi ga arimasu) — There's a meeting in the afternoon. Related: 会議室 (kaigishitsu) = meeting room, 議題 (gidai) = agenda, 打ち合わせ (uchiawase) = informal meeting/briefing."},
    {"q":"出張 (shucchou) means:","type":"mc","options":["Overtime work","Business trip","Annual leave","Company outing"],"answer":1,"explanation":"出張 (shucchou) means a business trip. 出 (shutsu) = go out, 張 (chou) = to stretch/extend. Example: 来週、大阪に出張します (raishuu, Osaka ni shucchou shimasu) — I'm going on a business trip to Osaka next week. Related: 国内出張 (kokunai shucchou) = domestic business trip, 海外出張 (kaigai shucchou) = overseas business trip."},
    {"q":"残業 (zangyou) refers to:","type":"mc","options":["A company holiday","Overtime work","A business trip","A lunch break"],"answer":1,"explanation":"残業 (zangyou) means overtime work — working beyond regular hours. 残 (zan) = remaining, 業 (gyou) = work/business. Example: 今日も残業です (kyou mo zangyou desu) — I have overtime again today. Japan's overtime culture is well-known; 過労死 (karoushi) = death from overwork is a serious social issue. Related: 残業代 (zangyoudai) = overtime pay."},
    {"q":"休日 (kyuujitsu) means:","type":"mc","options":["Morning shift","Sick leave","Day off / holiday","Lunch break"],"answer":2,"explanation":"休日 (kyuujitsu) means a day off or holiday. 休 (kyuu) = rest, 日 (jitsu/hi) = day. Example: 休日は何をしますか (kyuujitsu wa nani wo shimasu ka) — What do you do on your days off? Related: 祝日 (shukujitsu) = national holiday, 有給休暇 (yuukyuu kyuuka) = paid leave, 週末 (shuumatsu) = weekend."},
    {"q":"準備 (junbi) means:","type":"mc","options":["Explanation","Preparation","Schedule","Direction"],"answer":1,"explanation":"準備 (junbi) means preparation or getting ready. Example: 準備ができた (junbi ga dekita) — I'm ready / preparations are complete. 準備する (junbi suru) = to prepare. Related: 準備物 (junbibutsu) = things needed/materials, 事前準備 (jizen junbi) = advance preparation. Often heard before presentations or events."},
    {"q":"説明 (setsumei) means:","type":"mc","options":["Meaning","Reason","Explanation","Direction"],"answer":2,"explanation":"説明 (setsumei) means explanation or description. 説 (setsu) = explain/theory, 明 (mei) = clear/bright. Example: 説明してください (setsumei shite kudasai) — Please explain. 説明書 (setsumei-sho) = instruction manual/manual. Related: 解説 (kaisetsu) = commentary/explanation (more detailed), 説明会 (setsumei-kai) = information session."},
    {"q":"意味 (imi) means:","type":"mc","options":["Reason","Explanation","Place","Meaning"],"answer":3,"explanation":"意味 (imi) means meaning or significance. Example: この言葉はどんな意味ですか (kono kotoba wa donna imi desu ka) — What does this word mean? 意味がある (imi ga aru) = meaningful, 意味がない (imi ga nai) = meaningless. At the JLPT, knowing 意味 is essential for questions about word definitions."},
    {"q":"場所 (basho) means:","type":"mc","options":["Time","Reason","Place / location","Direction"],"answer":2,"explanation":"場所 (basho) means place or location. 場 (ba) = place/field, 所 (sho) = place. Example: 待ち合わせの場所 (machiawase no basho) — meeting place. In sumo, 場所 (basho) also refers to a tournament. Related: 住所 (juusho) = address, 近所 (kinjo) = neighborhood, 名所 (meisho) = famous place."},
    {"q":"理由 (riyuu) means:","type":"mc","options":["Meaning","Place","Schedule","Reason"],"answer":3,"explanation":"理由 (riyuu) means reason or cause. 理 (ri) = reason/logic, 由 (yuu) = origin/reason. Example: 理由を教えてください (riyuu wo oshiete kudasai) — Please tell me the reason. Related: 原因 (genin) = cause (of a problem), 目的 (mokuteki) = purpose, わけ (wake) = reason (colloquial)."},
    {"q":"食堂 (shokudou) refers to:","type":"mc","options":["Supermarket","Restaurant district","Cafeteria / dining hall","Kitchen"],"answer":2,"explanation":"食堂 (shokudou) means cafeteria or dining hall, often found in offices, schools, and hospitals serving affordable meals. 食 (shoku) = food/eat, 堂 (dou) = hall. Example: 会社の食堂で昼ごはんを食べる (kaisha no shokudou de hirugohan wo taberu) — to eat lunch at the company cafeteria. Also used for small informal restaurants."},
    {"q":"郵便局 (yuubinkyoku) means:","type":"mc","options":["Bank","Post office","City hall","Police station"],"answer":1,"explanation":"郵便局 (yuubinkyoku) means post office. 郵便 (yuubin) = mail/post, 局 (kyoku) = bureau/office. Example: 郵便局で切手を買う (yuubinkyoku de kitte wo kau) — to buy stamps at the post office. Japan Post (日本郵便, Nihon Yuubin) also offers banking and insurance services. Related: 郵便番号 (yuubin bangou) = postal code."},
    {"q":"銀行 (ginkou) means:","type":"mc","options":["Post office","Department store","Bank","Library"],"answer":2,"explanation":"銀行 (ginkou) means bank. 銀 (gin) = silver, 行 (kou) = go/row. Example: 銀行口座を開く (ginkou kouza wo hiraku) — to open a bank account. Major Japanese banks include 三菱UFJ銀行 and みずほ銀行. Related: 両替 (ryougae) = currency exchange, ATM (エーティーエム)."},
    {"q":"What is おでん (oden)?","type":"mc","options":["Grilled rice balls","A type of sushi","Japanese hotpot with various ingredients in broth","Buckwheat noodles"],"answer":2,"explanation":"おでん (oden) is a popular Japanese hotpot dish featuring ingredients like daikon radish (大根), boiled eggs (ゆで卵), fish cake (はんぺん), and konjac (こんにゃく) simmered in a light dashi-soy broth. It's especially popular in winter and commonly sold at convenience stores and street stalls. A beloved comfort food in Japan."},
    {"q":"焼き鳥 (yakitori) refers to:","type":"mc","options":["Fried chicken","Grilled chicken skewers","Chicken ramen","Chicken tempura"],"answer":1,"explanation":"焼き鳥 (yakitori) are grilled chicken skewers, a popular Japanese street food and izakaya (居酒屋) staple. 焼き (yaki) = grilled, 鳥 (tori) = bird/chicken. Common varieties include もも (thigh), むね (breast), ねぎま (chicken and green onion), and つくね (chicken meatball). Served with either 塩 (shio/salt) or たれ (tare/sweet soy sauce)."},
    {"q":"Which grammar pattern means 'it is okay to' or 'you may'?","type":"mc","options":["~なければならない","~ほうがいい","~てもいい","~ことができる"],"answer":2,"explanation":"~てもいい (te mo ii) is used to express permission or that something is acceptable. Example: ここで写真を撮ってもいいですか (koko de shashin wo totte mo ii desu ka) — May I take photos here? To ask permission, use the question form. To deny permission: ~てはいけない (te wa ikenai) = must not. This is a key N4 grammar pattern."},
    {"q":"「毎日運動しなければなりません」means:","type":"mc","options":["I want to exercise every day","I exercise every day","I must exercise every day","I don't need to exercise every day"],"answer":2,"explanation":"~なければならない (nakereba naranai) means 'must' or 'have to.' 毎日運動しなければなりません (mainichi undou shinakereba narimasen) = I must exercise every day. The casual form is ~なきゃ (nakya). Example: もう行かなきゃ (mou ikanakya) — I have to go now. This expresses obligation."},
    {"q":"~ほうがいい (hou ga ii) is used to express:","type":"mc","options":["Ability to do something","An ongoing action","A recommendation / had better","Permission to do something"],"answer":2,"explanation":"~ほうがいい (hou ga ii) means 'it would be better to' or 'you had better.' Used to give advice. Example: 早く寝たほうがいい (hayaku neta hou ga ii) — You'd better go to bed early. Use past tense verb + ほうがいい for positive advice. Negative advice: ~ないほうがいい (nai hou ga ii) — it's better not to."},
    {"q":"In the sentence 「音楽を聴きながら勉強します」, what does ~ながら (nagara) indicate?","type":"mc","options":["Doing something after another action","Doing two things simultaneously","Doing something in order to achieve a goal","A conditional situation"],"answer":1,"explanation":"~ながら (nagara) means 'while doing' — two actions happening at the same time, performed by the same subject. 音楽を聴きながら勉強します (ongaku wo kikinagara benkyou shimasu) = I study while listening to music. The main action comes after ながら. Note: the subject must be the same for both actions."},
    {"q":"「日本語を勉強するために、日本に来ました」— what does ~ために (tame ni) express?","type":"mc","options":["A reason for a past event","A condition","In order to / for the purpose of","An ongoing action"],"answer":2,"explanation":"~ために (tame ni) expresses purpose: 'in order to' or 'for the sake of.' 日本語を勉強するために、日本に来ました (Nihongo wo benkyou suru tame ni, Nihon ni kimashita) = I came to Japan in order to study Japanese. Use dictionary form + ために for purpose. Related: ~のために (no tame ni) can also mean 'for the benefit of' someone."},
    {"q":"「ピアノを弾くことができます」means:","type":"mc","options":["I want to play the piano","I used to play the piano","I am playing the piano","I can play the piano"],"answer":3,"explanation":"~ことができる (koto ga dekiru) means 'to be able to' or 'can.' ピアノを弾くことができます (piano wo hiku koto ga dekimasu) = I can play the piano. The potential form is another way to express ability (e.g., 弾ける = can play), but ことができる is more formal and commonly tested on JLPT N4."},
    {"q":"In 「友達が手伝ってくれました」, what does ~てくれる (te kureru) indicate?","type":"mc","options":["I did something for my friend","My friend did something for me (from my perspective)","My friend asked me to do something","I received something from my friend"],"answer":1,"explanation":"~てくれる (te kureru) means someone does something for me (or for someone in my in-group), viewed as a favor. 友達が手伝ってくれました (tomodachi ga tetsudatte kuremashita) = My friend helped me (and I appreciate it). Compare: ~てあげる = I do something for someone else, ~てもらう = I receive the action/have someone do it for me."}
  ],
  "japanese_n3": [
    {"q":"What is 'Nemawashi' (根回し) in a business context?","type":"mc","options":["A traditional harvest ceremony","Building consensus by consulting stakeholders before a formal meeting","A type of Japanese flower arrangement","An accounting audit process"],"answer":1,"explanation":"'Nemawashi' literally means 'going around the roots' (a gardening term). In business, it refers to the Japanese practice of informally gaining buy-in from key people before a formal proposal — so the meeting itself is a formality, not a debate. Essential to Japanese decision-making culture."},
    {"q":"What is 'ringi' (稟議) in Japanese business culture?","type":"mc","options":["A formal written budget request","A decision-making process where a proposal circulates for sequential approval by all relevant stakeholders","A quarterly performance review","A meeting format where the most senior person speaks last"],"answer":1,"explanation":"Ringi is Japan's circular approval system: a proposal document (ringi-sho) passes through all relevant managers for hanko (stamp) approval, bottom-up. It ensures consensus and distributes responsibility before formal announcement. Decisions take longer but implementation is faster since everyone has already bought in. Related to 'nemawashi' (informal pre-alignment)."},
    {"q":"What does 'Wa' (和) represent as a Japanese cultural value?","type":"mc","options":["Individual achievement above all else","Harmony — prioritizing group cohesion and avoiding conflict","Strict adherence to hierarchy","Competitive spirit and excellence"],"answer":1,"explanation":"'Wa' (和) means harmony and is a foundational Japanese social value — maintaining group cohesion, avoiding direct confrontation, and preserving relationships. The kanji 和 appears in the word for Japan itself (Yamato/大和). In business, 'wa' explains the preference for consensus (nemawashi, ringi) over individual decision-making."},
    {"q":"What was a 'Shogun' (将軍) in Japanese history?","type":"mc","options":["A Buddhist temple head priest","The military dictator who held real power while the Emperor was ceremonial","Japan's highest-ranking samurai warrior","A nobleman controlling regional trade routes"],"answer":1,"explanation":"A Shogun was the supreme military commander who effectively ruled Japan while the Emperor held ceremonial status. The Tokugawa Shogunate (1603–1868) controlled Japan for 265 years, isolating it from the world (sakoku). 'Shogun' = general who subdues barbarians. The last shogunate ended with the Meiji Restoration in 1868."},
    {"q":"What is a 'Samurai' (侍) in Japanese history?","type":"mc","options":["A merchant class in feudal Japan","A member of the hereditary military nobility who followed Bushido","A government tax collector","A wandering Buddhist monk"],"answer":1,"explanation":"Samurai were the warrior-noble class of feudal Japan (roughly 10th–19th century). They followed Bushido (way of the warrior) — a code of honor, loyalty, and martial discipline. Samurai served lords (daimyo) and carried two swords (katana and wakizashi). The class was abolished in the Meiji Restoration (1868)."},
    {"q":"What is Zen Buddhism?","type":"mc","options":["A form of Japanese Shinto ritual","A school of Mahayana Buddhism emphasizing meditation and direct experience over textual study","A Japanese martial art focused on sword technique","A philosophical system focused on material success"],"answer":1,"explanation":"Zen is a school of Mahayana Buddhism that reached Japan from China via Korea (~12th century). It emphasizes zazen (seated meditation), koan practice (paradoxical questions), and direct insight. Deeply influenced Japanese art, architecture, tea ceremony, martial arts, and aesthetics (wabi-sabi). Many Japanese maintain both Buddhist and Shinto practices."},
    {"q":"What is Ikebana (生け花)?","type":"mc","options":["Japanese traditional painting","The art of Japanese flower arrangement","A style of Japanese poetry with seasonal themes","A form of Japanese calligraphy"],"answer":1,"explanation":"Ikebana (生 = life, 花 = flower) is the Japanese art of flower arrangement. Unlike Western bouquets that fill space densely, ikebana uses negative space intentionally — each stem, leaf, and flower placed with meaning. The three main lines represent heaven, earth, and humanity. Established schools include Ikenobo, Ohara, and Sogetsu."},
    {"q":"What is Shodō (書道)?","type":"mc","options":["Japanese ceremonial tea preparation","The art of Japanese calligraphy — writing kanji with ink and brush","Traditional Japanese sword-making","A form of Japanese woodblock printing"],"answer":1,"explanation":"Shodō (書 = writing, 道 = way/path) is the art of Japanese calligraphy. Using brush and ink, practitioners write kanji or kana with controlled strokes, varying pressure, speed, and ink volume to create expressive characters. Like ikebana and chado (tea), it's considered both a discipline and an art form, taught in Japanese schools."},
    {"q":"What is Sumo (相撲)?","type":"mc","options":["A Japanese sword-fighting martial art","Japan's national sport — a form of wrestling where the goal is to push the opponent out of the ring","A traditional Japanese archery discipline","A ceremonial Japanese dance performed at shrines"],"answer":1,"explanation":"Sumo is Japan's ancient national sport — two rikishi (wrestlers) in a clay ring (dohyo) try to push each other out or force any body part other than feet to touch the ground. Deeply ritualistic: Shinto influences, salt purification, stamping. Six grand tournaments annually. Yokozuna = highest-ranked wrestler."},
    {"q":"What is Judo (柔道)?","type":"mc","options":["A Japanese archery discipline","A Japanese martial art using throws, takedowns, and grappling — now an Olympic sport","A traditional Japanese fencing style using bamboo swords","A Japanese wrestling style practiced only by samurai"],"answer":1,"explanation":"Judo (柔 = gentle, 道 = way) was founded by Jigoro Kano in 1882. It focuses on throws (nage-waza) and ground techniques (ne-waza), using the opponent's force against them. The first Asian Olympic sport (1964 Tokyo). Judo influenced BJJ (Brazilian Jiu-Jitsu) — Kano's students spread it to Brazil in the 1910s."},
    {"q":"What is Kendō (剣道)?","type":"mc","options":["The way of the arrow — traditional Japanese archery","The way of the sword — a Japanese martial art using bamboo swords (shinai)","A form of Japanese kickboxing","Japanese ceremonial sword-drawing technique"],"answer":1,"explanation":"Kendo (剣 = sword, 道 = way) is the modern martial art of Japanese swordsmanship. Practitioners (kenshi) wear protective armor (bogu) and use bamboo swords (shinai). Targets are men (head), kote (wrist), do (torso), and tsuki (throat). Rooted in samurai swordsmanship (kenjutsu), it emphasizes discipline, respect, and character development."},
    {"q":"What is 'Matsuri' (祭り)?","type":"mc","options":["A Japanese tea ceremony","A traditional Japanese festival — often tied to Shinto shrines or Buddhist temples","A formal Japanese business dinner","A seasonal Japanese art exhibition"],"answer":1,"explanation":"Matsuri means festival. Japan has thousands of matsuri throughout the year — celebrating harvests, seasonal changes, or shrine deities. Famous ones: Gion Matsuri (Kyoto, July), Awa Odori (Tokushima, August), Sapporo Snow Festival (February). Features: mikoshi (portable shrines), traditional music, food stalls (yatai), yukata (summer kimono)."},
    {"q":"What is 'Obon' (お盆) in Japan?","type":"mc","options":["Japan's largest summer music festival","A Buddhist tradition honoring deceased ancestors' spirits, typically in mid-August","A spring rice-planting festival","A government-mandated national holiday in January"],"answer":1,"explanation":"Obon is a Japanese Buddhist observance (mid-August) welcoming the spirits of deceased ancestors home. Families return to hometowns, clean graves, and perform Bon Odori (traditional dances). Many businesses close. Similar to Mexico's Day of the Dead in spirit — honoring the dead with joy rather than grief. One of Japan's most important cultural events."},
    {"q":"What is 'Shōgatsu' (正月) in Japan?","type":"mc","options":["Japan's summer festival season","Japanese New Year — the most important holiday of the year, celebrated January 1–3","A spring cherry blossom celebration","A traditional autumn harvest ceremony"],"answer":1,"explanation":"Shōgatsu (New Year) is Japan's most significant holiday. Families gather, send nengajo (New Year postcards), visit shrines (hatsumode), eat osechi (special foods), and receive otoshidama (money gifts in envelopes, for children). Most businesses close Dec 28 – Jan 3. The NHK broadcast of temple bells (joya-no-kane, 108 rings) marks midnight."},
    {"q":"What is 'Setsubun' (節分)?","type":"mc","options":["Japan's winter solstice festival","A seasonal holiday (Feb 3) marking the start of spring — demons are driven away by throwing beans","A harvest festival in October","Japan's national sports day"],"answer":1,"explanation":"Setsubun (February 3) marks the day before spring begins in the old calendar. The key tradition: mamemaki — throwing roasted soybeans while shouting 'Oni wa soto! Fuku wa uchi!' (Out with demons! In with luck!). People also eat ehomaki (lucky-direction sushi rolls) whole in silence. Now a popular commercial event in Japan."},
    {"q":"What is 'Tanabata' (七夕)?","type":"mc","options":["A Buddhist ceremony for deceased ancestors","The Star Festival — celebrating the legend of two stars (lovers) meeting once a year across the Milky Way","Japan's fireworks festival season","A harvest moon viewing ceremony"],"answer":1,"explanation":"Tanabata (July 7) celebrates the legend of Orihime (Vega) and Hikoboshi (Altair) — lovers separated by the Milky Way who can only meet once a year. People write wishes on tanzaku (colored strips) tied to bamboo. The Sendai Tanabata (August) is Japan's largest. Chinese origin, brought to Japan in the Nara period."},
    {"q":"What is 'wasabi' (わさび)?","type":"mc","options":["A Japanese pickled plum condiment","A pungent green Japanese condiment from wasabi root — served with sushi and sashimi","A Japanese fermented soybean paste","A sweet Japanese red bean paste"],"answer":1,"explanation":"Wasabi is a pungent green condiment made from grating the wasabi plant's rhizome (Eutrema japonicum). Its heat is volatile — it hits the sinuses, not the tongue, and fades in seconds. Real wasabi is expensive and rare; most 'wasabi' outside Japan is colored horseradish. Essential accompaniment to sushi and sashimi."},
    {"q":"What is 'sashimi' (刺身)?","type":"mc","options":["Raw fish or meat sliced thin and served without rice","Deep-fried seafood served with dipping sauce","Fish grilled with teriyaki sauce","A type of Japanese seafood soup"],"answer":0,"explanation":"Sashimi is fresh raw fish or meat sliced thin and served with soy sauce and wasabi — no rice (that's sushi). Common varieties: maguro (tuna), salmon, hamachi (yellowtail), tako (octopus), hotate (scallop). The quality of sashimi depends entirely on freshness. In Japan, fish is often killed via ikejime — a precise technique for maximum freshness."},
    {"q":"What is 'tempura' (天ぷら)?","type":"mc","options":["Japanese-style grilled skewers","Light-battered, deep-fried seafood or vegetables — introduced by Portuguese missionaries in the 16th century","A type of Japanese noodle soup","Stewed Japanese vegetables in dashi broth"],"answer":1,"explanation":"Tempura features seafood or vegetables dipped in a light batter (flour, egg, cold water) and flash-fried at high heat. The result: crispy coating, tender interior. Introduced to Japan by Portuguese missionaries (temporas = religious fasting days). Now quintessentially Japanese. Served with tentsuyu dipping sauce and grated daikon."},
    {"q":"What is 'ramen' (ラーメン)?","type":"mc","options":["A thick Japanese curry stew served over rice","Japanese noodle soup with wheat noodles in broth — with regional variations across Japan","A type of Japanese grilled pork belly dish","A cold Japanese buckwheat noodle dish"],"answer":1,"explanation":"Ramen is wheat noodles in broth with toppings (chashu pork, ajitama egg, nori, bamboo shoots, negi). Major regional styles: Sapporo (miso), Hakata (tonkotsu pork bone), Tokyo (shoyu soy sauce), Kyoto (rich shoyu). Originally Chinese-influenced, ramen evolved into a deeply Japanese culinary art form. Japan has ramen museums."},
    {"q":"What is 'matcha' (抹茶)?","type":"mc","options":["A type of Japanese sake made from green rice","Finely ground powder of specially grown and processed green tea leaves","A sweet Japanese red bean dessert","A carbonated Japanese green tea drink"],"answer":1,"explanation":"Matcha is stone-ground powdered green tea — made from shade-grown tencha leaves. The shading increases chlorophyll and L-theanine (amino acid promoting calm alertness). Used in tea ceremony (chado) and now pervasive in desserts globally. Grades: ceremonial (drinking), culinary (cooking/baking). High in antioxidants; distinctive umami and grassy flavor."},
    {"q":"What is Kabuki (歌舞伎) theater?","type":"mc","options":["A form of puppet theater with large ornate puppets","A classical Japanese dance-drama with elaborate makeup, costumes, and all-male casts","A modern Japanese comedy performance art","A Noh theater variant performed at Buddhist temples"],"answer":1,"explanation":"Kabuki (歌舞伎: song-dance-skill) is a classical theater form from the Edo period. Distinctive features: oshiroi (white face makeup), kumadori (bold paint patterns on actors' faces), mie (dramatic frozen poses), and onnagata (male actors playing female roles). UNESCO Intangible Heritage. Performed at historic venues like Tokyo's Kabukiza theater."},
    {"q":"What is Noh (能) theater?","type":"mc","options":["A contemporary Japanese comedy genre","Japan's oldest musical theater — featuring masked performers, slow movements, and poetic language","A form of street theater popular during festivals","A shadow puppet theater tradition from Okinawa"],"answer":1,"explanation":"Noh (能) is Japan's oldest classical performing art (14th century), developed by Zeami Motokiyo. Characterized by masked performers, slow, deliberate movements, poetic chanting, and themes from classic literature. Often combined with Kyogen (comic interludes). Considered the pinnacle of Japanese theatrical art. UNESCO Intangible Cultural Heritage."},
    {"q":"What is an 'izakaya' (居酒屋)?","type":"mc","options":["A traditional Japanese inn","A Japanese casual pub/bar where food and drinks are shared in a relaxed atmosphere","A high-end Japanese kaiseki restaurant","A Japanese street food market"],"answer":1,"explanation":"Izakaya (居 = stay, 酒 = sake, 屋 = shop/house) is Japan's version of a gastropub — where groups gather after work to eat small dishes (karaage, edamame, yakitori, tofu) and drink beer, sake, or highballs. Izakaya culture is central to Japanese workplace bonding (nomikai). Similar to British pubs or Spanish tapas bars."},
    {"q":"What does 'Natsukashii' (懐かしい) express?","type":"mc","options":["A feeling of longing for the future","A nostalgic, warm feeling evoked by something from the past","Sadness about a recent loss","Excitement about a new experience"],"answer":1,"explanation":"'Natsukashii' (懐かしい) describes the bittersweet, warm feeling of nostalgia — triggered by an old song, a childhood food, a smell, or a photo. It combines longing with fondness. Often cited as a word difficult to translate precisely into English. 'Natsukashii na...' sighed while listening to old music perfectly captures its essence."},
    {"q":"What is the concept of 'wabi-sabi' (侘び寂び)?","type":"mc","options":["A philosophy of maximalism and elaborate decoration","A Japanese aesthetic that finds beauty in imperfection, impermanence, and incompleteness","A business concept of continuous innovation","A traditional Japanese cooking philosophy"],"answer":1,"explanation":"Wabi-sabi is a Japanese aesthetic worldview: wabi (侘び) = rustic simplicity; sabi (寂び) = the beauty of aging and patina. It finds beauty in the imperfect, impermanent, and incomplete — a cracked tea bowl, moss on stone, a faded photograph. Deeply rooted in Zen Buddhism, it informs Japanese design, architecture, and the tea ceremony."},
    {"q":"What is 'ikigai' (生き甲斐)?","type":"mc","options":["A Japanese concept of working without rest","A reason for being — the intersection of what you love, what you're good at, what the world needs, and what you can be paid for","A Japanese martial arts philosophy","A traditional Japanese savings plan"],"answer":1,"explanation":"Ikigai (生き = life, 甲斐 = worth/purpose) means 'reason for being' or 'purpose in life.' The Westernized Venn diagram version (love + good at + world needs + paid for) is actually an embellishment — in Japan, ikigai is more simply the daily reason you get up in the morning. Okinawa's centenarians cite ikigai as a longevity factor."},
    {"q":"What is 'omotenashi' (おもてなし)?","type":"mc","options":["Japanese workplace overtime culture","Japanese hospitality — selfless, anticipatory service without expectation of reward","A form of Japanese gift-giving etiquette","A Japanese concept of group loyalty"],"answer":1,"explanation":"Omotenashi is Japanese hospitality: selfless, anticipatory, whole-hearted service — not for tips or recognition. Rooted in the tea ceremony philosophy: the host prepares everything considering the guest's experience completely. It differs from Western service in its proactivity and humility. Made globally famous when Christel Takigawa used it in Tokyo's 2020 Olympics bid."},
    {"q":"What is 'bushido' (武士道)?","type":"mc","options":["The Japanese art of archery","The samurai code of honor — emphasizing loyalty, honor, martial arts mastery, and death before dishonor","A traditional Japanese farming philosophy","The hierarchy protocol for Japanese corporate meetings"],"answer":1,"explanation":"Bushido (武士道) = way of the warrior. The samurai ethical code emphasizing: loyalty (chuu), honor (meiyo), courage (yuuki), respect (rei), honesty (makoto), compassion (jingi), and honor in death (seppuku rather than capture). Bushido's principles continue to influence Japanese business culture — loyalty to company, dedication, and honor."},
    {"q":"What is proper 'meishi' (名刺) etiquette in Japan?","type":"mc","options":["Immediately writing notes on the card after receiving it","Receiving and presenting business cards with both hands, studying them respectfully, and never defacing them","Keeping all received cards in your pocket immediately","Only presenting cards to people of higher rank than yourself"],"answer":1,"explanation":"Meishi (business card) exchange is a ritual in Japan: present and receive with both hands, bow, read the card carefully, and place it respectfully on the table during the meeting — never write on it, bend it, or stuff it in your pocket immediately. Your meishi represents you — a cheap card or careless presentation signals disrespect."},
    {"q":"What is 'tatemae' (建前) vs 'honne' (本音)?","type":"mc","options":["Public persona vs private feelings — what you say vs what you truly think","Work ethic vs personal ambition","Formal language vs casual dialect","Official policy vs unofficial practice"],"answer":0,"explanation":"Tatemae (建前) = public stance, the 'official' face shown to maintain social harmony; honne (本音) = one's true feelings, desires, or opinions. Japanese social interaction often maintains tatemae to avoid conflict. Understanding the gap between what someone says (tatemae) and what they mean (honne) is crucial for navigating Japanese business and social relationships."},
    {"q":"What is 'keigo' (敬語) in Japanese?","type":"mc","options":["Casual slang used by young people","The Japanese honorific language system — formal speech showing respect through vocabulary and grammar","Regional dialect variations across Japan","A specialized writing system for formal documents"],"answer":1,"explanation":"Keigo (敬語) is Japanese honorific language with three levels: sonkeigo (尊敬語, exalting the listener's actions), kenjougo (謙譲語, humbling your own actions), and teineigo (丁寧語, general polite speech). Used with superiors, customers, and strangers. Mastery of keigo is expected in Japanese business — saying 'irasshaimasu' instead of 'imasu' when referring to a customer's presence shows sonkeigo."},
    {"q":"What does 'shu-ha-ri' (守破離) represent?","type":"mc","options":["A three-step Japanese cooking method","Stages of mastery — follow rules, break rules, transcend rules","Japan's three main cultural regions","A business negotiation framework"],"answer":1,"explanation":"Shu-ha-ri describes mastery progression: Shu (守) = protect/follow — strictly learn and follow the master's form; Ha (破) = break — once fluent, explore and innovate; Ri (離) = leave/transcend — go beyond form to develop your own way. Rooted in Japanese martial arts and tea ceremony, it's applied to software development (Agile), business coaching, and artistic disciplines."},
    {"q":"What does the Japanese word 'Shouganai' (しょうがない) express?","type":"mc","options":["Excitement and anticipation","Extreme anger","'It can't be helped' — accepting situations beyond one's control","Strong disagreement"],"answer":2,"explanation":"'Shouganai' (仕方がない / しょうがない) means 'it can't be helped' or 'nothing can be done about it.' It expresses stoic acceptance of circumstances outside one's control — a deeply embedded cultural attitude in Japan. Similar expressions: 'shikata ga nai.' This philosophy contributed to Japan's resilience following natural disasters and hardships."},
    {"q":"What is a 'Ryokan' (旅館) in Japan?","type":"mc","options":["A type of Japanese fast food restaurant","A traditional Japanese inn with tatami rooms, futon beds, and often onsen","A Japanese commuter train line","A public bathhouse open to all"],"answer":1,"explanation":"A ryokan is a traditional Japanese inn featuring tatami-floored rooms, futon bedding, yukata robes, multi-course kaiseki meals, and often a natural hot spring (onsen). They embody Japanese hospitality (omotenashi). Staying in a ryokan is considered a quintessential Japanese cultural experience — popular in Kyoto, Hakone, and hot spring resort towns."},
    {"q":"What does the Japanese word 'Otaku' (オタク) originally mean?","type":"mc","options":["A disrespectful term for a foreigner","An obsessive enthusiast — originally of anime and manga, now applied to any intense hobby","A type of Japanese street food","A government worker"],"answer":1,"explanation":"'Otaku' (おたく/オタク) originally means 'your household' but evolved into slang for people with obsessive interests — initially anime, manga, and video games. In Japan it still carries a slightly negative connotation of social awkwardness. Globally it's been embraced positively. The massive Akihabara district in Tokyo is the spiritual home of otaku culture."},
    {"q":"What does the Japanese word 'Honne' (本音) mean?","type":"mc","options":["An honorific title for company presidents","One's true feelings or desires — contrasted with public behavior","A traditional Japanese musical instrument","A form of polite refusal"],"answer":1,"explanation":"'Honne' (本音, 'true sound') refers to a person's genuine feelings, desires, and opinions. It's contrasted with 'tatemae' (建前) — the public face one maintains to preserve harmony and meet social expectations. This duality is fundamental to understanding Japanese communication. Business deals, negotiations, and friendships must navigate the gap between honne and tatemae carefully."},
    {"q":"What is 'Juku' (塾) in Japanese education?","type":"mc","options":["A university scholarship program","A private cram school where students study intensively after regular school hours","A school sports club","A government-run adult education center"],"answer":1,"explanation":"Juku (塾) are private cram schools — a fixture of Japanese education. Students attend after regular school hours to prepare for entrance exams to elite middle schools, high schools, and universities. Japan's intense academic competition ('examination hell' — juken sensou) has made juku a massive industry. Major chains like Kumon are now global. Reflects Japan's deep cultural emphasis on education."},
