    {"q":"What is accrual accounting?","type":"mc","options":["Recording transactions only when cash is received or paid","Recording revenues when earned and expenses when incurred, regardless of cash flow timing","Accounting for inflation adjustments in financial statements","Tracking only capital expenditures, not operating expenses"],"answer":1,"explanation":"Accrual accounting records revenue when earned and expenses when incurred — not when cash changes hands. Required by GAAP and IFRS for most companies. Contrast with cash-basis accounting (only when cash moves). Accrual gives a more accurate picture of financial performance but creates non-cash items like accounts receivable and accrued expenses."},
    {"q":"What is working capital?","type":"mc","options":["Total assets of a company","Current assets minus current liabilities — measures short-term liquidity","Net income minus capital expenditures","Cash and cash equivalents only"],"answer":1,"explanation":"Working Capital = Current Assets − Current Liabilities. It measures a company's short-term liquidity — its ability to meet near-term obligations. Positive working capital means more short-term assets than liabilities (healthy). Negative can signal trouble. Key components: cash, accounts receivable, inventory (assets) vs. accounts payable, short-term debt (liabilities)."},
    {"q":"What is Net Present Value (NPV)?","type":"mc","options":["A company's net assets minus total liabilities","The sum of all future cash flows discounted to present value — used to evaluate investment viability","Revenue minus operating costs for the current period","The present market value of a bond minus its face value"],"answer":1,"explanation":"NPV = sum of (future cash flows ÷ (1 + discount rate)^year) − initial investment. A positive NPV means the investment returns more than its cost of capital — value-creating. NPV is the gold standard for capital budgeting decisions. A negative NPV means the project destroys value. Used by companies deciding whether to build factories, launch products, or make acquisitions."},
    {"q":"What is a sovereign wealth fund (SWF)?","type":"mc","options":["A bank owned by a central government","A state-owned investment fund built from government revenue — often commodity exports — invested globally","A government pension fund for civil servants","An IMF lending facility for sovereign nations"],"answer":1,"explanation":"Sovereign wealth funds are state-owned investment pools — often funded by oil revenues (Norway's Government Pension Fund Global, Abu Dhabi Investment Authority, Saudi PIF) or trade surpluses (China Investment Corporation, GIC Singapore). Norway's SWF, the world's largest, holds ~$1.7 trillion in global equities, bonds, and real estate. SWFs are major institutional investors globally."},
    {"q":"What is the difference between a debit card and a credit card?","type":"mc","options":["Debit cards charge interest; credit cards do not","Debit cards draw directly from your bank account; credit cards borrow from the issuer","Credit cards are only for business use","Debit cards have higher spending limits"],"answer":1,"explanation":"A debit card pulls funds directly from your checking account — spending what you have. A credit card is a short-term loan from the issuer; you repay monthly. Credit cards offer protections (fraud liability, chargebacks) and rewards but risk debt if balances aren't cleared. Debit carries less overspending risk but fewer consumer protections."},
    {"q":"What does the term 'basis point' mean in finance?","type":"mc","options":["One full percentage point","One-hundredth of a percentage point (0.01%)","One-tenth of a percentage point","A bond price unit"],"answer":1,"explanation":"A basis point (bps) = 0.01% (one hundredth of 1%). So 100 bps = 1%. Used to describe small changes in interest rates, bond yields, and spreads to avoid ambiguity. E.g., 'the Fed hiked rates by 25 bps' = 0.25%. Essential finance jargon — professionals always use bps to be precise."},
    {"q":"What is a rights offering in a company context?","type":"mc","options":["A legal claim by creditors on company assets","The right of the board to reject any takeover bid","An offering giving existing shareholders the right to buy new shares at a discount","A government mandate to offer products at regulated prices"],"answer":2,"explanation":"A rights offering lets existing shareholders purchase additional shares at a discounted price before the public offering, proportional to their current holdings. It raises equity capital while giving shareholders a chance to avoid dilution. Shareholders who don't want to exercise their rights can often sell them in the market."},
    {"q":"What is a custodian bank?","type":"mc","options":["A bank that holds physical gold for governments","A financial institution that holds and safeguards clients' securities and assets","A bank that specializes in estate management","A bank providing retail banking to minors"],"answer":1,"explanation":"Custodian banks (e.g., BNY Mellon, State Street, JPMorgan) hold and administer securities — stocks, bonds, other assets — on behalf of institutional investors like pension funds and mutual funds. They handle settlement, corporate actions, dividend collection, and reporting. Custody is a back-office function critical to the global financial system."},
    {"q":"What is an IPO 'roadshow'?","type":"mc","options":["A mandatory regulatory filing before listing","A series of presentations by company management to institutional investors before an IPO","A post-IPO promotional tour for retail investors","The physical distribution of stock certificates"],"answer":1,"explanation":"Before an IPO, management and investment bankers travel (or hold virtual sessions) to present the company to institutional investors — gauging demand and building the order book before pricing the stock. The roadshow typically lasts 1–2 weeks. It determines investor appetite and helps set the final IPO price."},
    {"q":"What is a Ponzi scheme?","type":"mc","options":["A legitimate investment strategy using leverage","A fraudulent scheme paying existing investors with new investors' money rather than genuine returns","A government-backed bond program","A type of hedge fund using options strategies"],"answer":1,"explanation":"A Ponzi scheme (named after Charles Ponzi) pays existing investors using capital from new investors, with no real investment returns. It collapses when new money dries up. Bernie Madoff ran history's largest — $65 billion — for decades. Early warning signs: consistently high returns, unregistered investment, secretive strategies, difficulty withdrawing funds."},
    {"q":"What does 'mark to market' accounting mean?","type":"mc","options":["Pricing goods based on competitor benchmarks","Valuing assets at their current market price rather than historical cost","Writing off assets that have lost all value","Recording sales only when cash is received"],"answer":1,"explanation":"Mark-to-market (MTM) accounting values assets at their current market price — fair value — rather than original cost. Used for trading securities and derivatives. Provides a more realistic picture of financial position. During the 2008 crisis, MTM rules forced banks to write down plummeting mortgage-backed securities, amplifying losses and panic."},
    {"q":"What is a holding company?","type":"mc","options":["A company that temporarily holds assets before selling","A parent company that owns controlling interests in subsidiary companies but may not produce goods or services itself","A real estate investment vehicle","A company holding government contracts"],"answer":1,"explanation":"A holding company owns shares in subsidiary companies — controlling them — without necessarily operating those businesses directly. Berkshire Hathaway is the world's most famous holding company, with subsidiaries like GEICO, BNSF, and See's Candies. Holding structures can offer tax advantages, liability protection, and operational flexibility."},
    {"q":"What is an indenture in bond markets?","type":"mc","options":["A penalty clause for early bond repayment","The legal contract between bond issuer and bondholders specifying terms","A type of subordinated bond","The premium paid over face value at issuance"],"answer":1,"explanation":"An indenture is the binding legal agreement governing a bond — detailing coupon rate, maturity, repayment terms, covenants (restrictions on issuer behavior), and events of default. The trustee (typically a bank) represents bondholders and enforces the indenture. Understanding indenture covenants is essential for credit analysis."},
    {"q":"What is a bond covenant?","type":"mc","options":["The coupon payment schedule","A contractual restriction or promise imposed on the bond issuer to protect bondholders","The legal priority of the bond in bankruptcy","The bond's credit rating from agencies"],"answer":1,"explanation":"Covenants are conditions in a bond indenture limiting or requiring certain issuer actions. Negative covenants restrict the issuer (e.g., no additional debt above a threshold). Positive covenants require actions (e.g., maintain minimum financial ratios). Covenant violations can trigger technical default. Looser covenants in leveraged loans are called 'covenant-lite.'"},
    {"q":"What is a secondary market offering (follow-on offering)?","type":"mc","options":["When a company raises money for the first time publicly","When existing shareholders sell their shares — no new shares are created","When a company issues new shares after its IPO to raise additional capital","A bond being traded on an exchange after issuance"],"answer":2,"explanation":"A follow-on (secondary) offering occurs when a public company issues additional shares to raise more equity capital after its IPO. Unlike a secondary market sale (existing holders selling), a follow-on directly raises cash for the company but dilutes existing shareholders. Companies use proceeds for expansion, debt paydown, or acquisitions."},
    {"q":"What is the difference between gross profit and operating profit?","type":"mc","options":["They are the same measure","Gross profit deducts COGS from revenue; operating profit further deducts operating expenses like SG&A and R&D","Operating profit excludes depreciation; gross profit includes it","Gross profit is for manufacturing; operating profit is for service companies"],"answer":1,"explanation":"Gross profit = Revenue − Cost of Goods Sold (COGS). Operating profit (EBIT) = Gross Profit − Operating Expenses (SG&A, R&D, depreciation). Gross margin shows production efficiency; operating margin reflects overall business efficiency before financing and tax. A high gross margin with low operating margin signals excessive overhead."},
    {"q":"What does 'diluted EPS' include that basic EPS does not?","type":"mc","options":["Foreign currency effects","Extraordinary one-time items","The impact of all potential share issuances: options, warrants, convertibles","Dividends paid to preferred shareholders"],"answer":2,"explanation":"Diluted EPS assumes all dilutive securities — stock options, warrants, convertible bonds, RSUs — have been exercised or converted, increasing the share count. It shows the worst-case scenario for per-share earnings. Companies with heavy stock-based compensation often show significant gaps between basic and diluted EPS — a red flag for shareholder dilution."},
    {"q":"What is a tender offer?","type":"mc","options":["An offer to supply goods at a government contract price","A public offer to purchase shareholders' shares at a premium to the market price, often to acquire a company","A bank's offer to extend credit to a company","A central bank's offer to buy government bonds"],"answer":1,"explanation":"A tender offer is a public bid to purchase shares directly from shareholders — typically at a premium — to acquire a controlling stake in a company. Unlike open-market purchases, tender offers are time-limited and require regulatory disclosure. Hostile takeovers often use tender offers to bypass an unwilling board."},
    {"q":"What is a 'golden parachute' in corporate finance?","type":"mc","options":["A guaranteed investment return for institutional investors","Lucrative compensation packages for executives triggered by a merger, acquisition, or termination","A government bailout program for failing banks","A bonus paid when a company's stock price reaches new highs"],"answer":1,"explanation":"A golden parachute is a contractual agreement providing generous benefits — cash, stock, options — to senior executives if they're dismissed following a corporate takeover. Designed to reduce executive resistance to beneficial mergers. Critics argue they reward failure and misalign management with shareholder interests. Increasingly scrutinized by proxy advisors and activist investors."},
    {"q":"What is the difference between systematic and unsystematic risk?","type":"mc","options":["Systematic is sector-specific; unsystematic affects the whole market","Systematic risk affects the whole market and cannot be diversified away; unsystematic is company-specific and can be diversified","Systematic risk is predictable; unsystematic is random","Systematic risk applies only to bonds; unsystematic to equities"],"answer":1,"explanation":"Systematic (market) risk — recessions, interest rate changes, geopolitical events — affects all assets and can't be eliminated by diversification. Unsystematic (idiosyncratic) risk is specific to a company or sector (a product recall, CEO scandal) and can be largely eliminated by holding a diversified portfolio. CAPM captures only systematic risk via beta."},
    {"q":"What is an asset management company (AMC)?","type":"mc","options":["A firm that manages real estate properties","A company that pools and invests client funds in various assets on their behalf","A government body that manages public assets","A bank division managing corporate treasury"],"answer":1,"explanation":"Asset managers (BlackRock, Vanguard, Fidelity, Nomura AM) invest pooled client capital into stocks, bonds, alternatives, and other assets. They charge management fees (and sometimes performance fees) for their expertise. BlackRock manages over $10 trillion in assets — the world's largest asset manager. AMCs serve retail, institutional, and sovereign wealth fund clients."},
    {"q":"What does 'over-the-counter' (OTC) mean in derivatives markets?","type":"mc","options":["Derivatives sold in retail pharmacies","Customized derivative contracts traded directly between counterparties without exchange standardization","Derivatives that have expired but are still traded","Government-regulated standard futures contracts"],"answer":1,"explanation":"OTC derivatives (interest rate swaps, credit default swaps, currency forwards) are privately negotiated between counterparties — custom terms, no central clearing by default. OTC markets are far larger than exchange-traded derivatives but carry more counterparty risk. Post-2008, regulators (Dodd-Frank, EMIR) pushed more OTC derivatives into central clearing to reduce systemic risk."},
    {"q":"What is the Japan Exchange Group (JPX)?","type":"mc","options":["A Japanese government body that regulates foreign exchange","The holding company operating the Tokyo Stock Exchange and Osaka Exchange — Japan's primary securities exchange operator","A consortium of Japanese banks for international payments","A regulatory agency overseeing Japanese financial institutions"],"answer":1,"explanation":"JPX (Japan Exchange Group) was formed in 2013 from the merger of the Tokyo Stock Exchange Group and Osaka Securities Exchange. It operates the Tokyo Stock Exchange (TSE) — Asia's largest by market cap — and derivatives markets. JPX listed on its own exchange. Key indices: TOPIX (broad), Nikkei 225 (price-weighted). JPX is central to Japan's capital markets ecosystem."}

  "japanese_n5": [
    {"q":"How do you say 'Good morning' in formal Japanese?","type":"mc","options":["Konbanwa","Ohayou gozaimasu","Konnichiwa","Oyasumi nasai"],"answer":1,"explanation":"'Ohayou gozaimasu' (おはようございます) is the formal good morning. 'Konnichiwa' = good afternoon/hello, 'Konbanwa' = good evening, 'Oyasumi nasai' = good night. In casual settings, just 'Ohayou' suffices."},
    {"q":"What does 'Arigatou gozaimasu' (ありがとうございます) mean?","type":"mc","options":["Good morning","Excuse me","Thank you very much","You're welcome"],"answer":2,"explanation":"'Arigatou gozaimasu' means 'thank you very much' — the polite, formal form. The casual version is 'Arigatou.' 'Doumo' alone works as a quick 'thanks.' The response to thanks is often 'Iie, dou itashimashite' (not at all, you're welcome)."},
    {"q":"What does 'Hai' (はい) mean?","type":"mc","options":["No","Maybe","Yes / I understand","Hello"],"answer":2,"explanation":"'Hai' (はい) means yes or signals acknowledgment. Japanese people often say 'hai' to indicate they're listening — not necessarily agreeing. The opposite is 'Iie' (いいえ, no). In very casual speech, 'un' replaces 'hai.'"},
    {"q":"Japanese uses three distinct writing systems.","type":"tf","options":["True","False"],"answer":0,"explanation":"True — Japanese uses Hiragana (ひらがな, for native words and grammar), Katakana (カタカナ, for foreign loanwords and emphasis), and Kanji (漢字, Chinese-derived characters). A single newspaper sentence routinely uses all three. Romaji (Roman alphabet) is also used occasionally."},
    {"q":"Which Japanese writing system uses Chinese-derived logographic characters?","type":"mc","options":["Hiragana","Katakana","Romaji","Kanji"],"answer":3,"explanation":"Kanji (漢字) are characters adapted from Chinese writing. Japanese students learn ~2,136 'joyo kanji' (common use). Hiragana and Katakana are phonetic syllabaries unique to Japanese — each has 46 base characters. Kanji carry semantic meaning; kana carry phonetic sound."},
    {"q":"What does 'Sumimasen' (すみません) most commonly mean?","type":"mc","options":["Thank you very much","Goodbye","Excuse me / I'm sorry","Please wait"],"answer":2,"explanation":"'Sumimasen' is one of the most useful Japanese phrases — it means 'excuse me' (to get attention), 'sorry' (mild apology), or even 'thank you' (for troubling someone). Its versatility makes it essential in daily Japanese conversation and business settings."},
    {"q":"What does 'Itadakimasu' (いただきます) mean?","type":"mc","options":["Please serve me","I humbly receive — said before eating","Goodbye","This is delicious"],"answer":1,"explanation":"'Itadakimasu' (いただきます) expresses gratitude before eating — for the food, the cook, and the lives of plants and animals that provided the meal. It comes from 'itadaku,' the humble form of 'to receive.' The equivalent phrase after eating is 'Gochisousama deshita.'"},
    {"q":"What does 'Kawaii' (かわいい) mean?","type":"mc","options":["Strong / powerful","Scary / intense","Cute / adorable","Expensive / valuable"],"answer":2,"explanation":"'Kawaii' means cute or adorable — and it's a major cultural force. The kawaii aesthetic pervades Japanese fashion, art, brand mascots (hello, Pikachu and Hello Kitty), and consumer products. It extends beyond children's items to adult professional contexts."},
    {"q":"How do you count 1, 2, 3 in Japanese?","type":"mc","options":["Un, deux, trois","Ichi, ni, san","Hana, dul, set","Yi, er, san"],"answer":1,"explanation":"Japanese numbers: ichi (一) = 1, ni (二) = 2, san (三) = 3, shi/yon = 4, go = 5, roku = 6, nana/shichi = 7, hachi = 8, ku/kyuu = 9, juu = 10. There are actually two counting systems — Japanese native and Sino-Japanese — each used in different contexts."},
    {"q":"What does 'Ookii' (大きい) mean?","type":"mc","options":["Small","Fast","Big / Large","Old"],"answer":2,"explanation":"'Ookii' (大きい) means big or large. Its antonym is 'chiisai' (小さい, small). The kanji 大 (dai/oo) means big and appears in 大学 (daigaku, university), 大阪 (Osaka), and 大丈夫 (daijoubu, it's okay/fine)."},
    {"q":"What does 'Gomen nasai' (ごめんなさい) mean?","type":"mc","options":["Good afternoon","I'm sorry / Please forgive me","You're welcome","Congratulations"],"answer":1,"explanation":"'Gomen nasai' is a sincere apology — stronger than 'sumimasen.' Business contexts demand an even more formal apology: 'Moushiwake gozaimasen' (literally: there is no excuse). Japan's culture places great emphasis on apology etiquette and saving face (mentsu)."},
    {"q":"What does 'Nani' (何) mean?","type":"mc","options":["Where","Who","Why","What"],"answer":3,"explanation":"'Nani' (何) means 'what.' Basic question words: nani = what, doko = where, dare = who, naze/doushite = why, itsu = when, dou = how. 'Nani?' alone is a casual (sometimes startled) 'What?!' — you'll hear it constantly in everyday Japanese."},
    {"q":"What does 'Oyasumi nasai' (おやすみなさい) mean?","type":"mc","options":["Good morning","Good afternoon","Good night","Have a safe trip"],"answer":2,"explanation":"'Oyasumi nasai' means good night — said when someone is going to bed. The root verb 'yasumu' (やすむ) means to rest. The casual form is just 'Oyasumi.' It's used when parting for the night, not just at bedtime."},
    {"q":"What does 'Domo' (どうも) express?","type":"mc","options":["Confusion or surprise","A casual, versatile thanks or greeting","A formal farewell","A request for directions"],"answer":1,"explanation":"'Domo' alone is an informal, versatile expression of thanks or acknowledgment. 'Domo arigatou' = thank you very much. It can greet, thank, or acknowledge depending on context. Its brevity makes it common in quick daily interactions — a friendly shorthand."},
    {"q":"What is the Japanese word for red?","type":"mc","options":["Ao","Shiro","Kuro","Aka"],"answer":3,"explanation":"'Aka' (赤) = red. Basic Japanese colors: aka (赤) = red, ao (青) = blue/green, shiro (白) = white, kuro (黒) = black, kiiro (黄色) = yellow, midori (緑) = green, orenji (オレンジ) = orange. 'Ao' covers both blue and green in many contexts — traffic lights in Japan are called 'ao' even though they appear green."},
    {"q":"How do you say 'Monday' in Japanese?","type":"mc","options":["Kinyoubi","Nichiyoubi","Getsuyoubi","Suiyoubi"],"answer":2,"explanation":"Japanese days of the week are based on celestial bodies and elements: Getsuyoubi (月曜日) = Monday (moon), Kayoubi (火曜日) = Tuesday (fire), Suiyoubi (水曜日) = Wednesday (water), Mokuyoubi (木曜日) = Thursday (wood), Kinyoubi (金曜日) = Friday (metal/gold), Doyoubi (土曜日) = Saturday (earth), Nichiyoubi (日曜日) = Sunday (sun)."},
    {"q":"How do you say 'Friday' in Japanese?","type":"mc","options":["Getsuyoubi","Mokuyoubi","Kinyoubi","Doyoubi"],"answer":2,"explanation":"Kinyoubi (金曜日) = Friday. 金 (kin) means gold or metal. Japanese days follow the seven luminaries system: sun, moon, Mars (fire), Mercury (water), Jupiter (wood), Venus (metal/gold), Saturn (earth). Learning the kanji for each element unlocks all seven day names."},
    {"q":"How do you say 'Sunday' in Japanese?","type":"mc","options":["Nichiyoubi","Doyoubi","Kinyoubi","Getsuyoubi"],"answer":0,"explanation":"Nichiyoubi (日曜日) = Sunday. 日 (nichi/hi) means sun — the same kanji used in Japan's name: 日本 (Nihon) = origin of the sun / Land of the Rising Sun. Sunday is typically a day off in Japan, and the kanji 日 appears everywhere (diary entries, dates, newspaper headers)."},
    {"q":"What does 'hyaku' (百) mean in Japanese?","type":"mc","options":["10","100","1,000","10,000"],"answer":1,"explanation":"Hyaku (百) = 100. Japanese large numbers: juu (十) = 10, hyaku (百) = 100, sen (千) = 1,000, ichiman (一万) = 10,000. The man (万) unit at 10,000 is a key difference from English (which groups by thousands). Japanese groups numbers by 10,000s: ichiman, juuman, hyakuman (million), etc."},
    {"q":"What does 'ichiman' (一万) mean?","type":"mc","options":["1,000","5,000","10,000","100,000"],"answer":2,"explanation":"'Ichiman' (一万) = 10,000. In Japan, prices, distances, and large figures are discussed in units of 万 (man). A ¥10,000 note (the highest denomination) is called 'ichiman-en.' This base-10,000 grouping differs from English base-1,000, making large number conversion a common challenge for Japanese learners."},
    {"q":"What does 'watashi' (私) mean?","type":"mc","options":["You","He / She","We","I / Me"],"answer":3,"explanation":"'Watashi' (私) = I / me — the standard, neutral first-person pronoun. Other forms: 'watakushi' (more formal), 'boku' (informal male), 'ore' (very casual male), 'atashi' (informal female). Japanese often drops the subject when clear from context — saying 'tabemasu' (eat) rather than 'watashi wa tabemasu' is natural."},
    {"q":"What does 'anata' (あなた) mean?","type":"mc","options":["I / me","He","You","They"],"answer":2,"explanation":"'Anata' (あなた) = you. However, in Japanese, directly calling someone 'anata' can sound distant or even cold — it's more natural to use the person's name or title. 'Anata' also serves as a term of endearment between spouses. In business, use names and titles rather than 'anata' to sound natural."},
    {"q":"What does 'taberu' (食べる) mean?","type":"mc","options":["To drink","To sleep","To eat","To go"],"answer":2,"explanation":"'Taberu' (食べる) = to eat — a Group 2 (ichidan) verb. 'Tabemasu' is the polite form; 'tabete' is the te-form. Essential food verbs: taberu (eat), nomu (飲む, drink), tsukuru (作る, make/cook). Learning verb groups (godan vs ichidan) is key to Japanese verb conjugation — ichidan verbs simply drop る and add endings."},
    {"q":"What does 'nomu' (飲む) mean?","type":"mc","options":["To eat","To sleep","To run","To drink"],"answer":3,"explanation":"'Nomu' (飲む) = to drink — a Group 1 (godan) verb conjugated: nomi-masu (polite), nonde (te-form), nonda (past). 'Nomikai' (飲み会) = drinking party — a major Japanese social institution where colleagues bond over drinks after work. Refusing a nomikai can be seen as antisocial; navigating this gracefully is part of Japanese work culture."},
    {"q":"What does 'iku' (行く) mean?","type":"mc","options":["To come","To see","To go","To return"],"answer":2,"explanation":"'Iku' (行く) = to go — one of the most essential Japanese verbs. Polite form: 'ikimasu.' Related: 'kuru' (来る) = to come, 'kaeru' (帰る) = to return home. Direction matters in Japanese: iku implies moving away from the speaker; kuru implies moving toward the speaker. 'Itterasshai / Ittekimasu' — the farewell pair when leaving home."},
    {"q":"What does 'miru' (見る) mean?","type":"mc","options":["To listen","To know","To see / watch / look","To read"],"answer":2,"explanation":"'Miru' (見る) = to see, watch, or look. Polite: 'mimasu.' 'Terebi o miru' = watch TV. Related verbs: 'kiku' (聞く) = to listen/hear/ask, 'yomu' (読む) = to read, 'kaku' (書く) = to write. The kanji 見 appears in 見本 (mihon, sample), 見学 (kengaku, study tour), and 見方 (mikata, viewpoint)."},
    {"q":"What does the kanji '山' (yama/san) mean?","type":"mc","options":["River","Person","Mountain","Water"],"answer":2,"explanation":"山 (yama or san when combined) = mountain. One of the simplest and most ancient kanji — a pictograph of a mountain with three peaks. Appears in: Fujisan (富士山, Mt. Fuji), Yamamoto (山本, surname), yamanote (山手, hillside area). Mount names use '-san' (富士山, 立山) or '-yama' (比叡山, 高野山)."},
    {"q":"What does the kanji '水' (mizu/sui) mean?","type":"mc","options":["Fire","Wood","Water","Earth"],"answer":2,"explanation":"水 (mizu) = water. One of five Chinese elements (wood, fire, earth, metal, water). Appears in: Suiyoubi (水曜日, Wednesday — water day), suiei (水泳, swimming), mizu (plain cold water), omizu (お水, water offered politely). The kanji 水 is a pictograph of flowing water — traced to ancient oracle bone script over 3,000 years ago."},
    {"q":"What does the kanji '火' (hi/ka) mean?","type":"mc","options":["Sun","Water","Tree","Fire"],"answer":3,"explanation":"火 (hi or ka) = fire. Appears in: Kayoubi (火曜日, Tuesday — fire day), kazan (火山, volcano — fire mountain), hanabi (花火, fireworks — flower fire), kaji (火事, fire/blaze). The kanji 火 is a pictograph of flames. Japanese New Year fireworks (hanabi taikai) are celebrated nationwide in summer."},
    {"q":"What does the kanji '日' (hi/nichi/bi) mean?","type":"mc","options":["Moon","Person","Star","Sun / Day"],"answer":3,"explanation":"日 (hi, nichi, or bi) = sun or day. The most versatile kanji — appears in: Japan (日本, Nihon), Sunday (日曜日, Nichiyoubi), diary (日記, nikki), today (今日, kyou), daily (毎日, mainichi). As a pictograph, it originated as a circle with a dot representing the sun. Japanese reads days of the month using 日: 1日 (tsuitachi), 2日 (futsuka), etc."},
    {"q":"What does the kanji '月' (tsuki/gatsu) mean?","type":"mc","options":["Star","Sun","Moon / Month","Year"],"answer":2,"explanation":"月 (tsuki or gatsu) = moon or month. Months are named ichi-gatsu (一月, January = 1st month) through juni-gatsu (十二月, December). Monday = Getsuyoubi (月曜日, moon day). The kanji 月 appears in 月給 (gekkyuu, monthly salary), 毎月 (maitsuki, every month), 先月 (sengetsu, last month)."},
    {"q":"What does 'ao' (青) mean in Japanese?","type":"mc","options":["Red","Yellow","Blue / Green","White"],"answer":2,"explanation":"'Ao' (青) covers both blue and green — a single color term for what English splits into two. Traffic lights in Japan are officially called 'ao' (青信号) even though they appear green. This reflects the historical Japanese color system before Chinese influence introduced 'midori' (緑) for green. Modern Japanese uses both, but 'ao' remains dominant for signals, the sky, and the sea."},
    {"q":"What does 'kiiro' (黄色) mean?","type":"mc","options":["Orange","White","Green","Yellow"],"answer":3,"explanation":"'Kiiro' (黄色) = yellow. 黄 (ki) = yellow, 色 (iro) = color. Used for caution signs, school zone markings, and autumn leaves (koyo). The yellow handkerchief is a Japanese symbol of waiting for someone's return (from the famous 1977 film 'The Yellow Handkerchief'). As a standalone adjective: 'kiiroi' (黄色い)."},
    {"q":"How do you say 'Tuesday' in Japanese?","type":"mc","options":["Getsuyoubi","Suiyoubi","Mokuyoubi","Kayoubi"],"answer":3,"explanation":"Kayoubi (火曜日) = Tuesday. 火 (ka) = fire. Japanese days map to seven celestial/elemental bodies: moon (Mon), fire (Tue), water (Wed), wood (Thu), metal (Fri), earth (Sat), sun (Sun). These correspond to the ancient seven-luminaries system shared across East Asian cultures. Fire's association with Tuesday likely comes via Chinese astronomical tradition."},
    {"q":"How do you say 'Wednesday' in Japanese?","type":"mc","options":["Mokuyoubi","Kayoubi","Doyoubi","Suiyoubi"],"answer":3,"explanation":"Suiyoubi (水曜日) = Wednesday. 水 (sui/mizu) = water. The water element (Wednesday) reflects the weekly cycle rooted in Chinese five-element philosophy. This system also connects to Gregorian day names: Wednesday = Wōden's day in English → Mercury in Roman, which corresponds to water in Chinese-Japanese tradition."},
    {"q":"How do you say 'Thursday' in Japanese?","type":"mc","options":["Kinyoubi","Suiyoubi","Mokuyoubi","Doyoubi"],"answer":2,"explanation":"Mokuyoubi (木曜日) = Thursday. 木 (moku/ki) = wood/tree. The wood element Thursday corresponds to Jupiter in Western astrology — Thor's day in Norse tradition (Thursday). This parallel across cultures reflects the shared seven-luminaries basis. 木 appears in: 木曜日 (Thursday), 木村 (Kimura, common surname), 木造 (mokuzou, wooden construction)."},
    {"q":"How do you say 'Saturday' in Japanese?","type":"mc","options":["Nichiyoubi","Doyoubi","Getsuyoubi","Kinyoubi"],"answer":1,"explanation":"Doyoubi (土曜日) = Saturday. 土 (do/tsuchi) = earth/soil. Saturday maps to Saturn in Western astrology — both associated with the earth element in East Asian tradition. The Japanese weekend is Doyoubi (Saturday) and Nichiyoubi (Sunday). '土' appears in 土地 (tochi, land), 土台 (dodai, foundation), and 大土 (daido, grand earth)."},
    {"q":"What does 'juu' (十) mean in Japanese?","type":"mc","options":["5","8","10","100"],"answer":2,"explanation":"Juu (十) = 10. Numbers in Japanese: ichi (1), ni (2), san (3), shi/yon (4), go (5), roku (6), nana/shichi (7), hachi (8), ku/kyuu (9), juu (10). Teen numbers: juu-ichi (11), juu-ni (12), etc. Decades: ni-juu (20), san-juu (30). The kanji 十 resembles a cross — a simple pictograph of tally marks."},
    {"q":"What does 'atarashii' (新しい) mean?","type":"mc","options":["Old","Small","Big","New"],"answer":3,"explanation":"'Atarashii' (新しい) = new. The kanji 新 (shin/atara) appears in: 新幹線 (Shinkansen, new trunk line = bullet train), 新聞 (shinbun, newspaper — new information), 新年 (shinnen, New Year). Antonym: 'furui' (古い, old). In business: 'atarashii purojekuto' = new project. A foundational adjective for everyday and business Japanese."},
    {"q":"What does 'furui' (古い) mean?","type":"mc","options":["New","Young","Fast","Old"],"answer":3,"explanation":"'Furui' (古い) = old (for objects, buildings, ideas — not people). To call a person old, use 'toshi o totta' (aged) rather than 'furui' which sounds rude. The kanji 古 (ko/furu) appears in: 古代 (kodai, ancient times), 古典 (koten, classical literature), 古都 (koto, ancient capital). Antonym: 'atarashii' (new)."},
    {"q":"What does 'kare' (彼) mean in Japanese?","type":"mc","options":["I / me","She / her","They / them","He / him / boyfriend"],"answer":3,"explanation":"'Kare' (彼) = he / him — and colloquially, 'boyfriend.' Similarly, 'kanojo' (彼女) = she / her / girlfriend. Japanese often avoids third-person pronouns, preferring the person's name. 'Kare wa Tokyo ni imasu' = He is in Tokyo. In casual speech, 'kare' and 'kanojo' for boyfriend/girlfriend are understood from context."},
    {"q":"What does 'kanojo' (彼女) mean?","type":"mc","options":["I / me","He / boyfriend","They / group","She / her / girlfriend"],"answer":3,"explanation":"'Kanojo' (彼女) = she / her — and colloquially, 'girlfriend.' 彼 (kare) = he / boyfriend. Like many Japanese pronouns, their usage is context-dependent. In a sentence: 'kanojo wa sensei desu' = She is a teacher. In casual speech about relationships: 'kanojo ga iru?' = Do you have a girlfriend? A very common word in both formal and casual registers."},
    {"q":"What does 'sen' (千) mean in Japanese?","type":"mc","options":["100","500","1,000","5,000"],"answer":2,"explanation":"Sen (千) = 1,000. Numbers: hyaku (百) = 100, sen (千) = 1,000, ichiman (一万) = 10,000. Japanese large number groupings: man (万) = 10,000; oku (億) = 100,000,000. The word 'senbazuru' = 1,000 cranes (from 'sen' + 'wa' plural + 'tsuru' crane). Folding 1,000 origami cranes is said to grant a wish in Japanese tradition."},
    {"q":"What does Katakana (カタカナ) primarily represent?","type":"mc","options":["Native Japanese words and grammatical particles","Ancient ceremonial text","Foreign loanwords, technical terms, and emphasis","Chinese-origin characters with semantic meaning"],"answer":2,"explanation":"Katakana is Japan's angular syllabary — each character represents a sound (mora). Primarily used for: foreign loanwords (コーヒー = koohii = coffee), technical/scientific terms, onomatopoeia (ドキドキ = doki-doki = heartbeat), and emphasis (like italics). Company names often use katakana. 46 base characters, same phonetic coverage as hiragana."},
    {"q":"What does the kanji '人' (hito/jin/nin) mean?","type":"mc","options":["Tree","Water","Mountain","Person"],"answer":3,"explanation":"人 (hito, jin, or nin) = person. One of the most basic kanji — a pictograph of a person standing with legs apart. Appears everywhere: 日本人 (Nihonjin, Japanese person), 外国人 (gaikokujin, foreigner), 人口 (jinkou, population), 人生 (jinsei, life), 大人 (otona, adult). The kanji 人 is among the first learned in elementary school and the most frequently used in Japanese text."},
    {"q":"What does the kanji '木' (ki/moku) mean?","type":"mc","options":["Fire","Water","Tree / Wood","Earth"],"answer":2,"explanation":"木 (ki or moku) = tree or wood. A pictograph of a tree with branches and roots. Appears in: Mokuyoubi (木曜日, Thursday — wood day), Kimura (木村, tree + village — a common surname), 木造 (mokuzou, wooden construction), 木材 (mokuzai, lumber). Japan's traditional architecture (shrines, temples) is predominantly 木造 — reflecting the cultural and historical importance of wood."},
    {"q":"What does the kanji '金' (kin/kane) mean?","type":"mc","options":["Earth / soil","Fire","Water","Gold / Metal / Money"],"answer":3,"explanation":"金 (kin or kane) = gold, metal, or money. One kanji, multiple essential meanings. Appears in: Kinyoubi (金曜日, Friday — metal/gold day), okane (お金, money), kinzoku (金属, metal), kiniro (金色, golden color). The yen symbol ¥ corresponds to the kanji 円, but 金 is the word for money in everyday speech. 'Okane ga arimasu ka?' = Do you have money?"},
    {"q":"What does the kanji '土' (tsuchi/do) mean?","type":"mc","options":["Water","Fire","Tree","Earth / Soil"],"answer":3,"explanation":"土 (tsuchi or do) = earth or soil. Appears in: Doyoubi (土曜日, Saturday — earth day), tochi (土地, land/property), dodai (土台, foundation), dozou (土蔵, earthen storehouse). The kanji 土 is a simple pictograph — a mound of earth. In the five-element system (wood, fire, earth, metal, water), earth is the central balancing element."},
    {"q":"What does 'kuru' (来る) mean?","type":"mc","options":["To go","To eat","To return","To come"],"answer":3,"explanation":"'Kuru' (来る) = to come — one of Japanese's two irregular verbs. Polite form: 'kimasu.' Key contrasting pair: 'iku' (行く, to go — away from speaker) vs 'kuru' (来る, to come — toward speaker). The farewell ritual 'Ittekimasu / Itterasshai' (I'm going and coming back / Please go and come back) uses both concepts in daily Japanese life."},
    {"q":"What does the Japanese suffix '-san' (さん) indicate?","type":"mc","options":["It means 'three' when counting","A honorific title equivalent to Mr./Ms./Mrs. — used to show respect","It indicates the person is a doctor","It's used only for children"],"answer":1,"explanation":"'-San' (さん) is the most common Japanese honorific — appended to names to show respect, equivalent to Mr., Ms., or Mrs. in English. It's gender-neutral and used in most social contexts. Other honorifics: '-kun' (for younger males/subordinates), '-chan' (for children/close friends), '-sama' (very formal), '-sensei' (for teachers/doctors/experts)."},
    {"q":"How do you say 'delicious' in Japanese?","type":"mc","options":["Kawaii","Kirei","Oishii","Sugoi"],"answer":2,"explanation":"'Oishii' (おいしい / 美味しい) means delicious or tasty. It's one of the most enthusiastic compliments you can give Japanese food. Related: 'mazui' (まずい) = bad-tasting. When tasting something great, Japanese people often say 'Oishii!' spontaneously. Another common expression: 'Umai!' (うまい) — more casual, also means delicious or skillful."},
    {"q":"What does the Japanese particle 'wa' (は) indicate?","type":"mc","options":["The object of the sentence","The location where an action occurs","The topic of the sentence","The direction of movement"],"answer":2,"explanation":"'Wa' (は) is the topic marker — it marks what the sentence is ABOUT. 'Watashi wa gakusei desu' = As for me, I am a student. Different from the subject marker 'ga' (が): 'ga' introduces new information or emphasizes the subject; 'wa' handles known or contrasted topics. The wa/ga distinction is one of Japanese grammar's most nuanced aspects."},
    {"q":"What does the Japanese particle 'o' / 'wo' (を) indicate?","type":"mc","options":["The topic","The direction","The time","The direct object of a verb"],"answer":3,"explanation":"'O' (を, also written 'wo') marks the direct object — the thing receiving the action. 'Sushi o taberu' = eat sushi; 'Nihongo o hanasu' = speak Japanese; 'hon o yomu' = read a book. In modern Japanese, を is only used as the object marker; it's pronounced 'o' in standard Tokyo Japanese, not 'wo.'"},
    {"q":"What does 'desu' (です) and 'masu' (ます) signal in Japanese?","type":"mc","options":["Past tense for all verbs","Negative sentences","Polite/formal register — added to make speech or writing more respectful","Indicating future actions only"],"answer":2,"explanation":"'Desu' ends noun and adjective sentences politely (in place of the plain copula 'da'); 'masu' ends verb sentences politely. Dropping them to the plain form (da/dictionary form) is casual. This desu/masu style is called 'teineigo' — the baseline polite form taught first to all Japanese learners and used in business, with strangers, and in formal contexts."},
    {"q":"In the sentence 'ねこ が います' (neko ga imasu), what role does the particle が (ga) play?","type":"mc","options":["It marks the destination","It marks the subject of the sentence","It marks possession","It marks the object"],"answer":1,"explanation":"が (ga) is the subject marker particle. 'ねこがいます' = 'There is a cat.' While は (wa) is the topic marker, が specifically highlights the subject — often used when introducing new information or answering 'who/what' questions. Compare: 'ねこはいます' (As for the cat, it exists) vs 'ねこがいます' (A cat exists — there's one!)."},
    {"q":"Which particle would correctly complete: '図書館___本を読みます' (I read books at the library)?","type":"mc","options":["は","が","で","へ"],"answer":2,"explanation":"で (de) marks the location where an action takes place. '図書館で本を読みます' = 'I read books at the library.' Contrast with に (ni), which marks existence location (図書館に本があります = There are books in the library). で can also mark the means/tool: 'バスで行きます' (I go by bus)."},
    {"q":"What does 'これは田中さん___本です' (Kore wa Tanaka-san ___ hon desu) mean, and which particle fills the blank?","type":"mc","options":["も — 'This is also a book'","が — 'This is the book that Tanaka-san likes'","の — 'This is Tanaka-san's book'","で — 'This is a book by Tanaka-san's means'"],"answer":2,"explanation":"の (no) shows possession and modification: 'これは田中さんの本です' = 'This is Tanaka-san's book.' の is extremely versatile — it can also link nouns as modifiers (日本の車 = Japanese car, literally 'Japan's car'). It is one of the most frequent particles in Japanese and appears in many N5 sentences."},
    {"q":"A friend says: 'わたしも行きます' (Watashi mo ikimasu). What does も (mo) indicate?","type":"mc","options":["The speaker is unsure whether they will go","The speaker is also going (in addition to someone else)","The speaker is going to a special place","The speaker is going for the first time"],"answer":1,"explanation":"も (mo) means 'also' or 'too.' 'わたしも行きます' = 'I am also going.' It replaces は or が when adding the same fact about another topic. Example: 'すしが好きです。ラーメンも好きです' = 'I like sushi. I also like ramen.' も can stack: 'Aも Bも' means 'both A and B.'"},
    {"q":"Which sentence correctly uses へ (e) to express direction?","type":"mc","options":["駅で行きます","駅が行きます","駅へ行きます","駅の行きます"],"answer":2,"explanation":"へ (e) is the direction particle meaning 'toward' or 'to.' '駅へ行きます' = 'I go to(ward) the station.' It is interchangeable with に for destinations in most cases, but へ emphasizes the direction of travel rather than the endpoint. Common in phrases like '東京へようこそ' (Welcome to Tokyo)."},
    {"q":"What does '今日' (kyou) mean?","type":"mc","options":["Yesterday","Tomorrow","Today","This week"],"answer":2,"explanation":"今日 (きょう, kyou) = today. The kanji combine 今 (ima = now) + 日 (hi/nichi = day/sun), literally 'the current day.' Note the unusual reading — 今 alone reads 'ima' but in 今日 it reads 'kyo.' Related time words: 今週 (konshuu = this week), 今月 (kongetsu = this month), 今年 (kotoshi = this year)."},
    {"q":"You make plans for the next day. Which word means 'tomorrow' in Japanese?","type":"mc","options":["昨日 (kinou)","今日 (kyou)","明日 (ashita)","来週 (raishuu)"],"answer":2,"explanation":"明日 (あした, ashita) = tomorrow. The kanji 明 (bright/clear) + 日 (day/sun) suggest 'the bright coming day.' It can also be read 'myounichi' in formal or written contexts. Opposites: 昨日 (kinou) = yesterday; 今日 (kyou) = today. 'あした学校へ行きます' = 'I will go to school tomorrow.'"},
    {"q":"Which kanji compound means 'yesterday'?","type":"mc","options":["今日","明日","昨日","来日"],"answer":2,"explanation":"昨日 (きのう, kinou) = yesterday. The kanji 昨 means 'yesterday/previous' and appears in 昨年 (sakunen = last year) and 昨夜 (sakuya = last night). '昨日何を食べましたか' = 'What did you eat yesterday?' Note: 昨日 is read 'kinou' in speech but 'sakujitsu' in very formal writing."},
    {"q":"Your friend asks '今、何時ですか?' What are they asking?","type":"mc","options":["What time is it now?","Where are you now?","What are you doing now?","How do you feel now?"],"answer":0,"explanation":"今 (いま, ima) = now. '今、何時ですか' = 'What time is it now?' 今 appears in many useful combinations: 今日 (kyou = today), 今週 (konshuu = this week), 今月 (kongetsu = this month), 今年 (kotoshi = this year). As a standalone word, ima is very natural in conversation: '今いそがしいです' = 'I'm busy right now.'"},
    {"q":"What does うち (uchi) most commonly refer to in everyday Japanese conversation?","type":"mc","options":["School","One's own home or house","The office","A convenience store"],"answer":1,"explanation":"うち (uchi) means 'home' or 'my place,' and can be written as 家. It carries a sense of belonging — 'my/our home.' '家に帰ります' = 'I return home.' うち also means 'inside/within' in other contexts (うちに = while/within). Compare with いえ (ie), a more neutral word for house/building. うち feels warm and personal."},
    {"q":"学校 (gakkou) is a very common word for N5 students. What does it mean?","type":"mc","options":["Library","Hospital","School","Post office"],"answer":2,"explanation":"学校 (がっこう, gakkou) = school. 学 (gaku) = study/learning, 校 (kou) = school building/institution. Compounds with 学: 学生 (gakusei = student), 大学 (daigaku = university), 小学校 (shougakkou = elementary school), 中学校 (chuugakkou = middle school), 高校 (koukou = high school). '学校へ行きます' = 'I go to school.'"},
    {"q":"You need to catch a train. Which word refers to a train station?","type":"mc","options":["病院 (byouin)","図書館 (toshokan)","駅 (eki)","空港 (kuukou)"],"answer":2,"explanation":"駅 (えき, eki) = train station. It is one of the most essential words for getting around Japan. '駅はどこですか' = 'Where is the station?' '駅へ行きます' = 'I'm going to the station.' The kanji 駅 depicts a horse station (post road relay point) — modernized to mean railway station. Common compounds: 終点 (shuuten = last stop), 乗り換え (norikae = transfer)."},
    {"q":"What does 店 (みせ, mise) mean?","type":"mc","options":["Park","Museum","Shop or store","School"],"answer":2,"explanation":"店 (みせ, mise) = shop / store. You'll see it in: コンビニの店 (convenience store), お店 (o-mise, polite form), and many compound words like 食料品店 (shokuryouhin-ten = grocery store), 本屋 (hon-ya = bookstore). 'あの店で買いました' = 'I bought it at that shop.' The suffix -ya (屋) also often means a type of shop: 花屋 (hana-ya = flower shop)."},
    {"q":"Which season is represented by 春 (haru)?","type":"mc","options":["Summer","Autumn","Winter","Spring"],"answer":3,"explanation":"春 (はる, haru) = spring. It is associated with cherry blossoms (桜, sakura) and new beginnings — the Japanese school and fiscal year both start in April (spring). 春一番 (haruichiban) is the name of the first strong south wind of spring. The kanji shows 春 with the element for 'sun' (日) at the bottom, evoking warmth returning."},
    {"q":"The kanji 夏 is read 'natsu.' What does it mean?","type":"mc","options":["Spring","Summer","Autumn","Winter"],"answer":1,"explanation":"夏 (なつ, natsu) = summer. Japan's summer is famous for its heat and humidity, festivals (夏祭り, natsu matsuri), fireworks (花火, hanabi), and Obon (お盆) — a Buddhist tradition of honoring ancestors. '夏が好きです' = 'I like summer.' Compound: 夏休み (natsuyasumi) = summer vacation."},
    {"q":"Which word means 'autumn' or 'fall' in Japanese?","type":"mc","options":["冬 (fuyu)","春 (haru)","秋 (aki)","夏 (natsu)"],"answer":2,"explanation":"秋 (あき, aki) = autumn / fall. Famous for autumn leaves (紅葉, kouyou), harvest moon (お月見, o-tsukimi), and cool weather. The proverb '食欲の秋' (shokuyoku no aki = autumn of appetite) captures the season's association with good food. '秋になりました' = 'It has become autumn.'"},
    {"q":"If a Japanese friend complains '冬は寒いです' (fuyu wa samui desu), what are they saying?","type":"mc","options":["Summer is hot.","Spring is windy.","Winter is cold.","Autumn is colorful."],"answer":2,"explanation":"冬 (ふゆ, fuyu) = winter. 寒い (samui) = cold (used for weather/ambient temperature). '冬は寒いです' = 'Winter is cold.' Contrast 寒い (samui = cold outside) with 冷たい (tsumetai = cold to the touch, like cold water). Compound: 冬休み (fuyuyasumi) = winter vacation (including New Year holidays in Japan)."},
    {"q":"雨 (ame) is a common word in Japanese weather conversation. What does it mean?","type":"mc","options":["Snow","Wind","Rain","Cloud"],"answer":2,"explanation":"雨 (あめ, ame) = rain. The kanji 雨 is a pictograph showing raindrops falling from a cloud. '今日は雨です' = 'It is rainy today.' Common compounds: 雨天 (uten = rainy weather), 大雨 (oame = heavy rain), 小雨 (kosame = light rain/drizzle), 梅雨 (tsuyu = rainy season in early summer). 雨具 (amagusa) = rain gear."},
    {"q":"What natural weather phenomenon does 雪 (yuki) refer to?","type":"mc","options":["Rain","Snow","Fog","Thunder"],"answer":1,"explanation":"雪 (ゆき, yuki) = snow. '雪が降っています' = 'It is snowing.' Japan's northern regions (Hokkaido, Niigata) are famous for heavy snowfall. 雪 is also a common female given name. Compounds: 大雪 (ooyuki = heavy snow), 初雪 (hatsuyuki = first snow of the season), 雪だるま (yukidaruma = snowman). The kanji combines 雨 (rain) + a lower element suggesting sweeping."},
    {"q":"Your Japanese weather app shows '晴れ' (hare). What weather should you expect?","type":"mc","options":["Rain","Cloudy skies","Sunny and clear","Snow"],"answer":2,"explanation":"晴れ (はれ, hare) = sunny / clear weather. '今日は晴れです' = 'It is sunny today.' The verb form 晴れる (hareru) means 'to clear up.' Opposite: 曇り (kumori = cloudy), 雨 (ame = rain). In common speech: '晴れた日' (hareta hi = a clear day). 晴れ can also mean 'festive/formal' — 晴れ着 (haregi) = formal clothes for special occasions."},
    {"q":"How do you say 'father' (someone else's, or in polite speech) in Japanese?","type":"mc","options":["お兄さん (oniisan)","お父さん (otousan)","お母さん (okaasan)","おじさん (ojisan)"],"answer":1,"explanation":"お父さん (おとうさん, otousan) = father (polite/referential form used when talking about someone else's father or addressing your own in direct speech). When referring to your own father to others, Japanese speakers often use 父 (chichi). '田中さんのお父さんはどこですか' = 'Where is Mr. Tanaka's father?' The お- prefix adds politeness. 父 (chichi) = my father (humble); お父さん = your/their father (respectful)."},
    {"q":"Which word means 'mother' in Japanese (used when referring to someone else's mother)?","type":"mc","options":["妹 (imouto)","お姉さん (oneesan)","お母さん (okaasan)","おばさん (obasan)"],"answer":2,"explanation":"お母さん (おかあさん, okaasan) = mother (polite/referential form). Your own mother is 母 (haha) when speaking to others. 'お母さんはいますか' = 'Is your mother there?' Memory tip: the 'kaa' sound is like a baby's call — similar to 'mama' sounds across cultures. Contrast with おばさん (obasan = aunt/middle-aged woman) — the long 'aa' vs short 'a' matters!"},
    {"q":"If someone introduces their お兄さん (oniisan), who are they introducing?","type":"mc","options":["Younger brother","Older sister","Older brother","Father"],"answer":2,"explanation":"お兄さん (おにいさん, oniisan) = older brother (when referring to someone else's). Your own older brother is 兄 (ani). Japanese distinguishes older vs younger siblings: 兄/お兄さん (older brother), 弟 (otouto = younger brother), 姉/お姉さん (older sister), 妹 (imouto = younger sister). This hierarchy reflects the importance of seniority in Japanese family and social culture."},
    {"q":"What does 妹 (imouto) mean?","type":"mc","options":["Older sister","Younger brother","Younger sister","Mother"],"answer":2,"explanation":"妹 (いもうと, imouto) = younger sister. Unlike お兄さん/お姉さん, 妹 and 弟 (otouto = younger brother) typically do NOT use the honorific お- prefix when referring to your own siblings. '妹が二人います' = 'I have two younger sisters.' The full sibling set: 兄 (ani = older brother), 弟 (otouto = younger brother), 姉 (ane = older sister), 妹 (imouto = younger sister)."},
    {"q":"The kanji 目 (me) refers to which part of the body?","type":"mc","options":["Ear","Mouth","Nose","Eye"],"answer":3,"explanation":"目 (め, me) = eye. The kanji is a pictograph of an eye turned sideways. '目が大きいですね' = 'You have big eyes, don't you!' Compounds: 目薬 (megusuri = eye drops), 目覚まし (mezamashi = alarm clock, literally 'eye-awakener'), 一目 (hitome = one glance). The on-yomi 'moku' appears in compounds like 目的 (mokuteki = purpose/goal)."},
    {"q":"Which kanji represents 'hand' in Japanese?","type":"mc","options":["足 (ashi)","手 (te)","耳 (mimi)","口 (kuchi)"],"answer":1,"explanation":"手 (て, te) = hand. The kanji is a pictograph showing a hand with fingers. '手を洗ってください' = 'Please wash your hands.' Compounds: 手紙 (tegami = letter, literally 'hand paper'), 上手 (jouzu = skilled, literally 'upper hand'), 下手 (heta = unskilled), 手伝う (tetsudau = to help). The word 手 is incredibly productive in Japanese vocabulary."},
    {"q":"What is the meaning of the verb 読む (yomu)?","type":"mc","options":["To write","To listen","To read","To speak"],"answer":2,"explanation":"読む (よむ, yomu) = to read. '本を読みます' = 'I read a book.' The polite form is 読みます (yomimasu). It uses the particle を (wo) to mark the object being read. Related: 読み方 (yomikata = how to read), 音読み (on-yomi = Chinese reading of kanji), 訓読み (kun-yomi = Japanese reading of kanji). 読書 (dokusho) = reading (as a hobby)."},
    {"q":"A student says '漢字を書きます' (Kanji wo kakimasu). What are they doing?","type":"mc","options":["Reading kanji","Writing kanji","Learning kanji","Forgetting kanji"],"answer":1,"explanation":"書く (かく, kaku) = to write. '漢字を書きます' = 'I write kanji.' Polite form: 書きます (kakimasu). Note that 書く shares pronunciation with 描く (kaku = to draw/paint) but uses a different kanji. Compounds: 書類 (shorui = documents), 教科書 (kyoukasho = textbook), 書道 (shodou = calligraphy). '書いてください' = 'Please write it.'"},
    {"q":"聞く (kiku) has multiple meanings. Which of the following is NOT one of them?","type":"mc","options":["To listen","To hear","To ask","To see"],"answer":3,"explanation":"聞く (きく, kiku) means to listen, to hear, OR to ask — but NOT to see (that's 見る, miru). '音楽を聞きます' = 'I listen to music.' '先生に聞きます' = 'I ask the teacher.' This triple meaning makes it very useful. The kanji 聞 shows an ear (耳) inside a gate (門) — like eavesdropping! Related: 聞こえます (kikoemasu = can be heard)."},
    {"q":"Which verb means 'to sleep' in Japanese?","type":"mc","options":["起きる (okiru)","寝る (neru)","食べる (taberu)","来る (kuru)"],"answer":1,"explanation":"寝る (ねる, neru) = to sleep / to lie down. '何時に寝ますか' = 'What time do you go to sleep?' Polite form: 寝ます (nemasu). Related: 寝室 (shinshitsu = bedroom), 昼寝 (hirune = afternoon nap). The opposite is 起きる (okiru = to wake up / get up). 'もう寝ます' = 'I'm going to sleep now' — a common phrase before bed."},
    {"q":"What does the verb 起きる (okiru) mean?","type":"mc","options":["To sleep","To eat","To wake up / get up","To go out"],"answer":2,"explanation":"起きる (おきる, okiru) = to wake up / to get up. '毎朝六時に起きます' = 'I wake up at 6 every morning.' Polite form: 起きます (okimasu). 起きる also means 'to happen/occur' — an event 'wakes up': '事故が起きた' = 'An accident occurred.' The kanji 起 combines 走 (run) + 己 (self) — the idea of rousing oneself into motion."},
    {"q":"What does ご飯 (gohan) primarily refer to in Japanese?","type":"mc","options":["Tea","Fish","Rice / a meal","Bread"],"answer":2,"explanation":"ご飯 (ごはん, gohan) = cooked rice, OR a meal in general. '朝ご飯' (asagohan) = breakfast, '昼ご飯' (hirugohan) = lunch, '晩ご飯' (bangohan) = dinner. The prefix ご- is an honorific. Rice is so central to Japanese culture that the word for rice doubles as the word for 'meal.' '今日のご飯は何ですか' = 'What's today's meal?'"},
    {"q":"When a Japanese person says 'お水をください' (o-mizu wo kudasai), what are they requesting?","type":"mc","options":["Hot tea","A glass of milk","Water","A snack"],"answer":2,"explanation":"水 (みず, mizu) = water. 'お水をください' = 'Please give me water / Water, please.' This is a natural phrase at restaurants. The お- makes it polite. Cold water is typically served free at restaurants in Japan. Contrast: お湯 (oyu) = hot water. 水道水 (suidousui) = tap water; ミネラルウォーター (mineraru uootaa) = mineral water."},
    {"q":"お茶 (ocha) is something offered to almost every guest in Japan. What is it?","type":"mc","options":["Rice wine","Tea","Soup","Coffee"],"answer":1,"explanation":"お茶 (おちゃ, ocha) = tea. The お- is an honorific prefix. In Japan, 'ocha' typically means green tea (緑茶, ryokucha) by default. Offering tea to guests is a deeply ingrained cultural practice. 'お茶を一杯どうぞ' = 'Please have a cup of tea.' Types include: 煎茶 (sencha), 抹茶 (matcha = powdered green tea), 麦茶 (mugicha = barley tea, popular cold in summer)."},
    {"q":"What does 魚 (sakana) mean?","type":"mc","options":["Meat","Vegetable","Fish","Egg"],"answer":2,"explanation":"魚 (さかな, sakana) = fish. Fish is central to Japanese cuisine — sushi (寿司), sashimi (刺身), grilled fish (焼き魚, yakizakana). '魚が好きです' = 'I like fish.' The kanji 魚 is a pictograph of a fish. The kun-yomi is 'sakana' (everyday speech); on-yomi is 'gyo' in compounds like 金魚 (kingyo = goldfish). '魚屋' (sakanaya) = fish shop."},
    {"q":"In Japanese cuisine, 肉 (niku) refers to what ingredient?","type":"mc","options":["Fish","Tofu","Meat","Rice"],"answer":2,"explanation":"肉 (にく, niku) = meat. 牛肉 (gyuuniku) = beef, 豚肉 (butaniku) = pork, 鶏肉 (toriniku) = chicken. '肉が好きですか' = 'Do you like meat?' The kanji 肉 (the 月 radical in compounds, called 'nikuzuki') represents flesh and appears in many body-related kanji. Gyuudon (牛丼) and yakiniku (焼肉, grilled meat) are famous dishes featuring niku."},
    {"q":"A Japanese person asks you '今、何時ですか?' What is the correct interpretation?","type":"mc","options":["What day is it?","What time is it?","What month is it?","What year is it?"],"answer":1,"explanation":"何時ですか (なんじですか, nan ji desu ka) = 'What time is it?' 何 (nan) = what, 時 (ji) = o'clock/hour. To answer: '三時です' (sanji desu = It is 3 o'clock). Half hours use 半 (han): '三時半' (sanji han = 3:30). AM/PM: 午前 (gozen = AM) and 午後 (gogo = PM). Learning to tell time is an essential N5 skill."},
    {"q":"You are lost and need to ask for directions. Which question word means 'where'?","type":"mc","options":["いつ (itsu)","だれ (dare)","なに (nani)","どこ (doko)"],"answer":3,"explanation":"どこ (doko) = where. 'トイレはどこですか' = 'Where is the restroom?' 'どこから来ましたか' = 'Where are you from?' The core question words: どこ (where), いつ (when), だれ (who), なに/なん (what), どれ (which), どう (how), なぜ/どうして (why). Mastering these is key to forming basic Japanese questions."},
    {"q":"Which question word asks about TIME — 'When?'","type":"mc","options":["どこ (doko)","だれ (dare)","いつ (itsu)","どれ (dore)"],"answer":2,"explanation":"いつ (itsu) = when. 'パーティーはいつですか' = 'When is the party?' 'いつ日本へ行きますか' = 'When will you go to Japan?' Unlike English 'when,' いつ can stand alone as a full question: 'いつ?' = 'When?' It also combines: いつも (itsumo = always), いつか (itsuka = someday). '試験はいつですか' = 'When is the exam?'"},
    {"q":"You want to know who left this bag behind. What question word do you use?","type":"mc","options":["どこ (doko)","いつ (itsu)","どうして (doushite)","だれ (dare)"],"answer":3,"explanation":"だれ (dare) = who. 'これはだれのかばんですか' = 'Whose bag is this?' 'だれが来ましたか' = 'Who came?' In more formal/polite contexts, どなた (donata) is the respectful equivalent of dare. 'あの人はだれですか' = 'Who is that person?' Note: dare + の (possessive particle) = 'whose' — 'だれの?' is a very common question pattern."},
    {"q":"Which adjective means 'small' in Japanese?","type":"mc","options":["大きい (ookii)","長い (nagai)","小さい (chiisai)","安い (yasui)"],"answer":2,"explanation":"小さい (ちいさい, chiisai) = small / little. '小さい犬ですね' = 'What a small dog!' It is the opposite of 大きい (ookii = big). The kanji 小 depicts three small strokes — a pictograph of something tiny. Compounds using 小: 小学校 (shougakkou = elementary school), 小説 (shousetsu = novel), 小鳥 (kotori = small bird). The adverb form: 小さく (chiisaku = in a small way)."},
    {"q":"How do you say 'long' as an adjective in Japanese (as in a long road)?","type":"mc","options":["短い (mijikai)","高い (takai)","広い (hiroi)","長い (nagai)"],"answer":3,"explanation":"長い (ながい, nagai) = long (in size/length). '長い道ですね' = 'It's a long road.' Opposite: 短い (mijikai = short). The kanji 長 depicts long flowing hair — a pictograph of an elder with long hair. Compounds: 長所 (chousho = strong point), 社長 (shachou = company president), 長男 (chounan = eldest son). Also used for time: '長い時間' (nagai jikan = a long time)."},
    {"q":"You find a great deal at a market. Which adjective describes something 'cheap' or 'inexpensive'?","type":"mc","options":["高い (takai)","安い (yasui)","重い (omoi)","難しい (muzukashii)"],"answer":1,"explanation":"安い (やすい, yasui) = cheap / inexpensive. 'このりんごは安いですね' = 'These apples are cheap!' Opposite: 高い (takai = expensive / high). Note: 高い means BOTH 'expensive' and 'tall/high' — context determines which. 安い comes from 安 (an) meaning 'peace/safe/cheap.' Compounds: 安心 (anshin = peace of mind), 安全 (anzen = safety). To ask for a lower price: '安くしてください' = 'Please make it cheaper.'"},
    {"q":"You don't understand what someone said. Which phrase do you use?","type":"mc","options":["知りません (shirimasen)","できません (dekimasen)","わかりません (wakarimasen)","見えません (miemasen)"],"answer":2,"explanation":"わかりません (wakarimasen) = 'I don't understand / I don't know.' From わかる (wakaru = to understand). '日本語がわかりません' = 'I don't understand Japanese.' Contrast with 知りません (shirimasen = I don't know [a fact/person]), which implies lack of knowledge rather than comprehension. 'もう一度言ってください' (mou ichido itte kudasai = Please say it one more time) pairs naturally with wakarimasen."},
    {"q":"When leaving home in Japan, one person says '行ってきます' (Ittekimasu). What does this express, and what is the expected response?","type":"mc","options":["'I'm home!' — response: 'Welcome back!'","'I'm leaving, I'll be back' — response: '行ってらっしゃい (Itterasshai)'","'Good morning' — response: 'Good morning'","'Thank you for the meal' — response: 'Please enjoy'"],"answer":1,"explanation":"'行ってきます' (ittekimasu) literally means 'I will go and come back.' It's said when leaving home, implying you'll return. The response from those staying home is '行ってらっしゃい' (itterasshai) = 'Go and come back safely / Have a good trip.' This exchange is a fundamental daily ritual in Japanese family life — deeply embedded in the culture of acknowledging departures and returns."},
    {"q":"Someone returns home and calls out 'ただいま!' (Tadaima). What is the correct response from those inside?","type":"mc","options":["行ってらっしゃい (Itterasshai)","おやすみなさい (Oyasumi nasai)","おかえりなさい (Okaerinasai)","いただきます (Itadakimasu)"],"answer":2,"explanation":"'ただいま' (tadaima) = 'I'm home!' (literally 'just now'). The proper response is 'おかえりなさい' (okaerinasai) = 'Welcome back!' (from 帰る kaeru = to return). This homecoming ritual mirrors the departure ritual (行ってきます/行ってらっしゃい). These four expressions — ittekimasu, itterasshai, tadaima, okaerinasai — form two matched pairs that are essential to Japanese daily life. Omitting them can seem cold or rude."}
  ],
  "japanese_n4": [
    {"q":"What does 'Kaizen' (改善) mean?","type":"mc","options":["Innovation breakthrough","Continuous improvement","Team harmony","Respect hierarchy"],"answer":1,"explanation":"'Kaizen' (改善) = continuous improvement. 改 (kai) = change, 善 (zen) = good. Toyota's production system made it globally famous. It emphasizes small, incremental improvements by all workers rather than top-down innovation — a core principle of lean manufacturing."},
    {"q":"What is 'Hanami' (花見)?","type":"mc","options":["A traditional flower-arranging discipline","Cherry blossom viewing picnics in spring","A summer fireworks festival","An autumn harvest ceremony"],"answer":1,"explanation":"'Hanami' (花 = flower, 見 = viewing) is Japan's beloved spring tradition of picnicking under blooming sakura (cherry trees). Companies, schools, and families reserve spots in parks weeks in advance. The bloom period lasts only 1–2 weeks, making it feel precious and fleeting."},
    {"q":"What does 'Salaryman' (サラリーマン) refer to?","type":"mc","options":["A government tax collector","A full-time white-collar male corporate employee","A part-time retail worker","A stockbroker"],"answer":1,"explanation":"'Salaryman' (from English 'salary' + man) describes Japan's white-collar office workers, especially at large corporations. Historically associated with lifelong employment, extreme loyalty, after-work drinking (nomikai), and long hours. Work-life balance reform has slowly shifted this culture."},
    {"q":"What is Origami (折り紙)?","type":"mc","options":["Japanese calligraphy","The art of paper folding","Traditional Japanese ink painting","A form of martial arts"],"answer":1,"explanation":"Origami (折り = fold, 紙 = paper) is the art of creating sculptures purely by folding paper — no cuts, no glue. The crane (tsuru) is the most iconic form. Japanese legend says folding 1,000 cranes (senbazuru) grants a wish. Now a respected art form and engineering inspiration (origami solar panels, stents)."},
    {"q":"What does 'Wakarimashita' (わかりました) mean?","type":"mc","options":["I don't understand","I understand / I got it","Please repeat that","Let me think about it"],"answer":1,"explanation":"'Wakarimashita' is the polite past form of 'wakaru' (to understand). In meetings and daily work, it confirms comprehension of instructions. 'Wakarimasen' means 'I don't understand.' The casual version is 'Wakatta' or simply 'Okay.'"},
    {"q":"What does 'Karaoke' (カラオケ) literally mean?","type":"mc","options":["Singing competition","Empty orchestra","Stage performance","Voice practice"],"answer":1,"explanation":"'Karaoke' = kara (空 = empty) + oke (short for okesutora = orchestra). Literally 'empty orchestra.' Invented in Japan around 1971 by Daisuke Inoue. Karaoke boxes (private rooms for groups) are the dominant format in Japan — very different from the bar-stage format in the West."},
    {"q":"What does 'Bento' (弁当) refer to?","type":"mc","options":["A Japanese hot pot dish","A single-portion meal in a divided box","A type of ramen noodle","A tea ceremony implement"],"answer":1,"explanation":"A bento is a portioned meal packed in a divided box — typically rice, protein, and vegetables. Sold at convenience stores (konbini), train stations (ekiben), and made lovingly at home. 'Kyara-ben' (character bento) features food sculpted to look like anime characters."},
    {"q":"What does 'Manga' (漫画) refer to?","type":"mc","options":["Japanese animated films","Japanese comic books and graphic novels","A style of Japanese theater","Traditional Japanese poetry"],"answer":1,"explanation":"Manga (漫画) are Japanese comics read right-to-left. Covering virtually every genre, manga have massive global reach — One Piece, Naruto, and Dragon Ball are international phenomena. 'Anime' is animated adaptations of manga or original animation. The industries are deeply intertwined."},
    {"q":"What is 'Senpai' (先輩)?","type":"mc","options":["A junior colleague or student","A senior colleague, upperclassman, or mentor","A strict manager","A respected community elder"],"answer":1,"explanation":"'Senpai' (先 = before/prior, 輩 = colleague) refers to someone more senior in school or work. The junior is 'kouhai' (後輩). The senpai-kouhai relationship governs mentorship, deference, and social dynamics in schools, clubs, and workplaces throughout Japan."},
    {"q":"What is 'Kaisha' (会社)?","type":"mc","options":["A traditional Japanese inn","A company or corporation","A formal business meeting","A type of Japanese green tea"],"answer":1,"explanation":"'Kaisha' (会社) means company or corporation — 会 (kai) = gathering/association, 社 (sha) = organization. 'Kaishain' (会社員) = company employee. You'll see 社 in many company names. Understanding this kanji helps decode Japanese business signs and documents."},
    {"q":"How do you say 'Nice to meet you' for the first time in Japanese?","type":"mc","options":["Yoroshiku onegaishimasu","Hajimemashite","Otsukaresama deshita","Shitsurei shimasu"],"answer":1,"explanation":"'Hajimemashite' (はじめまして) literally means 'for the first time' and is used when meeting someone new — equivalent to 'how do you do' or 'pleased to meet you.' It's almost always followed by 'Yoroshiku onegaishimasu' (よろしくおねがいします) — please treat me favorably — the indispensable phrase for building new relationships."},
    {"q":"What does 'Yoroshiku onegaishimasu' (よろしくおねがいします) express?","type":"mc","options":["Thank you for your hard work","I'm sorry for the inconvenience","Please treat me well / I'm counting on you","Congratulations on your achievement"],"answer":2,"explanation":"'Yoroshiku onegaishimasu' has no perfect English equivalent. It expresses a request for goodwill — used when meeting someone, starting a project, asking a favor, or closing an email. In business it signals: 'I'm counting on your cooperation.' One of the most versatile and essential phrases in Japanese professional life."},
    {"q":"What does 'Shitsurei shimasu' (失礼します) mean in a business context?","type":"mc","options":["I quit / I resign","Excuse me for my rudeness — used when entering/leaving a room or interrupting","I made a mistake","Please let me speak"],"answer":1,"explanation":"'Shitsurei shimasu' (失礼 = rudeness, shimasu = to do) is a polite formula used when doing something potentially rude: entering a superior's office, leaving a meeting early, or interrupting. 'Shitsurei shimashita' (past tense) = excuse the rudeness I just committed. Essential in Japanese office etiquette."},
    {"q":"What does 'Otsukaresama deshita' (お疲れ様でした) mean?","type":"mc","options":["Good morning, let's do our best today","You must be tired — thank you for your hard work","Sorry to keep you waiting","Please take care on your way home"],"answer":1,"explanation":"'Otsukaresama deshita' is said at the end of the workday — 'thank you for your hard work / you've worked hard.' It acknowledges colleagues' efforts and marks the transition from work. 'Otsukare' (お疲れ) alone is the casual version. Indispensable in Japanese workplaces, said to anyone you see leaving."},
    {"q":"What does 'takai' (高い) mean?","type":"mc","options":["Cheap / inexpensive","Old","Tall / High / Expensive","New"],"answer":2,"explanation":"'Takai' (高い) means both tall/high and expensive — context determines meaning. '山が高い' (yama ga takai) = the mountain is tall; 'nedan ga takai' (値段が高い) = the price is expensive. Its antonym 'yasui' (安い) means cheap or inexpensive. This dual-meaning adjective trips up many learners."},
    {"q":"What does 'muzukashii' (難しい) mean?","type":"mc","options":["Easy","Interesting","Fun / enjoyable","Difficult"],"answer":3,"explanation":"'Muzukashii' (難しい) = difficult. Japanese adjectives end in い (i-adjectives) or な (na-adjectives). Other useful i-adjectives: yasashii (easy/kind), tanoshii (fun), isogashii (busy), atarashii (new), furui (old), ii/yoi (good), warui (bad), hayai (fast/early)."},
    {"q":"What does 'isogashii' (忙しい) mean?","type":"mc","options":["Free / available","Bored","Busy","Tired"],"answer":2,"explanation":"'Isogashii' (忙しい) = busy. A common workplace phrase: 'ima isogashii desu' = I'm busy right now. In Japanese work culture, saying you're busy is socially understood — it's why 'otsukaresama' resonates so deeply. The kanji 忙 combines 心 (heart/mind) + 亡 (perishing) — literally, one's heart is dying from busyness."},
    {"q":"What does 'Shachō' (社長) mean?","type":"mc","options":["Department manager","Section chief","Company president / CEO","General staff member"],"answer":2,"explanation":"Shachō (社長) = company president or CEO. Other business titles: buchō (部長) = department head, kachō (課長) = section manager/chief, kakaricho (係長) = team leader, hiraain (平社員) = general staff. Using someone's title instead of their name is standard Japanese business etiquette — 'Tanaka-shachō' rather than just 'Tanaka-san.'"},
    {"q":"What does 'buchō' (部長) mean in a Japanese company?","type":"mc","options":["Company president","Department head / general manager","Section chief","Board of directors member"],"answer":1,"explanation":"Buchō (部長) = department head or general manager — typically the head of a department (bu). The hierarchy: shachō (president) → fuku-shachō (VP) → buchō (dept. head) → kachō (section chief) → kakaricho (team leader) → hiraain (staff). Addressing someone with their title is a sign of respect in Japanese business culture."},
    {"q":"What is 'onigiri' (おにぎり)?","type":"mc","options":["A Japanese rice wine","A triangular or round rice ball, often with a filling, wrapped in nori seaweed","A type of Japanese doughnut","A grilled rice cake served with soy sauce"],"answer":1,"explanation":"Onigiri are hand-shaped rice balls (triangle, cylinder, or round) often filled with umeboshi (pickled plum), salmon, tuna mayo, or konbu, wrapped in nori. Ubiquitous in convenience stores (konbini) — sold fresh with a clever wrapper that keeps nori crispy until opened. Japan's original fast food; eaten since the Yayoi period."},
    {"q":"What does 'hanasu' (話す) mean?","type":"mc","options":["To read","To write","To speak / talk","To listen"],"answer":2,"explanation":"'Hanasu' (話す) = to speak or talk. Polite: 'hanashimasu.' Related: 'kaku' (書く, to write), 'yomu' (読む, to read), 'kiku' (聞く, to listen/ask). 'Nihongo o hanashimasu ka?' = Do you speak Japanese? The kanji 話 (hanashi) also means 'story' or 'conversation' — appearing in 'denwa' (電話, telephone; literally 'electric talk')."},
    {"q":"What does '日本' (Nihon/Nippon) mean literally?","type":"mc","options":["Island nation","Eastern land","Origin of the sun / Land of the Rising Sun","Land of harmony"],"answer":2,"explanation":"日本 = Nihon or Nippon: 日 (sun) + 本 (origin/base/root). Literally: 'origin of the sun' — Japan lies to the east where the sun rises as seen from China. Western name 'Japan' derives from Marco Polo's 'Cipangu,' from Chinese pronunciation. 'Nippon' is more formal (used on currency and stamps); 'Nihon' is more common in speech."},
    {"q":"What is Mount Fuji (富士山) famous for?","type":"mc","options":["Being Japan's oldest volcano, inactive for millennia","Being Japan's highest mountain at 3,776m and a UNESCO World Heritage cultural site","Being permanently snow-capped year-round","Hosting Japan's most famous annual cherry blossom festival"],"answer":1,"explanation":"Fuji-san (3,776m) is Japan's highest peak and an active stratovolcano — last erupted in 1707. Visible from Tokyo on clear days, it's a cultural icon featured in Hokusai's 'Thirty-Six Views of Mount Fuji.' Designated a UNESCO Cultural Heritage site (2013) for its spiritual significance and influence on Japanese art and religion."},
    {"q":"What is the difference between anime and manga?","type":"mc","options":["Anime is Japanese comics; manga is Japanese animation","Manga is Japanese printed comics; anime is animated film/TV — often based on manga","They are the same thing with different regional names","Manga is full-color; anime is black and white"],"answer":1,"explanation":"Manga = Japanese comics/graphic novels (printed, black and white, read right-to-left). Anime = animated film/TV (often adaptations of manga or original works). The relationship is symbiotic: successful manga are adapted into anime; anime boosts manga sales. Global examples: One Piece, Attack on Titan, Demon Slayer, Studio Ghibli films."},
    {"q":"What is a 'konbini' (コンビニ) in Japan?","type":"mc","options":["A traditional Japanese craft market","A Japanese convenience store — open 24/7, selling food, services, and daily necessities","A community center in Japanese neighborhoods","A type of Japanese vending machine cluster"],"answer":1,"explanation":"Konbini (convenience store) is a Japanese institution: open 24/7, immaculately clean, selling fresh onigiri, bento, hot foods, coffee, bills payment, ATM, printing, and more. Major chains: 7-Eleven, FamilyMart, Lawson. Japan has ~55,000 konbini nationally. Fresh food quality rivals many restaurants. A cornerstone of Japanese daily life."},
    {"q":"What does 'Moshi moshi' (もしもし) mean and when is it used?","type":"mc","options":["Hello, nice to meet you — used for introductions","Hello — used specifically when answering the telephone","Good morning — used before 10am","Excuse me — used to get someone's attention"],"answer":1,"explanation":"'Moshi moshi' is used exclusively when answering the phone — Japan's telephone greeting. Its origin: early telephone operators said 'moushimasu, moushimasu' (I speak, I speak) to announce themselves; this shortened to 'moshi moshi.' Interestingly, ghosts (in folklore) can't say 'moshi moshi' — so it also historically confirmed you were talking to a real person."},
    {"q":"What does 'Gambatte' (頑張って) express?","type":"mc","options":["Congratulations on your achievement","Good luck / Do your best / Hang in there","Thank you for everything","Take care on your way home"],"answer":1,"explanation":"'Gambatte' (がんばって) or 'ganbatte kudasai' = do your best / hang in there / good luck — encouragement before or during a challenge. 'Ganbarimasu' (I will do my best) is the response when receiving a challenge. Deeply embedded in Japanese culture — effort (gaman = perseverance) is highly valued. Used before exams, sports, difficult projects."},
    {"q":"What does 'Daijoubu' (大丈夫) mean?","type":"mc","options":["I'm sorry / please forgive me","It's fine / It's okay / Are you alright?","I don't understand","Please wait a moment"],"answer":1,"explanation":"'Daijoubu' (大丈夫) = it's fine, okay, alright. Used to reassure: 'daijoubu desu ka?' = are you okay? / is that alright? 'Daijoubu desu' = I'm fine / it's okay. Also used to politely decline: offered a refill, respond 'daijoubu desu' to mean 'no thank you, I'm okay.' One of the most versatile phrases in everyday Japanese."},
    {"q":"What does 'Sugoi' (すごい) mean?","type":"mc","options":["How boring / how ordinary","Amazing / incredible / wow","I'm hungry / exhausted","That's embarrassing"],"answer":1,"explanation":"'Sugoi' (すごい) = amazing, incredible, or wow — a versatile exclamation of surprise or admiration. 'Sugoi ne!' = Isn't that amazing! Like many Japanese adjectives, it can intensify: 'meccha sugoi' (super amazing, Kansai slang) or 'cho sugoi' (so amazing). One of the most frequently heard words in conversational Japanese."},
    {"q":"What does 'yoyaku' (予約) mean?","type":"mc","options":["Cancellation","An urgent request","Reservation / booking","A formal introduction"],"answer":2,"explanation":"'Yoyaku' (予約) = reservation or booking. 予 (yo) = in advance, 約 (yaku) = promise/appointment. Essential for restaurants, hotels, clinics, and hair salons in Japan. 'Yoyaku shitai no desu ga...' = I'd like to make a reservation. 'Yoyaku nashi de daijoubu desu ka?' = Is it okay without a reservation?"},
    {"q":"What does 'kimochi' (気持ち) mean?","type":"mc","options":["Physical strength","Important task","Direction or orientation","Feeling / mood / sensation"],"answer":3,"explanation":"'Kimochi' (気持ち) = feeling, mood, or physical sensation. 気 (ki) = spirit/energy, 持ち (mochi) = having/holding. 'Kimochi ii' = feels good. 'Kimochi warui' = feels bad/unpleasant. Used for both emotional and physical states — 'atama ga kimochi warui' = my head feels bad (nauseous). One of the most expressive and versatile words in everyday Japanese."},
